*{
  box-sizing:border-box;

}

body{
  margin:0;
  min-height:100vh;
  background:

  color:#fff;
  font-family:"Cairo",sans-serif;
}

.game{
  width:min(100%,600px);
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  margin:5px 0 15px;
  color:#ffd700;
  font-size:25px;
  text-shadow:0 0 15px rgba(255,215,0,.35);
}

.stats{
  display:grid;
  grid-template-columns:1fr 70px 1fr;
  gap:7px;
  background:#111;
  padding:9px;
  border-radius:15px;
  border:1px solid #333;
}

.player-stat{
  background:#080808;
  border-radius:11px;
  padding:8px;
  text-align:center;
}

.blue{
  border:1px solid #008cff;
  box-shadow:0 0 10px rgba(0,140,255,.15);
}

.red{
  border:1px solid #ff4040;
  box-shadow:0 0 10px rgba(255,64,64,.15);
}

.blue-text{
  color:#00aaff;
}

.red-text{
  color:#ff5050;
}

.player-small-name{
  font-weight:900;
  font-size:13px;
}

.money{
  color:#00ff88;
  font-size:11px;
  font-weight:900;
  direction:ltr;
}

.round{

  justify-content:center;

  color:#ffd700;
  font-weight:900;

.turn-box{

.turn{

  border:1px solid #333;
  border-radius:14px;
  padding:7px;
}

.team h3{
  margin:4px;
  text-align:center;
  font-size:14px;
}

  min-height:55px;

  border-radius:9px;
  margin:5px 0;
  padding:5px;
}

.slot.filled{
  border-color:#ffd700;
}

.slot.legend-slot{
  background:linear-gradient(135deg,#251d00,#090909);

}

.slot.gold-slot{
  background:linear-gradient(135deg,#2a2100,#090909);
  border-color:#d6ad00;
}

.slot.silver-slot{

.slot-pos{

.slot-name{

  font-size:11px;

.slot-card-type{
  font-size:8px;

.player-card{

.player-card.silver-card{

  font-weight:900;

.legend-type{
  background:linear-gradient(90deg,#a87800,#ffd700,#a87800);

.gold-type{
  background:linear-gradient(90deg,#9c7800,#e9c84a,#9c7800);

.silver-type{

.position{

.player-name-big{

.price{

.controls{
  display:grid;
  gap:7px;

.bid-input{
  width:100%;
  padding:12px;

  color:#fff;
  border:1px solid #555;
  border-radius:10px;
  text-align:center;
  font-family:"Cairo";
  font-weight:700;

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;

button{
  border:0;
  border-radius:10px;
  padding:11px 5px;
  font-family:"Cairo";
  font-weight:900;
  cursor:pointer;
  transition:.2s;

button:active{
  transform:scale(.96);
}

button:disabled{
  opacity:.35;
  cursor:not-allowed;

.bid-btn{
  background:#00d978;
  color:#000;
}

.take-btn{
  background:#e53935;
  color:#fff;

.skip-btn{
  background:#555;
  color:#fff;

.message{

  margin-top:8px;
  text-align:center;
  font-size:11px;

.match{

params.get("name")||`لاعب ${playerNum}`;

function cleanName(name){

if(!name)return"لاعب";

return name
.split("@")[0]
.split(".")[0]
.slice(0,15);

========================================================= */

"room-"+

window.location.pathname+

"&p="+playerNum+
"&name="+
encodeURIComponent(myRealName);

window.history.replaceState(
{},

(index%10)*1500000;

}

return{

n:name,
p:price,
ovr:ovr,
type:level,
position:position

});

========================================================= */

?"CM"

}


/* =========================================================

========================================================= */

function random(arr){

];

);

if(!available.length){

available=playersDB[key];

}

return random(available);

}


/* =========================================================
INITIAL STATE
========================================================= */

function createInitialState(){

const firstPlayer=
getRandomPlayer("GK",[]);

return{

pos:0,

player:firstPlayer,

bid:firstPlayer.p,

turn:1,

m1:START_MONEY,

m2:START_MONEY,

t1:Array(5).fill(null),

t2:Array(5).fill(null),

used:[firstPlayer.n],

gameOver:false,

matchStarted:false,

matchFinished:false,

match:null

};

}


/* =========================================================
BUILD TEAMS
========================================================= */

positions.forEach((position,index)=>{

document.getElementById("t1")
.innerHTML+=`

<div class="slot" id="t1-${index}">

<div class="slot-pos">
${position}
</div>

<div class="slot-name">
-
</div>

<div class="slot-card-type">
</div>

</div>
`;

document.getElementById("t2")
.innerHTML+=`

<div class="slot" id="t2-${index}">

<div class="slot-pos">
${position}
</div>

<div class="slot-name">
-
</div>

<div class="slot-card-type">
</div>

</div>
`;

});


let state=null;

let matchInterval=null;


/* =========================================================
CREATE ROOM
========================================================= */

roomRef.transaction(data=>{

if(!data){

data={};

}

if(playerNum===1){

data.name1=myRealName;

}

else{

data.name2=myRealName;

}

if(!data.name1){

data.name1="اللاعب 1";

}

if(!data.name2){

data.name2="اللاعب 2";

}

data.started=true;

if(!data.state){

data.state=createInitialState();

}

return data;

});


/* =========================================================
LISTENER
========================================================= */

roomRef.on(
"value",
snapshot=>{

const data=snapshot.val();

if(!data)return;

document.getElementById("myName")
.innerText=
playerNum===1
?(data.name1||"اللاعب 1")
:(data.name2||"اللاعب 2");


document.getElementById("enemyName")
.innerText=
playerNum===1
?(data.name2||"اللاعب 2")
:(data.name1||"اللاعب 1");


document.getElementById("matchTeam1")
.innerText=
data.name1||"اللاعب 1";


document.getElementById("matchTeam2")
.innerText=
data.name2||"اللاعب 2";


if(data.state){

state=data.state;

renderGame();

}

}
);


/* =========================================================
MESSAGE
========================================================= */

function showMessage(text){

document.getElementById("message")
.innerText=text;

setTimeout(()=>{

if(
document.getElementById("message")
.innerText===text
){

document.getElementById("message")
.innerText="";

}

},2500);

}


/* =========================================================
RENDER
========================================================= */

function renderGame(){

if(!state)return;

const myMoney=
playerNum===1
?state.m1
:state.m2;

const enemyMoney=
playerNum===1
?state.m2
:state.m1;


document.getElementById("myMoney")
.innerText=
Number(myMoney)
.toLocaleString();


document.getElementById("enemyMoney")
.innerText=
Number(enemyMoney)
.toLocaleString();


document.getElementById("count")
.innerText=
`${Math.min(state.pos+1,5)} / 5`;


renderTeams();


if(state.gameOver){

document.getElementById("auctionCard")
.style.display="none";

startMatchUI();

return;

}


document.getElementById("auctionCard")
.style.display="block";


const player=state.player;


document.getElementById("position")
.innerText=
positions[state.pos];


document.getElementById("playerName")
.innerText=
player.n;


document.getElementById("ovr")
.innerText=
player.ovr;


document.getElementById("price")
.innerText=
"$"+
Number(state.bid)
.toLocaleString();


const currentInput=
Number(
document.getElementById("bidInput").value
);

if(
!currentInput||
currentInput<=state.bid
){

document.getElementById("bidInput")
.value=
state.bid+MIN_BID_STEP;

}


const myTurn=
state.turn===playerNum;


document.getElementById("turn")
.innerText=
myTurn
?"🔥 دورك الآن"
:"⏳ دور الخصم";


document.getElementById("bidBtn")
.disabled=!myTurn;

document.getElementById("takeBtn")
.disabled=!myTurn;

document.getElementById("skipBtn")
.disabled=!myTurn;


const card=
document.getElementById("auctionCard");

const type=
document.getElementById("playerType");


card.className="player-card";


if(player.type==="legend"){

card.classList.add("legend-card");

type.className=
"player-type legend-type";

type.innerText=
"👑 ICON LEGEND";

}

else if(player.type==="gold"){

card.classList.add("gold-card");

type.className=
"player-type gold-type";

type.innerText=
"⭐ GOLD ELITE";

}

else{

card.classList.add("silver-card");

type.className=
"player-type silver-type";

type.innerText=
"⚪ SILVER PLAYER";

}

}


/* =========================================================
RENDER TEAMS
========================================================= */

function renderTeams(){

["t1","t2"].forEach(team=>{

state[team]
.forEach((player,index)=>{

const slot=
document.getElementById(
`${team}-${index}`
);

slot.className="slot";

const name=
slot.querySelector(".slot-name");

const type=
slot.querySelector(".slot-card-type");


if(!player){

name.innerText="-";

type.innerText="";

return;

}


slot.classList.add("filled");

name.innerText=player.n;


if(player.type==="legend"){

slot.classList.add(
"legend-slot"
);

type.innerText="👑 ICON";

}

else if(player.type==="gold"){

slot.classList.add(
"gold-slot"
);

type.innerText="⭐ GOLD";

}

else{

slot.classList.add(
"silver-slot"
);

type.innerText="⚪ SILVER";

}

});

});

}


/* =========================================================
BID
========================================================= */

function bid(){

const value=
Number(
document.getElementById("bidInput").value
);


if(
!Number.isFinite(value)||
value<=0
){

showMessage(
"❌ اكتب مبلغ صحيح"
);

return;

}


roomRef.transaction(data=>{

if(!data||!data.state){

return;

}


const s=data.state;


if(s.gameOver){

return;

}


if(s.turn!==playerNum){

return;

}


const money=
playerNum===1
?s.m1
:s.m2;


if(
value<
s.bid+MIN_BID_STEP
){

return;

}


if(value>money){

return;

}


s.bid=value;


s.turn=
playerNum===1
?2
:1;


return data;

},
(error,committed)=>{

if(error){

showMessage(
"❌ حدث خطأ في المزايدة"
);

}

else if(!committed){

showMessage(
"❌ لا يمكن تنفيذ المزايدة"
);

}

else{

showMessage(
"💰 تمت المزايدة!"
);

}

});

}


/* =========================================================
TAKE PLAYER
========================================================= */

function takePlayer(){

roomRef.transaction(data=>{

if(!data||!data.state){

return;

}


const s=data.state;


if(
s.gameOver||
s.turn!==playerNum
){

return;

}


if(playerNum===1){

if(s.bid>s.m1){

return;

}


s.m1-=s.bid;

s.t1[s.pos]=s.player;

}

else{

if(s.bid>s.m2){

return;

}


s.m2-=s.bid;

s.t2[s.pos]=s.player;

}


nextPosition(s);

return data;

},
(error,committed)=>{

if(error){

showMessage(
"❌ حدث خطأ"
);

}

else if(committed){

showMessage(
"🔥 تم شراء اللاعب!"
);

}

});

}


/* =========================================================
SKIP
========================================================= */

function skipPlayer(){

roomRef.transaction(data=>{

if(!data||!data.state){

return;

}


const s=data.state;


if(
s.gameOver||
s.turn!==playerNum
){

return;

}


const key=
positionKey(
positions[s.pos]
);


let available1=
playersDB[key]
.filter(player=>
player.p<=s.m1
);


if(!available1.length){

available1=
playersDB[key];

}


const player1=
random(available1);


let available2=
playersDB[key]
.filter(player=>
player.p<=s.m2&&
player.n!==player1.n
);


if(!available2.length){

available2=
playersDB[key]
.filter(player=>
player.n!==player1.n
);

}


const player2=
random(available2);


s.t1[s.pos]=player1;

s.t2[s.pos]=player2;


s.m1=
Math.max(
0,
s.m1-player1.p
);


s.m2=
Math.max(
0,
s.m2-player2.p
);


s.used=[
...(s.used||[]),
player1.n,
player2.n
];


nextPosition(s);


return data;

},
(error,committed)=>{

if(error){

showMessage(
"❌ حدث خطأ"
);

}

else if(committed){

showMessage(
"⏭ تم توزيع لاعبين عشوائيًا"
);

}

});

}


/* =========================================================
NEXT POSITION
========================================================= */

function nextPosition(s){

s.pos++;


if(
s.pos>=positions.length
){

s.gameOver=true;

s.matchStarted=false;

return;

}


const nextPlayer=
getRandomPlayer(
positions[s.pos],
s.used||[]
);


s.player=nextPlayer;

s.bid=nextPlayer.p;

s.turn=1;


s.used=[

...(s.used||[]),

nextPlayer.n

];

}


/* =========================================================
MATCH UI
========================================================= */

function startMatchUI(){

document.getElementById("match")
.style.display="block";


if(
state.matchFinished
){

renderFinishedMatch();

return;

}


if(
playerNum===1&&
!state.matchStarted
){

startMatch();

}

else if(state.match){

renderLiveMatch();

}

}


/* =========================================================
START MATCH
========================================================= */

function startMatch(){

roomRef.transaction(data=>{

if(!data||!data.state){

return;

}


const s=data.state;


if(s.matchStarted){

return;

}


s.matchStarted=true;


const team1Strength=
getTeamStrength(s.t1);

const team2Strength=
getTeamStrength(s.t2);


const possession1=
Math.floor(
48+
(team1Strength-team2Strength)/4+
Math.random()*8
);


const safePossession1=
Math.max(
35,
Math.min(
65,
possession1
)
);


s.match={

minute:0,

score1:0,

score2:0,

possession1:safePossession1,

possession2:
100-safePossession1,

shots1:0,

shots2:0,

shotsTarget1:0,

shotsTarget2:0,

corners1:0,

corners2:0,

yellow1:0,

yellow2:0,

red1:0,

red2:0,

events:[],

motm:null,

winner:null

};


return data;

});

}


/* =========================================================
TEAM STRENGTH
========================================================= */

function getTeamStrength(team){

return team.reduce(
(total,p)=>
total+(p?p.ovr:70),
0
);

}


/* =========================================================
LIVE MATCH
========================================================= */

function renderLiveMatch(){

if(!state.match)return;

const m=state.match;


document.getElementById("matchMinute")
.innerText=
`⏱️ الدقيقة ${m.minute}`;


document.getElementById("matchScore")
.innerText=
`${m.score1} - ${m.score2}`;


const log=
document.getElementById("matchLog");

log.innerHTML="";


(m.events||[])
.slice()
.reverse()
.forEach(event=>{

const div=
document.createElement("div");

div.className="event";

div.innerText=event.text;

log.appendChild(div);

});


if(
!state.matchFinished&&
playerNum===1&&
!matchInterval
){

matchInterval=setInterval(
simulateMinute,
700
);

}

}


/* =========================================================
SIMULATE MINUTE
========================================================= */

function simulateMinute(){

roomRef.transaction(data=>{

if(!data||!data.state){

return;

}


const s=data.state;


if(
!s.matchStarted||
s.matchFinished||
!s.match
){

return;

}


const m=s.match;


m.minute++;


simulateEvent(s);


if(m.minute>=90){

finishMatch(s);

}


return data;

});


}


/* =========================================================
MATCH EVENTS
========================================================= */

function simulateEvent(s){

const m=s.match;


const roll=
Math.random();


const team1Chance=
m.possession1/100;


function addEvent(text,type){

m.events.push({

minute:m.minute,

text:`${m.minute}' ${text}`,

type:type

});


if(m.events.length>35){

m.events.shift();

}

}


/* GOAL */

if(roll<0.075){

const team1=
Math.random()<team1Chance;

const team=
team1?s.t1:s.t2;

const scorer=
random(team.filter(Boolean));


if(team1){

m.score1++;

m.shots1++;

m.shotsTarget1++;

}

else{

m.score2++;

m.shots2++;

m.shotsTarget2++;

}


addEvent(
`⚽ هدف! ${scorer.n}`,
"goal"
);

return;

}


/* SHOT */

if(roll<0.20){

const team1=
Math.random()<team1Chance;

if(team1){

m.shots1++;

if(Math.random()<.45){

m.shotsTarget1++;

}

}

else{

m.shots2++;

if(Math.random()<.45){

m.shotsTarget2++;

}

}


addEvent(
"🎯 تسديدة خطيرة",
"shot"
);

return;

}


/* CORNER */

if(roll<0.30){

const team1=
Math.random()<team1Chance;

if(team1){

m.corners1++;

}

else{

m.corners2++;

}


addEvent(
"🚩 ركلة ركنية",
"corner"
);

return;

}


/* YELLOW */

if(roll<0.35){

const team1=
Math.random()<.5;

if(team1){

m.yellow1++;

}

else{

m.yellow2++;

}


addEvent(
"🟨 بطاقة صفراء",
"yellow"
);

return;

}


/* RED */

if(roll<0.365){

const team1=
Math.random()<.5;

if(team1){

m.red1++;

}

else{

m.red2++;

}


addEvent(
"🟥 بطاقة حمراء!",
"red"
);

return;

}


/* ATTACK */

if(roll<0.52){

const team1=
Math.random()<team1Chance;

const team=
team1?s.t1:s.t2;

const attacker=
random(team.filter(Boolean));


addEvent(
`🔥 هجمة خطيرة بواسطة ${attacker.n}`,
"attack"
);

}

}


/* =========================================================
FINISH MATCH
========================================================= */

function finishMatch(s){

const m=s.match;


const allPlayers=[

...s.t1.map(p=>({
...p,
team:1
})),

...s.t2.map(p=>({
...p,
team:2
}))

];


const motm=
random(
allPlayers.filter(Boolean)
);


m.motm=motm;


if(m.score1>m.score2){

m.winner=1;

}

else if(m.score2>m.score1){

m.winner=2;

}

else{

m.winner=0;

}


s.matchFinished=true;


m.events.push({

minute:90,

text:"🏁 انتهت المباراة!",

type:"end"

});

}


/* =========================================================
MATCH FINISHED
========================================================= */

function renderFinishedMatch(){

if(matchInterval){

clearInterval(matchInterval);

matchInterval=null;

}


renderLiveMatch();


const m=state.match;


const stats=
document.getElementById("finalStats");

stats.style.display="block";


stats.innerHTML=`

<h3 style="text-align:center;color:#ffd700">
📊 إحصائيات المباراة
</h3>

<div class="stat-row">

<div>${m.possession1}%</div>

<div class="stat-label">
الاستحواذ
</div>

<div>${m.possession2}%</div>

</div>


<div class="stat-row">

<div>${m.shots1}</div>

<div class="stat-label">
التسديدات
</div>

<div>${m.shots2}</div>

</div>


<div class="stat-row">

<div>${m.shotsTarget1}</div>

<div class="stat-label">
على المرمى
</div>

<div>${m.shotsTarget2}</div>

</div>


<div class="stat-row">

<div>${m.corners1}</div>

<div class="stat-label">
الركنيات
</div>

<div>${m.corners2}</div>

</div>


<div class="stat-row">

<div>🟨 ${m.yellow1}</div>

<div class="stat-label">
البطاقات
</div>

<div>🟨 ${m.yellow2}</div>

</div>


<div class="stat-row">

<div>🟥 ${m.red1}</div>

<div class="stat-label">
الطرد
</div>

<div>🟥 ${m.red2}</div>

</div>


<div class="motm">

<div>
⭐ رجل المباراة
</div>

<h2>
${m.motm?m.motm.n:"لا يوجد"}
</h2>

<div>
OVR ${m.motm?m.motm.ovr:""}
</div>

</div>

`;


document.getElementById("result")
.style.display="block";


let winnerText;


if(m.winner===1){

winnerText=
"🏆 اللاعب 1 فاز بالمباراة";

}

else if(m.winner===2){

winnerText=
"🏆 اللاعب 2 فاز بالمباراة";

}

else{

winnerText=
"🤝 انتهت المباراة بالتعادل";

}


document.getElementById("finalWinner")
.innerHTML=`

<div class="winner">
${winnerText}
</div>

<h1>
${m.score1} - ${m.score2}
</h1>

`;

}


/* =========================================================
DOM
========================================================= */

window.addEventListener(
"DOMContentLoaded",
()=>{

setTimeout(()=>{

if(state){

renderGame();

}

},500);

}
);

</script>
