*{

body{

  color:#fff;

  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background:
    linear-gradient(90deg,transparent 49%,#fff 50%,transparent 51%),

}

.game{
  width:min(100%,520px);

  padding:12px;
  position:relative;
  z-index:1;
}

.logo{
  text-align:center;

.logo span{

}

.subtitle{

  text-align:center;
  margin-bottom:12px;
}

   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  gap:5px;
  background:rgba(15,15,15,.95);
  border:1px solid #333;
  border-radius:16px;
  padding:10px;
  box-shadow:0 10px 30px #000;
}

.player-stat{
  padding:7px;
  border-radius:12px;
  background:#090909;
  overflow:hidden;
}

.player-stat.blue{
  border:1px solid #0088ff;
}

.player-stat.red{
  border:1px solid #ff3333;
}

.player-name{
  font-weight:900;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.money{
  font-size:12px;
  color:#00ff88;
  direction:ltr;
  font-weight:900;
}

.round{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:14px;
  color:#ffd700;
}

/* =========================
   TURN + TIMER
========================= */

.turn-box{
  margin:10px 0;
  padding:10px;
  border-radius:12px;

  border:1px solid #333;

}

.turn{
  font-weight:900;
  font-size:15px;
}

.timer-wrap{
  width:100%;
  height:8px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-top:8px;
}

.timer-bar{
  width:100%;
  height:100%;
  background:#00ff88;
  border-radius:10px;
  transition:width 1s linear;
}

/* =========================
   TEAMS
========================= */

.field{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.team{
  background:rgba(12,12,12,.96);
  border-radius:15px;
  padding:7px;
  border:1px solid #333;
}

.team-title{
  margin:2px 0 7px;
  font-size:15px;
  font-weight:900;
}

.blue-text{
  color:#00aaff;
}

.red-text{
  color:#ff4444;
}

.slot{
  min-height:50px;
  margin:5px 0;
  padding:6px;
  border-radius:9px;
  background:#050505;
  border:1px solid #333;
  font-size:10px;
  transition:.3s;
}

.slot.filled{
  border-color:#ffd700;
  box-shadow:0 0 12px rgba(255,215,0,.25);
}

.slot.legend-slot{
  border-color:#ffd700;
  background:linear-gradient(135deg,#201700,#080808);
}

.slot-pos{
  color:#888;
  font-size:9px;
}

.slot-name{
  font-weight:900;
  margin-top:2px;
}

/* =========================
   PLAYER CARD
========================= */

.player-card{
  position:relative;
  margin:12px 0;
  padding:18px;
  border-radius:22px;
  overflow:hidden;
  background:
    linear-gradient(145deg,#171717,#060606);
  border:2px solid #555;
  box-shadow:0 15px 40px #000;
}

.player-card.current-card{
  border-color:#00aaff;
}

.player-card.legend-card{
  border-color:#ffd700;
  box-shadow:
    0 0 20px rgba(255,215,0,.35),
    0 15px 40px #000;
}

.player-card.show-player{
  animation:playerEnter .6s cubic-bezier(.17,.67,.2,1.25);
}

@keyframes playerEnter{

  0%{
    transform:scale(.7) translateY(50px);
    opacity:0;
  }

  100%{
    transform:scale(1) translateY(0);
    opacity:1;
  }

}

.player-type{

  padding:4px 12px;
  border-radius:30px;
  font-size:11px;
  font-weight:900;

.current-type{
  background:#008cff;
}

.legend-type{
  background:#ffd700;

.player-content{

  margin:12px 0;

.ovr{

  display:flex;
  align-items:center;
  justify-content:center;

.ovr span{

.ovr small{

.player-main{

.position{

.player-name-big{

.bid-status{

.bid-input{

/* =====================================================
   AUDIO
===================================================== */

let audioContext;


function sound(
  frequency,
  duration
){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      .08,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime +
      duration
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      duration
    );

  }catch(e){}

}

/* =====================================================
   START GAME AUTOMATICALLY
===================================================== */

roomRef.transaction(data=>{

  if(!data){

    const firstPlayer =
      getRandomPlayer(
        "GK",
        []
      );


    return {

      name1:
        playerNum === 1
          ? myRealName
          : "اللاعب 1",

      name2:
        playerNum === 2
          ? myRealName
          : "اللاعب 2",

      started:true,

      state:{
        pos:0,
        player:firstPlayer,
        bid:firstPlayer.p,
        turn:1,
        m1:START_MONEY,
        m2:START_MONEY,
        t1:Array(5).fill(null),
        t2:Array(5).fill(null),
        used:[firstPlayer.n],
        gameOver:false,
        turnStartedAt:Date.now()
      }

    };

  }


  if(!data.started){

    data.started =
      true;

  }


  return data;

});


/* =====================================================
   STATE
===================================================== */

let state =
  null;

let timerInterval =
  null;


/* =====================================================
   FIREBASE LISTENER
===================================================== */

roomRef.on(
  "value",
  snap=>{

    const data =
      snap.val() || {};


    /* NAMES */

    const p1 =
      data.name1 ||
      "اللاعب 1";


    const p2 =
      data.name2 ||
      "اللاعب 2";


    document
      .getElementById("myName")
      .innerText =
        playerNum === 1
          ? p1
          : p2;


    document
      .getElementById("enemyName")
      .innerText =
        playerNum === 1
          ? p2
          : p1;


    /* STATE */

    if(data.state){

      state =
        data.state;


      renderGame();


      startTimer();

    }

  }
);


/* =====================================================
   RANDOM PLAYER
===================================================== */

function positionKey(pos){

  return pos.startsWith("CM")
    ? "CM"
    : pos;

}


function getRandomPlayer(
  position,
  used
){

  const key =
    positionKey(position);


  let available =
    playersDB[key]
      .filter(
        p=>
          !used.includes(p.n)
      );


  if(!available.length){

    available =
      playersDB[key];

  }


  return available[
    Math.floor(
      Math.random() *
      available.length
    )
  ];

}


/* =====================================================
   RENDER GAME
===================================================== */

function renderGame(){

  if(!state) return;


  document
    .getElementById("myMoney")
    .innerText =
      (
        playerNum === 1
          ? state.m1
          : state.m2
      )
      .toLocaleString();


  document
    .getElementById("enemyMoney")
    .innerText =
      (
        playerNum === 1
          ? state.m2
          : state.m1
      )
      .toLocaleString();


  document
    .getElementById("count")
    .innerText =
      state.gameOver
        ? "FIN"
        : `${state.pos + 1} / 5`;


  renderTeams();


  if(state.gameOver){

    showResult();

    return;

  }


  const player =
    state.player;


  document
    .getElementById("position")
    .innerText =
      positions[state.pos];


  document
    .getElementById("playerName")
    .innerText =
      player.n;


  document
    .getElementById("ovr")
    .innerText =
      player.ovr;


  document
    .getElementById("price")
    .innerText =
      "$" +
      state.bid.toLocaleString();


  document
    .getElementById("bidInput")
    .value =
      state.bid +
      MIN_BID_STEP;


  const type =
    document
      .getElementById("playerType");


  const card =
    document
      .getElementById("auctionCard");


  if(player.type === "legend"){

    type.innerText =
      "👑 أسطورة";

    type.className =
      "player-type legend-type";


    card.className =
      "player-card legend-card";

  }else{

    type.innerText =
      "🔥 لاعب حالي";

    type.className =
      "player-type current-type";


    card.className =
      "player-card current-card";

  }


  card.classList.remove(
    "show-player"
  );


  requestAnimationFrame(
    ()=>{

      card.classList.add(
        "show-player"
      );

    }
  );


  const myTurn =
    state.turn ===
    playerNum;


  const enemyName =
    document
      .getElementById(
        "enemyName"
      )
      .innerText;


  document
    .getElementById("turn")
    .innerText =
      myTurn
        ? "🔥 دورك الآن"
        : `⏳ دور ${enemyName}`;


  document
    .getElementById("bidBtn")
    .disabled =
      !myTurn;


  document
    .getElementById("takeBtn")
    .disabled =
      !myTurn;


  document
    .getElementById("skipBtn")
    .disabled =
      !myTurn;


  document
    .getElementById("bidStatus")
    .innerText =
      myTurn
        ? "💰 يمكنك المزايدة أو شراء اللاعب"
        : "⌛ انتظر دورك";

}


/* =====================================================
   RENDER TEAMS
===================================================== */

function renderTeams(){

  state.t1.forEach(
    (player,i)=>{

      const el =
        document.getElementById(
          `t1-${i}`
        );


      if(player){

        el.querySelector(
          ".slot-name"
        )
        .innerText =
          player.n;


        el.classList.add(
          "filled"
        );


        if(
          player.type ===
          "legend"
        ){

          el.classList.add(
            "legend-slot"
          );

        }

      }

    }
  );


  state.t2.forEach(
    (player,i)=>{

      const el =
        document.getElementById(
          `t2-${i}`
        );


      if(player){

        el.querySelector(
          ".slot-name"
        )
        .innerText =
          player.n;


        el.classList.add(
          "filled"
        );


        if(
          player.type ===
          "legend"
        ){

          el.classList.add(
            "legend-slot"
          );

        }

      }

    }
  );

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

  clearInterval(
    timerInterval
  );


  if(
    !state ||
    state.gameOver
  ){

    return;

  }


  timerInterval =
    setInterval(
      ()=>{

        const elapsed =
          (
            Date.now() -
            state.turnStartedAt
          ) / 1000;


        const left =
          Math.max(
            0,
            TURN_TIME -
            elapsed
          );


        const percent =
          (
            left /
            TURN_TIME
          ) * 100;


        document
          .getElementById("timerBar")
          .style.width =
            percent + "%";


        if(left <= 0){

          clearInterval(
            timerInterval
          );


          if(
            state.turn ===
            playerNum
          ){

            autoSkip();

          }

        }

      },
      500
    );

}


/* =====================================================
   BID
===================================================== */

function bid(){

  if(!state) return;


  const value =
    parseInt(
      document
        .getElementById(
          "bidInput"
        )
        .value
    );


  roomRef.transaction(data=>{

    if(
      !data ||
      !data.state ||
      data.state.gameOver
    ){

      return;

    }


    const s =
      data.state;


    if(
      s.turn !==
      playerNum
    ){

      return;

    }


    const money =
      playerNum === 1
        ? s.m1
        : s.m2;


    if(
      isNaN(value) ||
      value <= s.bid ||
      value > money
    ){

      return;

    }


    s.bid =
      value;


    s.turn =
      s.turn === 1
        ? 2
        : 1;


    s.turnStartedAt =
      Date.now();


    return data;

  },
  error=>{

    if(!error){

      bidSound();

    }

  });

}


/* =====================================================
   TAKE PLAYER
===================================================== */

function takePlayer(){

  if(!state) return;


  roomRef.transaction(data=>{

    if(
      !data ||
      !data.state ||
      data.state.gameOver
    ){

      return;

    }


    const s =
      data.state;


    if(
      s.turn !==
      playerNum
    ){

      return;

    }


    if(playerNum === 1){

      if(s.bid > s.m1)
        return;


      s.m1 -=
        s.bid;


      s.t1[s.pos] =
        s.player;

    }else{

      if(s.bid > s.m2)
        return;


      s.m2 -=
        s.bid;


      s.t2[s.pos] =
        s.player;

    }


    nextPosition(s);


    return data;

  },
  error=>{

    if(!error){

      winSound();

    }

  });

}


/* =====================================================
   SKIP
===================================================== */

function skipPlayer(){

  autoSkip(
    true
  );

}


function autoSkip(
  manual = false
){

  if(!state) return;


  roomRef.transaction(data=>{

    if(
      !data ||
      !data.state ||
      data.state.gameOver
    ){

      return;

    }


    const s =
      data.state;


    if(
      s.turn !==
      playerNum
    ){

      return;

    }


    const position =
      positions[s.pos];


    const key =
      positionKey(position);


    function affordable(
      money,
      used
    ){

      let arr =
        playersDB[key]
        .filter(
          p=>
            p.p <= money &&
            !used.includes(p.n)
        );


      if(!arr.length){

        arr =
          playersDB[key]
          .filter(
            p=>
              p.p <= money
          );

      }


      if(!arr.length){

        return {
          n:"لاعب مجاني",
          p:0,
          ovr:50,
          type:"current"
        };

      }


      return arr[
        Math.floor(
          Math.random() *
          arr.length
        )
      ];

    }


    const p1 =
      affordable(
        s.m1,
        s.used || []
      );


    const p2 =
      affordable(
        s.m2,
        [
          ...(s.used || []),
          p1.n
        ]
      );


    s.t1[s.pos] =
      p1;


    s.t2[s.pos] =
      p2;


    s.m1 -=
      p1.p;


    s.m2 -=
      p2.p;


    s.used =
      [
        ...(s.used || []),
        p1.n,
        p2.n
      ];


    nextPosition(s);


    return data;

  });

}


/* =====================================================
   NEXT POSITION
===================================================== */

function nextPosition(s){

  s.pos++;


  if(
    s.pos >=
    positions.length
  ){

    s.gameOver =
      true;


    s.player =
      null;


    return;

  }


  const position =
    positions[s.pos];


  const nextPlayer =
    getRandomPlayer(
      position,
      s.used || []
    );


  s.player =
    nextPlayer;


  s.bid =
    nextPlayer.p;


  s.turn =
    1;


  s.turnStartedAt =
    Date.now();


  s.used =
    [
      ...(s.used || []),
      nextPlayer.n
    ];

}


/* =====================================================
   RESULT
===================================================== */

function showResult(){

  clearInterval(
    timerInterval
  );


  document
    .getElementById("auctionCard")
    .style.display =
      "none";


  document
    .getElementById("result")
    .style.display =
      "block";


  const score1 =
    state.t1.reduce(
      (total,p)=>
        total +
        (p ? p.ovr : 0),
      0
    );


  const score2 =
    state.t2.reduce(
      (total,p)=>
        total +
        (p ? p.ovr : 0),
      0
    );


  document
    .getElementById("score1")
    .innerText =
      score1;


  document
    .getElementById("score2")
    .innerText =
      score2;


  let result;


  if(
    score1 >
    score2
  ){

    result =
      playerNum === 1
        ? "🏆 أنت الفائز!"
        : "🏆 الخصم فاز!";

  }

  else if(
    score2 >
    score1
  ){

    result =
      playerNum === 2
        ? "🏆 أنت الفائز!"
        : "🏆 الخصم فاز!";

  }

  else{

    result =
      "🤝 تعادل!";

  }


  document
    .getElementById("winner")
    .innerText =
      result;

}

</script>
