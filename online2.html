<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:#080808;
  color:#fff;
  font-family:'Cairo',sans-serif;
}

.game{
  width:min(100%,520px);
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  color:#ffd700;
  font-size:25px;
  margin:5px 0 15px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 65px 1fr;
  gap:6px;
  background:#111;
  padding:10px;
  border-radius:14px;
  border:1px solid #333;
}

.player-stat{
  background:#090909;
  padding:7px;
  border-radius:10px;
  text-align:center;
}

.blue{
  border:1px solid #008cff;
}

.red{
  border:1px solid #ff4444;
}

.blue-text{
  color:#00aaff;
}

.red-text{
  color:#ff4444;
}

.player-small-name{
  font-weight:900;
  font-size:13px;
}

.money{
  color:#00ff88;
  font-size:12px;
  font-weight:900;
}

.round{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffd700;
  font-weight:900;
}

.turn-box{
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  margin:10px 0;
  padding:10px;
  text-align:center;
}

.turn{
  font-weight:900;
}

.field{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.team{
  background:#111;
  border:1px solid #333;
  border-radius:13px;
  padding:7px;
}

.team h3{
  margin:4px;
  text-align:center;
  font-size:14px;
}

.slot{
  min-height:48px;
  background:#050505;
  border:1px solid #333;
  border-radius:8px;
  margin:5px 0;
  padding:5px;
  font-size:10px;
}

.slot.filled{
  border-color:#ffd700;
}

.slot.legend-slot{
  border-color:#ffd700;
  background:#1a1400;
}

.slot-pos{
  color:#888;
  font-size:9px;
}

.slot-name{
  font-weight:900;
}

.player-card{
  background:#111;
  border:2px solid #00aaff;
  border-radius:20px;
  padding:15px;
  margin:12px 0;
  text-align:center;
}

.player-card.legend-card{
  border-color:#ffd700;
  box-shadow:0 0 20px rgba(255,215,0,.2);
}

.player-type{
  display:inline-block;
  padding:4px 12px;
  border-radius:20px;
  font-size:11px;
  font-weight:900;
}

.current-type{
  background:#008cff;
}

.legend-type{
  background:#ffd700;
  color:#000;
}

.player-content{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  margin:12px 0;
}

.ovr{
  width:75px;
  height:75px;
  border-radius:50%;
  border:3px solid #ffd700;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.ovr span{
  font-size:27px;
  font-weight:900;
}

.ovr small{
  font-size:9px;
  color:#aaa;
}

.player-main{
  text-align:right;
}

.position{
  color:#aaa;
  font-size:13px;
}

.player-name-big{
  font-size:22px;
  font-weight:900;
}

.price{
  color:#00ff88;
  font-size:17px;
  font-weight:900;
  direction:ltr;
}

.controls{
  display:grid;
  gap:7px;
}

.bid-input{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #555;
  background:#080808;
  color:#fff;
  text-align:center;
  font-family:'Cairo';
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
}

button{
  border:0;
  border-radius:9px;
  padding:10px 4px;
  font-family:'Cairo';
  font-weight:900;
  cursor:pointer;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.bid-btn{
  background:#00ff88;
  color:#000;
}

.take-btn{
  background:#ff3333;
  color:#fff;
}

.skip-btn{
  background:#555;
  color:#fff;
}

.result{
  display:none;
  background:#111;
  border:2px solid #ffd700;
  border-radius:20px;
  padding:20px;
  text-align:center;
}

</style>

</head>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  databaseURL:
  "https://mazad-noogom-default-rtdb.firebaseio.com"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* =========================
   URL
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const playerNum =
  parseInt(params.get("p")) || 1;

const rawName =
  params.get("name") ||
  `لاعب ${playerNum}`;


function cleanName(name){

  if(!name) return "لاعب";

  return name
    .split("@")[0]
    .split(".")[0]
    .slice(0,15);

}


const myRealName =
  cleanName(rawName);


/* =========================
   ROOM
========================= */

let ROOM_ID =
  params.get("room");

if(!ROOM_ID){

  ROOM_ID =
    "room-" +
    Math.random()
      .toString(36)
      .substring(2,10);

  const newUrl =
    window.location.pathname +
    "?room=" + ROOM_ID +
    "&p=" + playerNum +
    "&name=" +
    encodeURIComponent(myRealName);

  window.history.replaceState(
    {},
    "",
    newUrl
  );

}


const roomRef =
  db.ref(
    "mazad5/" +
    ROOM_ID
  );


/* =========================
   SETTINGS
========================= */

const START_MONEY =
  100000000;

const MIN_BID_STEP =
  1000000;


const positions = [

  "GK",
  "CB",
  "CM1",
  "CM2",
  "ST"

];


/* =========================
   PLAYERS
========================= */

const playersDB = {


GK:[

{n:"تيبو كورتوا",p:15000000,ovr:91,type:"current"},
{n:"أليسون",p:14000000,ovr:90,type:"current"},
{n:"دوناروما",p:14500000,ovr:89,type:"current"},
{n:"تير شتيجن",p:13000000,ovr:89,type:"current"},
{n:"يان أوبلاك",p:13500000,ovr:88,type:"current"},

{n:"ليف ياشين 👑",p:45000000,ovr:96,type:"legend"},
{n:"بوفون 👑",p:42000000,ovr:95,type:"legend"},
{n:"كاسياس 👑",p:40000000,ovr:94,type:"legend"}

],


CB:[

{n:"فان دايك",p:40000000,ovr:90,type:"current"},
{n:"روبن دياز",p:38000000,ovr:89,type:"current"},
{n:"روديجر",p:35000000,ovr:89,type:"current"},
{n:"ساليبا",p:33000000,ovr:88,type:"current"},
{n:"ماركينيوس",p:34000000,ovr:87,type:"current"},

{n:"مالديني 👑",p:65000000,ovr:97,type:"legend"},
{n:"بيكنباور 👑",p:68000000,ovr:97,type:"legend"},
{n:"نيستا 👑",p:57000000,ovr:95,type:"legend"}

],


CM:[

{n:"بيلينجهام",p:50000000,ovr:91,type:"current"},
{n:"رودري",p:45000000,ovr:91,type:"current"},
{n:"دي بروين",p:55000000,ovr:91,type:"current"},
{n:"فالفيردي",p:40000000,ovr:89,type:"current"},
{n:"بيدري",p:42000000,ovr:89,type:"current"},

{n:"زيدان 👑",p:75000000,ovr:98,type:"legend"},
{n:"إنييستا 👑",p:68000000,ovr:96,type:"legend"},
{n:"تشافي 👑",p:65000000,ovr:96,type:"legend"}

],


ST:[

{n:"مبابي",p:65000000,ovr:92,type:"current"},
{n:"هالاند",p:60000000,ovr:91,type:"current"},
{n:"محمد صلاح",p:58000000,ovr:91,type:"current"},
{n:"فينيسيوس",p:62000000,ovr:90,type:"current"},
{n:"هاري كين",p:55000000,ovr:90,type:"current"},

{n:"ميسي PRIME 👑",p:90000000,ovr:99,type:"legend"},
{n:"رونالدو PRIME 👑",p:88000000,ovr:99,type:"legend"},
{n:"بيليه 👑",p:95000000,ovr:99,type:"legend"}

]

};


/* =========================
   BUILD TEAM SLOTS
========================= */

positions.forEach((pos,i)=>{

  document
    .getElementById("t1")
    .innerHTML += `

      <div
        class="slot"
        id="t1-${i}"
      >

        <div class="slot-pos">
          ${pos}
        </div>

        <div class="slot-name">
          -
        </div>

      </div>

    `;


  document
    .getElementById("t2")
    .innerHTML += `

      <div
        class="slot"
        id="t2-${i}"
      >

        <div class="slot-pos">
          ${pos}
        </div>

        <div class="slot-name">
          -
        </div>

      </div>

    `;

});


/* =========================
   RANDOM PLAYER
========================= */

function positionKey(pos){

  return pos.startsWith("CM")
    ? "CM"
    : pos;

}


function getRandomPlayer(
  position,
  used
){

  const key =
    positionKey(position);

  let available =
    playersDB[key]
      .filter(
        player =>
          !used.includes(player.n)
      );

  if(!available.length){

    available =
      playersDB[key];

  }

  return available[
    Math.floor(
      Math.random() *
      available.length
    )
  ];

}


/* =========================
   STATE - جاهز فوراً
   يبدأ بالحارس كورتوا
========================= */

let state = {

  pos:0,

  player:{
    n:"تيبو كورتوا",
    p:15000000,
    ovr:91,
    type:"current"
  },

  bid:15000000,

  turn:1,

  m1:START_MONEY,

  m2:START_MONEY,

  t1:Array(5).fill(null),

  t2:Array(5).fill(null),

  used:[
    "تيبو كورتوا"
  ],

  gameOver:false

};


/* =========================
   RENDER IMMEDIATELY
========================= */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    renderGame();

  }
);


/* =========================
   CREATE / JOIN ROOM
========================= */

roomRef.transaction(data => {

  if(!data){

    data = {};

  }


  if(playerNum === 1){

    data.name1 =
      myRealName;

  }else{

    data.name2 =
      myRealName;

  }


  if(!data.name1){

    data.name1 =
      "اللاعب 1";

  }


  if(!data.name2){

    data.name2 =
      "اللاعب 2";

  }


  data.started = true;


  if(!data.state){

    data.state =
      JSON.parse(
        JSON.stringify(state)
      );

  }


  return data;

});


/* =========================
   LISTEN FIREBASE
========================= */

roomRef.on(
  "value",
  snap => {

    const data =
      snap.val();

    if(!data) return;


    const name1 =
      data.name1 ||
      "اللاعب 1";

    const name2 =
      data.name2 ||
      "اللاعب 2";


    document
      .getElementById("myName")
      .innerText =

      playerNum === 1
        ? name1
        : name2;


    document
      .getElementById("enemyName")
      .innerText =

      playerNum === 1
        ? name2
        : name1;


    if(data.state){

      state =
        data.state;

      renderGame();

    }

  }
);


/* =========================
   RENDER
========================= */

function renderGame(){

  if(!state) return;


  document
    .getElementById("myMoney")
    .innerText =

    (
      playerNum === 1
        ? state.m1
        : state.m2
    )
    .toLocaleString();


  document
    .getElementById("enemyMoney")
    .innerText =

    (
      playerNum === 1
        ? state.m2
        : state.m1
    )
    .toLocaleString();


  document
    .getElementById("count")
    .innerText =

    `${state.pos+1} / 5`;


  if(state.gameOver){

    showResult();

    return;

  }


  const player =
    state.player;


  document
    .getElementById("position")
    .innerText =

    positions[state.pos];


  document
    .getElementById("playerName")
    .innerText =

    player.n;


  document
    .getElementById("ovr")
    .innerText =

    player.ovr;


  document
    .getElementById("price")
    .innerText =

    "$" +
    state.bid
      .toLocaleString();


  document
    .getElementById("bidInput")
    .value =

    state.bid +
    MIN_BID_STEP;


  const myTurn =
    state.turn ===
    playerNum;


  document
    .getElementById("turn")
    .innerText =

    myTurn
      ? "🔥 دورك الآن"
      : "⏳ دور الخصم";


  document
    .getElementById("bidBtn")
    .disabled =

    !myTurn;


  document
    .getElementById("takeBtn")
    .disabled =

    !myTurn;


  document
    .getElementById("skipBtn")
    .disabled =

    !myTurn;


  const typeElement =
    document.getElementById(
      "playerType"
    );


  const card =
    document.getElementById(
      "auctionCard"
    );


  if(player.type === "legend"){

    typeElement.innerText =
      "👑 أسطورة";

    typeElement.className =
      "player-type legend-type";

    card.className =
      "player-card legend-card";

  }else{

    typeElement.innerText =
      "🔥 لاعب حالي";

    typeElement.className =
      "player-type current-type";

    card.className =
      "player-card";

  }


  renderTeams();

}


/* =========================
   RENDER TEAMS
========================= */

function renderTeams(){

  state.t1.forEach(
    (player,i) => {

      const slot =
        document.getElementById(
          `t1-${i}`
        );

      if(player){

        slot
          .querySelector(
            ".slot-name"
          )
          .innerText =
            player.n;

        slot.classList.add(
          "filled"
        );

        if(
          player.type ===
          "legend"
        ){

          slot.classList.add(
            "legend-slot"
          );

        }

      }

    }
  );


  state.t2.forEach(
    (player,i) => {

      const slot =
        document.getElementById(
          `t2-${i}`
        );

      if(player){

        slot
          .querySelector(
            ".slot-name"
          )
          .innerText =
            player.n;

        slot.classList.add(
          "filled"
        );

        if(
          player.type ===
          "legend"
        ){

          slot.classList.add(
            "legend-slot"
          );

        }

      }

    }
  );

}


/* =========================
   BID
========================= */

function bid(){

  const value =
    parseInt(
      document
        .getElementById(
          "bidInput"
        )
        .value
    );


  if(
    isNaN(value)
  ){

    alert(
      "اكتب مبلغ صحيح"
    );

    return;

  }


  roomRef.transaction(
    data => {

      if(
        !data ||
        !data.state
      ) return;


      const s =
        data.state;


      if(
        s.gameOver ||
        s.turn !== playerNum
      ) return;


      const money =
        playerNum === 1
          ? s.m1
          : s.m2;


      if(
        value <= s.bid
      ){

        alert(
          "لازم تزود عن السعر الحالي"
        );

        return;

      }


      if(
        value > money
      ){

        alert(
          "فلوسك لا تكفي"
        );

        return;

      }


      s.bid =
        value;


      s.turn =
        s.turn === 1
          ? 2
          : 1;


      return data;

    }
  );

}


/* =========================
   TAKE PLAYER
========================= */

function takePlayer(){

  roomRef.transaction(
    data => {

      if(
        !data ||
        !data.state
      ) return;


      const s =
        data.state;


      if(
        s.gameOver ||
        s.turn !== playerNum
      ) return;


      if(
        playerNum === 1
      ){

        if(
          s.bid > s.m1
        ){

          alert(
            "فلوسك لا تكفي"
          );

          return;

        }


        s.m1 -=
          s.bid;


        s.t1[
          s.pos
        ] =
          s.player;

      }else{

        if(
          s.bid > s.m2
        ){

          alert(
            "فلوسك لا تكفي"
          );

          return;

        }


        s.m2 -=
          s.bid;


        s.t2[
          s.pos
        ] =
          s.player;

      }


      nextPosition(s);

      return data;

    }
  );

}


/* =========================
   SKIP
========================= */

function skipPlayer(){

  roomRef.transaction(
    data => {

      if(
        !data ||
        !data.state
      ) return;


      const s =
        data.state;


      if(
        s.gameOver ||
        s.turn !== playerNum
      ) return;


      const pos =
        positions[s.pos];


      const key =
        positionKey(pos);


      let available1 =
        playersDB[key]
          .filter(
            player =>
              player.p <= s.m1
          );


      if(
        available1.length === 0
      ){

        available1 =
          playersDB[key];

      }


      const player1 =
        available1[
          Math.floor(
            Math.random() *
            available1.length
          )
        ];


      let available2 =
        playersDB[key]
          .filter(
            player =>
              player.p <= s.m2 &&
              player.n !== player1.n
          );


      if(
        available2.length === 0
      ){

        available2 =
          playersDB[key]
            .filter(
              player =>
                player.p <= s.m2
            );

      }


      const player2 =
        available2[
          Math.floor(
            Math.random() *
            available2.length
          )
        ];


      s.t1[
        s.pos
      ] =
        player1;


      s.t2[
        s.pos
      ] =
        player2;


      s.m1 -=
        player1.p;


      s.m2 -=
        player2.p;


      s.used = [

        ...(s.used || []),

        player1.n,

        player2.n

      ];


      nextPosition(s);

      return data;

    }
  );

}


/* =========================
   NEXT POSITION
========================= */

function nextPosition(s){

  s.pos++;


  if(
    s.pos >=
    positions.length
  ){

    s.gameOver =
      true;

    return;

  }


  const position =
    positions[s.pos];


  const nextPlayer =
    getRandomPlayer(
      position,
      s.used || []
    );


  s.player =
    nextPlayer;


  s.bid =
    nextPlayer.p;


  s.turn =
    1;


  s.used = [

    ...(s.used || []),

    nextPlayer.n

  ];

}


/* =========================
   RESULT
========================= */

function showResult(){

  document
    .getElementById(
      "auctionCard"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "result"
    )
    .style.display =
      "block";


  const score1 =
    state.t1.reduce(
      (total,player) =>
        total +
        (
          player
            ? player.ovr
            : 0
        ),
      0
    );


  const score2 =
    state.t2.reduce(
      (total,player) =>
        total +
        (
          player
            ? player.ovr
            : 0
        ),
      0
    );


  let winner;


  if(
    score1 > score2
  ){

    winner =
      "🏆 اللاعب 1 فاز";

  }else if(
    score2 > score1
  ){

    winner =
      "🏆 اللاعب 2 فاز";

  }else{

    winner =
      "🤝 تعادل";

  }


  document
    .getElementById(
      "finalScore"
    )
    .innerHTML = `

      <h3>
        ${score1}
        -
        ${score2}
      </h3>

      <h2>
        ${winner}
      </h2>

    `;

}

</script>

</body>
</html>
