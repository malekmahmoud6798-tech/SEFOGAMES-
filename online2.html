function random(arr){

if(!arr||!arr.length)return null;

return arr[
Math.floor(Math.random()*arr.length)
];

}


function positionKey(position){

return position==="CM"?"CM":position;

}


function getRandomPlayer(position,used=[]){

const key=positionKey(position);

let available=
playersDB[key]
.filter(p=>!used.includes(p.n));

if(!available.length){

available=playersDB[key];

}

return random(available);

}

/* =========================================================
BID
========================================================= */

function bid(){

const value=
Number(document.getElementById("bidInput").value);

if(!Number.isFinite(value)||value<=0){

showMessage("❌ اكتب مبلغ صحيح");

return;

}

roomRef.transaction(data=>{

if(!data||!data.state)return;

const s=data.state;

if(s.gameOver)return;

if(s.turn!==playerNum)return;

const money=
playerNum===1?s.m1:s.m2;

if(value<s.bid+MIN_BID_STEP)return;

if(value>money)return;

s.bid=value;

s.turn=
playerNum===1?2:1;

return data;

},(error,committed)=>{

if(error){

showMessage("❌ حدث خطأ");

}

else if(committed){

showMessage("💰 تمت المزايدة!");

}

else{

showMessage("❌ لا يمكن تنفيذ المزايدة");

}

});

}


/* =========================================================
TAKE
========================================================= */

function takePlayer(){

roomRef.transaction(data=>{

if(!data||!data.state)return;

const s=data.state;

if(s.gameOver||s.turn!==playerNum)return;

if(playerNum===1){

if(s.bid>s.m1)return;

s.m1-=s.bid;

s.t1[s.pos]=s.player;

}

else{

if(s.bid>s.m2)return;

s.m2-=s.bid;

s.t2[s.pos]=s.player;

}

nextPosition(s);

return data;

},(error,committed)=>{

if(error){

showMessage("❌ حدث خطأ");

}

else if(committed){

showMessage("🔥 تم شراء اللاعب!");

}

});

}


/* =========================================================
SKIP
========================================================= */

function skipPlayer(){

roomRef.transaction(data=>{

if(!data||!data.state)return;

const s=data.state;

if(s.gameOver||s.turn!==playerNum)return;

const key=positionKey(positions[s.pos]);

let a1=
playersDB[key].filter(p=>p.p<=s.m1);

if(!a1.length)
a1=playersDB[key];

const player1=random(a1);

let a2=
playersDB[key].filter(
p=>p.p<=s.m2&&p.n!==player1.n
);

if(!a2.length){

a2=
playersDB[key].filter(
p=>p.n!==player1.n
);

}

const player2=random(a2);

s.t1[s.pos]=player1;

s.t2[s.pos]=player2;

s.m1=Math.max(0,s.m1-player1.p);
s.m2=Math.max(0,s.m2-player2.p);

s.used=[
...(s.used||[]),
player1.n,
player2.n
];

nextPosition(s);

return data;

},(error,committed)=>{

if(committed){

showMessage("⏭ تم توزيع لاعبين عشوائيًا");

}

});

}

function nextPosition(s){

s.gameOver=true;

s.matchStarted=false;

const next=
getRandomPlayer(
positions[s.pos],
s.used||[]
);

s.player=next;

s.bid=next.p;

s.turn=1;

s.used=[
...(s.used||[]),
next.n
];

}

/* =========================================================
START MATCH
========================================================= */

function startMatch(){

roomRef.transaction(data=>{

if(!data||!data.state)return;

const s=data.state;

if(s.matchStarted)return;

s.matchStarted=true;

const strength1=
getTeamStrength(s.t1);

const strength2=
getTeamStrength(s.t2);

const possession1=
Math.max(
35,
Math.min(
65,
Math.floor(
50+
(strength1-strength2)/5+
(Math.random()*8-4)
)
)
);

s.match={

minute:0,

score1:0,

score2:0,

possession1:possession1,

possession2:100-possession1,

shots1:0,

shots2:0,

shotsTarget1:0,

shotsTarget2:0,

corners1:0,

corners2:0,

yellow1:0,

yellow2:0,

red1:0,

red2:0,

events:[],

motm:null,

winner:null

};

return data;

});

}

log.innerHTML="";

(m.events||[])

const div=document.createElement("div");

log.appendChild(div);

});

if(
!state.matchFinished&&
playerNum===1&&
!matchInterval

}

/* =========================================================
MATCH MINUTE
========================================================= */

function simulateMinute(){

roomRef.transaction(data=>{

if(!data||!data.state)return;

const s=data.state;

if(
!s.matchStarted||
s.matchFinished||
!s.match
)return;

const m=s.match;

m.minute++;

simulateEvent(s);

if(m.minute>=90){

finishMatch(s);

}

return data;

});

}


/* =========================================================
MATCH EVENTS
========================================================= */

function simulateEvent(s){

const m=s.match;

const roll=Math.random();

const chance=m.possession1/100;

function addEvent(text,type){

m.events.push({

minute:m.minute,

text:`${m.minute}' ${text}`,

type:type

});

if(m.events.length>40){

m.events.shift();

}

}


/* GOAL */

if(roll<0.075){

const team1=
Math.random()<chance;

const team=
team1?s.t1:s.t2;

const attackers=
team.filter(Boolean);

const scorer=
random(attackers);

if(!scorer)return;

if(team1){

m.score1++;
m.shots1++;
m.shotsTarget1++;

}

else{

m.score2++;
m.shots2++;
m.shotsTarget2++;

}

addEvent(
`⚽ هدف! ${scorer.n}`,
"goal"
);

return;

}


/* SHOT */

if(roll<.20){

const team1=
Math.random()<chance;

if(team1){

m.shots1++;

if(Math.random()<.45)
m.shotsTarget1++;

}

else{

m.shots2++;

if(Math.random()<.45)
m.shotsTarget2++;

}

addEvent(
"🎯 تسديدة خطيرة",
"shot"
);

return;

}


/* CORNER */

if(roll<.30){

const team1=
Math.random()<chance;

if(team1)m.corners1++;
else m.corners2++;

addEvent(
"🚩 ركلة ركنية",
"corner"
);

return;

}


/* YELLOW */

if(roll<.35){

const team1=Math.random()<.5;

if(team1)m.yellow1++;
else m.yellow2++;

addEvent(
"🟨 بطاقة صفراء",
"yellow"
);

return;

}


/* RED */

if(roll<.365){

const team1=Math.random()<.5;

if(team1)m.red1++;
else m.red2++;

addEvent(
"🟥 بطاقة حمراء!",
"red"
);

return;

}


/* ATTACK */

if(roll<.52){

const team1=
Math.random()<chance;

const team=
team1?s.t1:s.t2;

const attacker=
random(team.filter(Boolean));

if(attacker){

addEvent(
`🔥 هجمة خطيرة بواسطة ${attacker.n}`,
"attack"
);

}

}

}


/* =========================================================
FINISH
========================================================= */

function finishMatch(s){

const m=s.match;

const allPlayers=[

...s.t1
.filter(Boolean)
.map(p=>({...p,team:1})),

...s.t2
.filter(Boolean)
.map(p=>({...p,team:2}))

];

const motm=random(allPlayers);

m.motm=motm;

if(m.score1>m.score2){

m.winner=1;

}

else if(m.score2>m.score1){

m.winner=2;

}

else{

m.winner=0;

}

s.matchFinished=true;

m.events.push({

minute:90,

text:"🏁 انتهت المباراة!",

type:"end"

});

}
