<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL DERBY - L&S GAMES</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
    
    body {
        background: radial-gradient(circle at center, #0a0a2e 0%, #000000 100%);
        color: white;
        min-height: 100vh;
        padding: 20px;
        overflow-x: hidden;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: 
            linear-gradient(90deg, rgba(0,255,0,0.05) 1px, transparent 1px),
            linear-gradient(rgba(0,255,0,0.05) 1px, transparent 1px);
        background-size: 50px 50px;
        z-index: -1;
        animation: moveBg 20s linear infinite;
    }

    @keyframes moveBg {
        0% { transform: translate(0,0); }
        100% { transform: translate(50px, 50px); }
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
    }

    .container { max-width: 1300px; margin: 0 auto; }

    .title {
        text-align: center;
        font-size: 4rem;
        font-weight: 900;
        background: linear-gradient(45deg, #FFD700, #FF0000, #00BFFF, #FFD700);
        background-size: 300% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradient 3s ease infinite;
        text-shadow: 0 0 40px rgba(255,215,0,0.8);
        margin-bottom: 40px;
    }

    @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .vs-section {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.7);
        padding: 30px;
        border-radius: 20px;
        border: 3px solid;
        border-image: linear-gradient(45deg, #FFD700, #00BFFF) 1;
        margin-bottom: 30px;
        box-shadow: 0 0 50px rgba(255,215,0,0.3);
    }

    .player { text-align: center; flex: 1; }
    
    .player-avatar {
        width: 120px; height: 120px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #FFD700, #FF0000, #FFD700);
        margin: 0 auto 15px;
        display: flex; align-items: center; justify-content: center;
        font-size: 2.5rem; font-weight: 900;
        box-shadow: 0 0 30px #FFD700;
        animation: rotate 4s linear infinite;
    }

    .ai-avatar {
        background: conic-gradient(from 0deg, #00BFFF, #0080FF, #00BFFF);
        box-shadow: 0 0 30px #00BFFF;
    }

    @keyframes rotate { 100% { transform: rotate(360deg); } }

    .player-name { font-size: 1.5rem; font-weight: 700; color: #FFD700; }
    .ai-name { color: #00BFFF; }

    .vs {
        font-size: 3.5rem; font-weight: 900;
        background: linear-gradient(45deg, #FF0000, #FFFF00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: pulse 0.8s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); text-shadow: 0 0 20px #FF0000; }
        50% { transform: scale(1.3); text-shadow: 0 0 40px #FFFF00; }
    }

    .teams-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-bottom: 30px;
    }

    .teams-box {
        background: rgba(0,0,0,0.8);
        border: 3px solid #FFD700;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 0 40px rgba(255,215,0,0.4);
        backdrop-filter: blur(10px);
    }

    .ai-box {
        border-color: #00BFFF;
        box-shadow: 0 0 40px rgba(0,191,255,0.4);
    }

    .teams-title {
        text-align: center; font-size: 1.6rem; font-weight: 700;
        margin-bottom: 20px; color: #FFD700;
        text-shadow: 0 0 15px #FFD700;
    }

    .ai-title { color: #00BFFF; text-shadow: 0 0 15px #00BFFF; }

    .teams-list {
        max-height: 450px; overflow-y: auto;
        background: rgba(0,0,0,0.5);
        border-radius: 15px; padding: 15px;
    }

    .team-item {
        padding: 15px 20px; margin: 10px 0;
        background: rgba(255,255,255,0.05);
        border-left: 4px solid transparent;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
        display: flex; justify-content: space-between; align-items: center;
        font-size: 1.1rem;
    }

    .team-item:hover {
        background: rgba(255,215,0,0.2);
        border-left: 4px solid #FFD700;
        transform: translateX(10px) scale(1.02);
    }

    .team-item.selected {
        background: linear-gradient(90deg, #FFD700, #FFA500);
        color: #000; font-weight: 900;
        border-left: 4px solid #FFF;
        box-shadow: 0 0 30px #FFD700;
    }

    .ai-selected {
        background: linear-gradient(90deg, #00BFFF, #0080FF);
        color: #fff; font-weight: 900;
        border-left: 4px solid #FFF;
        box-shadow: 0 0 30px #00BFFF;
    }

    .select-btn {
        width: 100%; padding: 25px;
        font-size: 2rem; font-weight: 900;
        background: linear-gradient(45deg, #FFD700, #FF0000, #00BFFF);
        background-size: 200% 200%;
        color: #000; border: none; border-radius: 15px;
        cursor: pointer; transition: all 0.3s;
        text-transform: uppercase; letter-spacing: 3px;
        animation: gradient 3s ease infinite;
        box-shadow: 0 0 40px rgba(255,215,0,0.6);
    }

    .select-btn:disabled {
        background: #333; color: #666;
        cursor: not-allowed; animation: none;
    }

    @media(max-width: 768px) { .teams-container { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="container">
    <h1 class="title">👑 EL DERBY 👑</h1>

    <div class="vs-section">
        <div class="player">
            <div class="player-avatar">YOU</div>
            <div class="player-name" id="playerName">Ahmed</div>
        </div>
        
        <div class="vs">VS</div>
        
        <div class="player">
            <div class="player-avatar ai-avatar">AI</div>
            <div class="player-name ai-name">L&S AI</div>
        </div>
    </div>

    <div class="teams-container">
        <div class="teams-box">
            <h2 class="teams-title">⚽ CHOOSE YOUR LEGEND ⚽</h2>
            <div class="teams-list" id="playerTeamsList"></div>
        </div>

        <div class="teams-box ai-box">
            <h2 class="teams-title ai-title">🤖 AI RIVAL TEAM 🤖</h2>
            <div class="teams-list" id="aiTeamsList"></div>
        </div>
    </div>

    <button class="select-btn" id="selectBtn" disabled>⚡ START THE WAR ⚡</button>
</div>

<script>
    document.getElementById('playerName').innerText = "Ahmed"; 

    const teams = [
        "Real Madrid", "Manchester City", "Arsenal", "Bayern Munich", "Barcelona",
        "Liverpool", "PSG", "Inter Milan", "Atletico Madrid", "Bayer Leverkusen",
        "Borussia Dortmund", "Chelsea", "Newcastle", "AC Milan", "Juventus",
        "Napoli", "Aston Villa", "Tottenham", "Al Hilal", "Al Nassr"
    ];

    const playerList = document.getElementById('playerTeamsList');
    const aiList = document.getElementById('aiTeamsList');
    const selectBtn = document.getElementById('selectBtn');
    let playerTeam = null;
    let aiTeam = null;

    teams.forEach((team, index) => {
        const div = document.createElement('div');
        div.className = 'team-item';
        div.innerHTML = `<span>#${index+1}</span> <span>${team}</span>`;
        div.onclick = () => {
            document.querySelectorAll('#playerTeamsList .team-item').forEach(t => t.classList.remove('selected'));
            div.classList.add('selected');
            playerTeam = team;
            pickAITeam();
            if(playerTeam && aiTeam) selectBtn.disabled = false;
        };
        playerList.appendChild(div);
    });

    teams.forEach((team, index) => {
        const div = document.createElement('div');
        div.id = `ai-team-${index}`;
        div.className = 'team-item';
        div.innerHTML = `<span>#${index+1}</span> <span>${team}</span>`;
        aiList.appendChild(div);
    });

    function pickAITeam() {
        document.querySelectorAll('#aiTeamsList .team-item').forEach(t => t.classList.remove('ai-selected'));
        let randomIndex;
        do { randomIndex = Math.floor(Math.random() * teams.length); } 
        while(teams[randomIndex] === playerTeam);
        aiTeam = teams[randomIndex];
        document.getElementById(`ai-team-${randomIndex}`).classList.add('ai-selected');
    }

    selectBtn.onclick = () => {
        if(playerTeam && aiTeam) {
            document.body.style.animation = 'shake 0.5s';
            localStorage.setItem('myTeam', playerTeam);
            localStorage.setItem('aiTeam', aiTeam);
            setTimeout(() => {
                window.location.href = 'elderby.html'; // دي صفحة المزاد
            }, 800);
        }
    };
</script>

</body>
</html>
