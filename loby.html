<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>مزاد النجوم - ARENA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#000;
  color:#fff;
  font-family:'Cairo',sans-serif;
  height:100vh;
  overflow:hidden;
  background: radial-gradient(circle at center, #0a0a2a 0%, #000 100%);
}
body::before{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background: repeating-linear-gradient(0deg, rgba(0,255,255,0.03) 0px, transparent 1px, transparent 2px);
  animation: scan 8s linear infinite;
}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(100vh)}}

.container{position:relative;z-index:2;padding:15px;height:100vh;display:flex;flex-direction:column;justify-content:space-between}

.title{
  font-size:24px;font-weight:900;
  background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 3s linear infinite;
  text-shadow: 0 0 10px #00ffff;
  margin-bottom:10px;
}
@keyframes shine{to{background-position:200% center}}

.roomCard{
  background:rgba(0,0,0,0.7);
  border:2px solid #00ffff;
  border-radius:15px;
  padding:12px;
  box-shadow: 0 0 20px rgba(0,255,255,0.5);
  backdrop-filter: blur(10px);
}
.roomLabel{color:#aaa;font-size:12px}
.roomCode{
  font-size:28px;color:#00ff00;font-weight:900;letter-spacing:4px;
  text-shadow: 0 0 10px #00ff00;
}

.arena{display:flex;gap:10px;flex:1;align-items:center}
.playerCard{
  flex:1;height:160px;
  background: linear-gradient(135deg, #111 0%, #222 100%);
  border:2px solid #333;
  border-radius:15px;
  padding:12px;
  position:relative;
  transition:0.3s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.playerCard.ready{
  border-color:#00ff00;
  box-shadow: 0 0 25px rgba(0,255,0,0.8);
  transform: scale(1.03);
}
.playerCard.ready::after{
  content:'READY';
  position:absolute;top:6px;right:6px;
  background:#00ff00;color:#000;
  padding:2px 6px;border-radius:4px;
  font-size:9px;font-weight:900;
}
.avatar{
  width:50px;height:50px;border-radius:50%;
  background: linear-gradient(45deg, #ff00ff, #00ffff);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;margin-bottom:8px;
}
.playerName{font-size:14px;font-weight:700;color:#00ffff;text-align:center}
.playerStatus{font-size:10px;color:#aaa;margin-top:3px}

.vs{
  font-size:20px;font-weight:900;color:#ff00ff;
  text-shadow:0 0 10px #ff00ff;
}

.readyBtn{
  width:100%;padding:16px;font-size:18px;border:none;border-radius:12px;
  background: linear-gradient(90deg, #ff00ff, #00ffff);
  color:#000;font-weight:900;cursor:pointer;font-family:'Cairo';
  box-shadow: 0 0 20px rgba(0,255,255,0.6);
}
.readyBtn:active{transform:scale(0.95)}
.readyBtn:disabled{background:#333;color:#666;box-shadow:none}
</style>
</head>
<body>

<div class="container" id="lobbyScreen">
  <div>
    <h1 class="title">⚽ ARENA</h1>
    <div class="roomCard">
      <div class="roomLabel">مزاد 1 ضد 1</div>
      <div class="roomLabel">كود الغرفة</div>
      <div class="roomCode" id="roomCode">----</div>
    </div>
  </div>

  <div class="arena">
    <div class="playerCard" id="p1Card">
      <div class="avatar" id="p1Avatar">?</div>
      <div class="playerName" id="p1Name">في الانتظار...</div>
      <div class="playerStatus" id="p1Status">-</div>
    </div>
    <div class="vs">VS</div>
    <div class="playerCard" id="p2Card">
      <div class="avatar" id="p2Avatar">?</div>
      <div class="playerName" id="p2Name">في الانتظار...</div>
      <div class="playerStatus" id="p2Status">-</div>
    </div>
  </div>

  <button class="readyBtn" id="readyBtn" onclick="setReady()">⚡ جاهز ⚡</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC_55Rv6wCni9EwQurtUILswB1WjkXp6hM",
  authDomain: "mazad-noogom.firebaseapp.com",
  databaseURL: "https://mazad-noogom-default-rtdb.firebaseio.com",
  projectId: "mazad-noogom",
  storageBucket: "mazad-noogom.firebasestorage.app",
  messagingSenderId: "183884985831",
  appId: "1:183884985831:web:db231949dace2b0798b942"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const urlParams = new URLSearchParams(window.location.search);
const room = urlParams.get('room');
const type = urlParams.get('type') || 'pro';
const email = urlParams.get('name');
const amIHost = urlParams.get('player') == '1';
const myPlayer = amIHost? 1 : 2;

const displayName = email.split('@')[0].split('.').slice(0,2).join(' ');
document.getElementById('roomCode').innerText = room;
document.getElementById('p' + myPlayer + 'Avatar').innerText = displayName[0].toUpperCase();
document.getElementById('p' + myPlayer + 'Name').innerText = displayName;

const roomRef = db.ref('rooms/' + type + '/' + room);

roomRef.child('player' + myPlayer).update({
  name: displayName,
  ready: false
});

roomRef.on('value', (snapshot) => {
  let data = snapshot.val() || {};

  for(let i=1; i<=2; i++){
    let pData = data['player'+i];
    if(typeof pData === 'string') {
      pData = {name: pData.split('@')[0], ready: false};
      roomRef.child('player'+i).set(pData);
    }

    if(pData?.name){
      document.getElementById('p'+i+'Name').innerText = pData.name;
      document.getElementById('p'+i+'Avatar').innerText = pData.name[0].toUpperCase();
      document.getElementById('p'+i+'Status').innerText = pData.ready? 'جاهز' : '...';
      if(pData.ready) {
        document.getElementById('p'+i+'Card').classList.add('ready');
      } else {
        document.getElementById('p'+i+'Card').classList.remove('ready');
      }
    }
  }

  // المهم هنا: بيودي على online1.html
  if(data.player1?.ready && data.player2?.ready &&!data.started){
    roomRef.update({started: true});
    setTimeout(()=>{
      window.location.href = `online1.html?room=${room}&player=${myPlayer}&type=${type}&name=${encodeURIComponent(email)}`;
    }, 1000);
  }
})

function setReady(){
  roomRef.child('player' + myPlayer + '/ready').set(true);
  document.getElementById('readyBtn').disabled = true;
  document.getElementById('readyBtn').innerText = '✅ تم';
}
</script>
</body>
</html>
