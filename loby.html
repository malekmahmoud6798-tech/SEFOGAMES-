<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>مزاد النجوم - CHAMPIONS NIGHT</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
}

body{
  color:#fff;
  font-family:'Cairo',sans-serif;
  overflow:hidden;
  position:relative;

  background:
    radial-gradient(
      ellipse at 50% -20%,
      rgba(36,105,205,.48) 0%,
      rgba(10,35,85,.35) 28%,
      transparent 58%
    ),
    radial-gradient(
      circle at 15% 75%,
      rgba(0,75,190,.16),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 70%,
      rgba(0,60,160,.15),
      transparent 35%
    ),
    #010611;
}

/* =========================================================
   STARS
========================================================= */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;

  background-image:
    radial-gradient(circle,rgba(255,255,255,.85) 1px,transparent 1.5px),
    radial-gradient(circle,rgba(83,174,255,.7) 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,215,90,.55) 1px,transparent 1.5px);

  background-size:
    105px 105px,
    155px 155px,
    210px 210px;

  background-position:
    15px 25px,
    70px 100px,
    30px 160px;

  opacity:.22;
}

/* =========================================================
   LIGHT EFFECT
========================================================= */

body::after{
  content:"";
  position:fixed;

  width:700px;
  height:700px;

  left:50%;
  top:48%;

  transform:translate(-50%,-50%);

  background:
    radial-gradient(
      circle,
      rgba(0,116,255,.12) 0%,
      rgba(0,70,180,.06) 35%,
      transparent 70%
    );

  pointer-events:none;
  z-index:0;
}

/* =========================================================
   SCAN LINES
========================================================= */

.scan-lines{
  position:fixed;
  inset:0;

  pointer-events:none;
  z-index:1;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(80,170,255,.025) 0px,
      rgba(80,170,255,.025) 1px,
      transparent 2px,
      transparent 5px
    );

  opacity:.5;
}

/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{
  position:relative;
  z-index:5;

  width:100%;
  height:100vh;

  padding:16px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* =========================================================
   TOP AREA
========================================================= */

.top-area{
  width:100%;
}

/* =========================================================
   TITLE
========================================================= */

.title{
  text-align:center;

  font-family:'Orbitron',sans-serif;

  font-size:25px;
  font-weight:900;

  letter-spacing:2px;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #ccecff 32%,
      #62bcff 62%,
      #ffffff 100%
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:
    0 0 15px rgba(55,165,255,.6);

  margin-bottom:5px;
}

.subtitle{
  text-align:center;

  color:#8fa9c4;

  font-size:11px;

  letter-spacing:.5px;

  margin-bottom:13px;
}

.subtitle span{
  color:#ffd84a;
  font-weight:900;
}

/* =========================================================
   GOLD DIVIDER
========================================================= */

.gold-divider{
  width:160px;
  height:2px;

  margin:0 auto 13px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #ffd84a,
      #fff2a0,
      #ffd84a,
      transparent
    );

  box-shadow:
    0 0 8px rgba(255,215,70,.8);
}

/* =========================================================
   ROOM CARD
========================================================= */

.roomCard{
  position:relative;

  width:100%;

  background:
    linear-gradient(
      145deg,
      rgba(9,31,66,.92),
      rgba(2,10,27,.94)
    );

  border:1px solid rgba(80,171,255,.45);

  border-radius:19px;

  padding:13px 14px;

  text-align:center;

  box-shadow:
    inset 0 0 25px rgba(0,110,255,.08),
    0 10px 35px rgba(0,0,0,.35);

  backdrop-filter:blur(16px);

  overflow:hidden;
}

/* إطار ذهبي داخلي */

.roomCard::before{
  content:"";

  position:absolute;
  inset:0;

  border-radius:19px;

  border:1px solid rgba(255,215,75,.12);

  pointer-events:none;
}

/* لمعان */

.roomCard::after{
  content:"";

  position:absolute;

  width:180px;
  height:180px;

  left:50%;
  top:-130px;

  transform:translateX(-50%);

  background:
    radial-gradient(
      circle,
      rgba(74,170,255,.18),
      transparent 68%
    );

  pointer-events:none;
}

.roomLabel{
  color:#8ca5bd;
  font-size:10px;

  position:relative;
  z-index:2;
}

.roomLabel:first-child{
  color:#ffd84a;
  font-weight:900;

  margin-bottom:2px;
}

.roomCode{
  margin-top:3px;

  font-family:'Orbitron',sans-serif;

  font-size:27px;

  color:#fff;

  letter-spacing:5px;

  text-shadow:
    0 0 10px rgba(70,180,255,.9),
    0 0 25px rgba(0,100,255,.4);

  position:relative;
  z-index:2;
}

/* =========================================================
   CHAMPIONS STAR
========================================================= */

.champions-star{
  position:absolute;

  left:14px;
  top:50%;

  transform:translateY(-50%);

  font-size:30px;

  filter:
    drop-shadow(0 0 7px rgba(80,180,255,.9))
    drop-shadow(0 0 15px rgba(255,215,70,.35));

  animation:
    starPulse 3s ease-in-out infinite;
}

@keyframes starPulse{

  0%,100%{
    transform:translateY(-50%) scale(1);
  }

  50%{
    transform:translateY(-50%) scale(1.1);
  }

}

/* =========================================================
   ARENA
========================================================= */

.arena{
  width:100%;

  display:flex;

  gap:9px;

  flex:1;

  align-items:center;
  justify-content:center;

  position:relative;
}

/* =========================================================
   PLAYER CARD
========================================================= */

.playerCard{
  flex:1;

  max-width:220px;

  height:205px;

  position:relative;

  background:
    linear-gradient(
      145deg,
      rgba(13,39,76,.90),
      rgba(2,10,27,.96)
    );

  border:1px solid rgba(74,153,231,.35);

  border-radius:22px;

  padding:14px 8px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  transition:
    .35s ease;

  box-shadow:
    inset 0 0 30px rgba(0,100,255,.08),
    0 12px 30px rgba(0,0,0,.38);
}

/* الكارت الداخلي */

.playerCard::before{
  content:"";

  position:absolute;
  inset:0;

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      rgba(82,178,255,.25),
      transparent 32%,
      transparent 70%,
      rgba(255,215,80,.15)
    );

  pointer-events:none;
}

/* إضاءة */

.playerCard::after{
  content:"";

  position:absolute;

  width:160px;
  height:160px;

  left:50%;
  top:45%;

  transform:translate(-50%,-50%);

  background:
    radial-gradient(
      circle,
      rgba(0,120,255,.12),
      transparent 68%
    );

  pointer-events:none;
}

/* =========================================================
   PLAYER CARD READY
========================================================= */

.playerCard.ready{
  border-color:#ffd84a;

  box-shadow:
    inset 0 0 35px rgba(0,100,255,.12),
    0 0 30px rgba(255,215,70,.18),
    0 0 60px rgba(0,110,255,.14);

  transform:scale(1.035);
}

.playerCard.ready::before{
  background:
    linear-gradient(
      135deg,
      rgba(255,215,80,.35),
      transparent 35%,
      transparent 65%,
      rgba(74,175,255,.25)
    );
}

.playerCard.ready::after{
  background:
    radial-gradient(
      circle,
      rgba(255,215,70,.11),
      transparent 68%
    );
}

/* READY LABEL */

.playerCard.ready .ready-badge{
  display:block;
}

/* =========================================================
   READY BADGE
========================================================= */

.ready-badge{
  display:none;

  position:absolute;

  top:8px;
  right:8px;

  background:
    linear-gradient(
      135deg,
      #ffd84a,
      #fff0a0
    );

  color:#061020;

  font-size:8px;
  font-weight:900;

  padding:4px 8px;

  border-radius:8px;

  box-shadow:
    0 0 12px rgba(255,215,70,.4);

  z-index:10;
}

/* =========================================================
   UEFA LABEL
========================================================= */

.uefa-label{
  position:absolute;

  top:9px;
  left:9px;

  font-family:'Orbitron',sans-serif;

  font-size:6px;

  letter-spacing:.8px;

  color:rgba(115,192,255,.65);

  z-index:8;
}

/* =========================================================
   AVATAR
========================================================= */

.avatar{
  width:68px;
  height:68px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
  z-index:5;

  font-family:'Orbitron',sans-serif;

  font-size:27px;
  font-weight:900;

  color:#fff;

  background:
    radial-gradient(
      circle at 35% 25%,
      #287dc9,
      #071c3b 68%,
      #020914
    );

  border:
    2px solid rgba(94,190,255,.6);

  box-shadow:
    0 0 15px rgba(0,130,255,.35),
    inset 0 0 18px rgba(0,170,255,.18);

  margin-bottom:10px;

  transition:.3s;
}

.playerCard.ready .avatar{
  border-color:#ffd84a;

  box-shadow:
    0 0 18px rgba(255,215,70,.35),
    0 0 35px rgba(0,110,255,.18),
    inset 0 0 20px rgba(255,215,70,.08);
}

/* =========================================================
   PLAYER NAME
========================================================= */

.playerName{
  position:relative;
  z-index:5;

  max-width:100%;

  font-size:14px;
  font-weight:900;

  color:#fff;

  text-align:center;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  text-shadow:
    0 0 9px rgba(70,170,255,.45);
}

/* =========================================================
   STATUS
========================================================= */

.playerStatus{
  position:relative;
  z-index:5;

  font-size:10px;

  color:#718ba5;

  margin-top:3px;

  min-height:17px;
}

.playerCard.ready .playerStatus{
  color:#ffd84a;
  font-weight:900;
}

/* =========================================================
   VS
========================================================= */

.vs-container{
  width:55px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  flex-shrink:0;
}

.vs-star{
  font-size:16px;

  margin-bottom:2px;

  opacity:.75;

  filter:
    drop-shadow(0 0 6px rgba(255,215,70,.8));
}

.vs{
  font-family:'Orbitron',sans-serif;

  font-size:19px;
  font-weight:900;

  color:#fff;

  text-shadow:
    0 0 8px rgba(50,160,255,.8),
    0 0 18px rgba(0,90,255,.45);
}

.vs-line{
  width:35px;
  height:1px;

  margin-top:5px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #ffd84a,
      transparent
    );

  box-shadow:
    0 0 7px rgba(255,215,70,.5);
}

/* =========================================================
   READY BUTTON
========================================================= */

.readyBtn{
  width:100%;

  padding:15px;

  border:none;

  border-radius:15px;

  font-family:'Cairo',sans-serif;

  font-size:17px;

  font-weight:900;

  color:#061020;

  cursor:pointer;

  background:
    linear-gradient(
      90deg,
      #277fd1,
      #55baff,
      #ffd84a,
      #55baff,
      #277fd1
    );

  background-size:200% auto;

  box-shadow:
    0 0 22px rgba(0,135,255,.28),
    0 0 35px rgba(255,215,70,.10);

  animation:buttonShine 4s linear infinite;

  transition:.2s;

  position:relative;
  overflow:hidden;
}

.readyBtn::before{
  content:"";

  position:absolute;

  top:0;
  left:-100%;

  width:60%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.45),
      transparent
    );

  transform:skewX(-20deg);

  animation:buttonLight 3s infinite;
}

@keyframes buttonShine{

  0%{
    background-position:0% center;
  }

  100%{
    background-position:200% center;
  }

}

@keyframes buttonLight{

  0%{
    left:-100%;
  }

  45%,100%{
    left:140%;
  }

}

.readyBtn:active{
  transform:scale(.96);
}

.readyBtn:disabled{
  background:
    linear-gradient(
      90deg,
      #17304d,
      #294763
    );

  color:#7790a8;

  box-shadow:none;

  animation:none;

  cursor:not-allowed;
}

.readyBtn:disabled::before{
  display:none;
}

/* =========================================================
   BOTTOM DECORATION
========================================================= */

.bottom-decoration{
  text-align:center;

  color:rgba(108,154,195,.5);

  font-size:8px;

  letter-spacing:2px;

  margin-top:7px;
}

/* =========================================================
   PARTICLES
========================================================= */

.particle{
  position:fixed;

  border-radius:50%;

  background:#61bfff;

  box-shadow:
    0 0 7px #1d91ff;

  pointer-events:none;

  z-index:2;
}

/* =========================================================
   FLOAT
========================================================= */

@keyframes float{

  0%{
    transform:translateY(20px);
    opacity:0;
  }

  15%{
    opacity:.8;
  }

  80%{
    opacity:.45;
  }

  100%{
    transform:translateY(-110vh);
    opacity:0;
  }

}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:380px){

  .container{
    padding:12px;
  }

  .title{
    font-size:22px;
  }

  .roomCard{
    padding:11px;
  }

  .roomCode{
    font-size:24px;
  }

  .playerCard{
    height:185px;
    padding:10px 5px;
  }

  .avatar{
    width:60px;
    height:60px;
    font-size:24px;
  }

  .playerName{
    font-size:12px;
  }

  .vs-container{
    width:42px;
  }

  .vs{
    font-size:16px;
  }

  .readyBtn{
    padding:13px;
    font-size:16px;
  }

}

@media(max-height:650px){

  .title{
    font-size:21px;
  }

  .subtitle{
    margin-bottom:7px;
  }

  .roomCard{
    padding:8px;
  }

  .roomCode{
    font-size:22px;
  }

  .playerCard{
    height:170px;
  }

  .avatar{
    width:55px;
    height:55px;
    font-size:22px;
  }

  .bottom-decoration{
    display:none;
  }

}

</style>
</head>

<body>

<div class="scan-lines"></div>

<div class="container" id="lobbyScreen">

  <!-- =========================
       TOP
  ========================== -->

  <div class="top-area">

    <h1 class="title">
      CHAMPIONS NIGHT
    </h1>

    <div class="subtitle">
      ⚽ <span>UEFA STYLE</span> • مزاد النجوم 1 ضد 1
    </div>

    <div class="gold-divider"></div>

    <!-- ROOM -->

    <div class="roomCard">

      <div class="champions-star">
        ⭐
      </div>

      <div class="roomLabel">
        مزاد النجوم 1 ضد 1
      </div>

      <div class="roomLabel">
        كود الغرفة
      </div>

      <div
        class="roomCode"
        id="roomCode"
      >
        ----
      </div>

    </div>

  </div>


  <!-- =========================
       ARENA
  ========================== -->

  <div class="arena">

    <!-- PLAYER 1 -->

    <div
      class="playerCard"
      id="p1Card"
    >

      <div class="uefa-label">
        CHAMPIONS
      </div>

      <div class="ready-badge">
        ✓ READY
      </div>

      <div
        class="avatar"
        id="p1Avatar"
      >
        ?
      </div>

      <div
        class="playerName"
        id="p1Name"
      >
        في الانتظار...
      </div>

      <div
        class="playerStatus"
        id="p1Status"
      >
        في انتظار اللاعب
      </div>

    </div>


    <!-- VS -->

    <div class="vs-container">

      <div class="vs-star">
        ★
      </div>

      <div class="vs">
        VS
      </div>

      <div class="vs-line"></div>

    </div>


    <!-- PLAYER 2 -->

    <div
      class="playerCard"
      id="p2Card"
    >

      <div class="uefa-label">
        CHAMPIONS
      </div>

      <div class="ready-badge">
        ✓ READY
      </div>

      <div
        class="avatar"
        id="p2Avatar"
      >
        ?
      </div>

      <div
        class="playerName"
        id="p2Name"
      >
        في الانتظار...
      </div>

      <div
        class="playerStatus"
        id="p2Status"
      >
        في انتظار اللاعب
      </div>

    </div>

  </div>


  <!-- =========================
       READY
  ========================== -->

  <div>

    <button
      class="readyBtn"
      id="readyBtn"
      onclick="setReady()"
    >
      ⚡ جاهز للمباراة ⚡
    </button>

    <div class="bottom-decoration">
      ★ L&amp;S GAMES • CHAMPIONS NIGHT ★
    </div>

  </div>

</div>


<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyC_55Rv6wCni9EwQurtUILswB1WjkXp6hM",

  authDomain:
    "mazad-noogom.firebaseapp.com",

  databaseURL:
    "https://mazad-noogom-default-rtdb.firebaseio.com",

  projectId:
    "mazad-noogom",

  storageBucket:
    "mazad-noogom.firebasestorage.app",

  messagingSenderId:
    "183884985831",

  appId:
    "1:183884985831:web:db231949dace2b0798b942"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* =========================================================
   URL DATA
========================================================= */

const urlParams =
  new URLSearchParams(window.location.search);

const room =
  urlParams.get('room');

const type =
  urlParams.get('type') || 'pro';

const email =
  urlParams.get('name');

const amIHost =
  urlParams.get('player') == '1';

const myPlayer =
  amIHost ? 1 : 2;


/* =========================================================
   DISPLAY NAME
========================================================= */

const safeEmail =
  email || 'Player';

const displayName =
  safeEmail
    .split('@')[0]
    .split('.')
    .slice(0,2)
    .join(' ');


/* =========================================================
   INITIAL UI
========================================================= */

document.getElementById('roomCode').innerText =
  room || '----';

document.getElementById(
  'p' + myPlayer + 'Avatar'
).innerText =
  displayName[0]
    ? displayName[0].toUpperCase()
    : '?';

document.getElementById(
  'p' + myPlayer + 'Name'
).innerText =
  displayName;


/* =========================================================
   ROOM REFERENCE
========================================================= */

const roomRef =
  db.ref(
    'rooms/' +
    type +
    '/' +
    room
  );


/* =========================================================
   REGISTER PLAYER
========================================================= */

roomRef
  .child('player' + myPlayer)
  .update({

    name:displayName,

    ready:false

  });


/* =========================================================
   REALTIME ROOM
========================================================= */

roomRef.on(
  'value',
  (snapshot) => {

    let data =
      snapshot.val() || {};


    /* -----------------------------------------
       PLAYERS
    ----------------------------------------- */

    for(
      let i=1;
      i<=2;
      i++
    ){

      let pData =
        data['player' + i];


      /* Old format compatibility */

      if(
        typeof pData === 'string'
      ){

        pData = {

          name:
            pData
              .split('@')[0],

          ready:false

        };

        roomRef
          .child('player' + i)
          .set(pData);

      }


      /* Player exists */

      if(
        pData &&
        pData.name
      ){

        document.getElementById(
          'p' + i + 'Name'
        ).innerText =
          pData.name;


        document.getElementById(
          'p' + i + 'Avatar'
        ).innerText =
          pData.name[0]
            ? pData.name[0].toUpperCase()
            : '?';


        document.getElementById(
          'p' + i + 'Status'
        ).innerText =
          pData.ready
            ? '✓ جاهز للمواجهة'
            : 'في انتظار الجاهزية';


        if(
          pData.ready
        ){

          document.getElementById(
            'p' + i + 'Card'
          ).classList.add('ready');

        }else{

          document.getElementById(
            'p' + i + 'Card'
          ).classList.remove('ready');

        }

      }

    }


    /* =====================================================
       BOTH READY
    ===================================================== */

    if(
      data.player1?.ready &&
      data.player2?.ready &&
      !data.started
    ){

      roomRef.update({
        started:true
      });


      setTimeout(
        ()=>{

          window.location.href =
            `online1(2).html?room=${room}&player=${myPlayer}&type=${type}&name=${encodeURIComponent(safeEmail)}`;

        },
        1000
      );

    }

  }
);


/* =========================================================
   READY
========================================================= */

function setReady(){

  roomRef
    .child(
      'player' +
      myPlayer +
      '/ready'
    )
    .set(true);


  const btn =
    document.getElementById(
      'readyBtn'
    );


  btn.disabled =
    true;


  btn.innerText =
    '✅ تم — في انتظار اللاعب الآخر';


}


/* =========================================================
   PARTICLES
========================================================= */

for(
  let i=0;
  i<32;
  i++
){

  const p =
    document.createElement('div');

  p.className =
    'particle';


  const size =
    1 + Math.random()*2;

  p.style.width =
    size + 'px';

  p.style.height =
    size + 'px';


  p.style.left =
    Math.random()*100 + '%';


  p.style.top =
    (70 + Math.random()*35) + '%';


  p.style.animation =
    `float ${6 + Math.random()*12}s ${Math.random()*8}s infinite linear`;


  p.style.opacity =
    .2 + Math.random()*.7;


  document.body.appendChild(p);

}


/* =========================================================
   EXTRA STARS
========================================================= */

for(
  let i=0;
  i<14;
  i++
){

  const star =
    document.createElement('div');

  star.style.position =
    'fixed';

  star.style.width =
    '2px';

  star.style.height =
    '2px';

  star.style.borderRadius =
    '50%';

  star.style.background =
    '#fff';

  star.style.boxShadow =
    '0 0 6px #fff,0 0 12px #4aaaff';

  star.style.left =
    Math.random()*100 + '%';

  star.style.top =
    Math.random()*100 + '%';

  star.style.opacity =
    .15 + Math.random()*.55;

  star.style.pointerEvents =
    'none';

  star.style.zIndex =
    '2';

  document.body.appendChild(star);

}


/* =========================================================
   PAGE FADE
========================================================= */

window.addEventListener(
  'load',
  function(){

    document.body.style.opacity =
      '0';

    setTimeout(
      function(){

        document.body.style.transition =
          'opacity .5s ease';

        document.body.style.opacity =
          '1';

      },
      50
    );

  }
);

</script>

</body>
</html>
