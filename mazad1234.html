<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=400, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>مزاد النجوم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:400px;
  margin:0 auto;
  overflow-x:hidden;
}

body{
  min-height:100vh;
  font-family:'Cairo',sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% -10%,rgba(35,105,220,.55),transparent 45%),
    radial-gradient(circle at 15% 80%,rgba(0,70,190,.18),transparent 35%),
    radial-gradient(circle at 90% 60%,rgba(0,120,255,.15),transparent 30%),
    #020611;
}

/* نجوم الخلفية */
body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;

  background-image:
    radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1.5px),
    radial-gradient(circle,rgba(70,160,255,.7) 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,215,70,.5) 1px,transparent 1.5px);

  background-size:
    110px 110px,
    170px 170px,
    230px 230px;

  background-position:
    0 0,
    35px 70px,
    90px 30px;

  opacity:.35;
}

/* توهج أزرق */
body::after{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;

  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(0,110,255,.12),
      transparent 35%
    );

  box-shadow:
    inset 0 0 120px rgba(0,80,220,.18);
}

/* VS في الخلفية */
.vs-bg{
  position:fixed;
  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  font-family:'Orbitron',sans-serif;
  font-size:180px;
  font-weight:900;

  background:
    linear-gradient(
      90deg,
      #55baff 20%,
      #ffffff 50%,
      #ffd84a 80%
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  opacity:.07;
  z-index:0;

  pointer-events:none;

  text-shadow:
    0 0 40px rgba(40,150,255,.5);
}

/* المحتوى */
.container{
  position:relative;
  z-index:3;

  width:100%;
  min-height:100vh;

  padding:18px 10px 40px;

  text-align:center;
}

/* =========================
   العنوان
========================= */

.main-title{
  position:relative;

  margin-bottom:18px;

  font-family:'Orbitron','Cairo',sans-serif;
  font-size:27px;
  font-weight:900;
  letter-spacing:1px;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #72c4ff 52%,
      #ffffff 100%
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:
    0 0 18px rgba(50,160,255,.5);
}

.main-title::before{
  content:'⭐';

  display:block;

  margin-bottom:3px;

  font-size:30px;

  -webkit-text-fill-color:#ffd84a;

  filter:
    drop-shadow(0 0 8px rgba(255,215,70,.7))
    drop-shadow(0 0 18px rgba(255,215,70,.4));
}

/* خط تحت العنوان */
.main-title::after{
  content:'CHAMPIONS NIGHT';

  display:block;

  margin-top:2px;

  font-family:'Orbitron',sans-serif;

  font-size:8px;
  letter-spacing:4px;

  color:#69bdff;

  opacity:.8;
}

/* =========================
   الكروت
========================= */

.auctions-wrapper{
  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:11px;

  width:100%;
}

/* الكرت الأساسي */
.auction-card{
  position:relative;

  width:150px;
  height:180px;

  padding:6px;

  cursor:pointer;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      rgba(12,39,78,.95),
      rgba(2,10,28,.98)
    );

  border:
    1px solid rgba(75,166,255,.5);

  border-radius:19px;

  box-shadow:
    inset 0 0 25px rgba(0,110,255,.08),
    0 10px 28px rgba(0,0,0,.5),
    0 0 15px rgba(0,90,255,.08);

  transition:
    transform .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;
}

/* لمعان الكرت */
.auction-card::before{
  content:'';

  position:absolute;

  top:-70%;
  left:-40%;

  width:70%;
  height:220%;

  transform:rotate(25deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.08),
      transparent
    );

  pointer-events:none;

  transition:left .6s ease;
}

.auction-card:hover::before{
  left:120%;
}

.auction-card:hover{
  transform:translateY(-6px) scale(1.02);

  border-color:#6bc5ff;

  box-shadow:
    0 0 25px rgba(0,125,255,.4),
    0 12px 35px rgba(0,0,0,.5);
}

.auction-card:active{
  transform:scale(.97);
}

/* صورة الكرت */
.auction-card img{
  width:100%;
  height:120px;

  flex-shrink:0;

  object-fit:cover;

  border-radius:13px;

  border:
    1px solid rgba(255,255,255,.12);

  box-shadow:
    0 5px 15px rgba(0,0,0,.4);
}

/* اسم المزاد */
.auction-name{
  flex-grow:1;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#fff;

  font-size:14px;
  font-weight:900;

  text-shadow:
    0 0 9px rgba(70,170,255,.55);
}

/* الذهبي */
.pro-card{
  border-color:
    rgba(255,215,70,.65);

  box-shadow:
    inset 0 0 25px rgba(255,215,70,.06),
    0 0 20px rgba(255,215,70,.1),
    0 10px 28px rgba(0,0,0,.5);
}

.pro-card:hover{
  border-color:#ffd84a;

  box-shadow:
    0 0 30px rgba(255,215,70,.3),
    0 12px 35px rgba(0,0,0,.5);
}

.pro-card .auction-name{
  color:#ffd84a;

  text-shadow:
    0 0 10px rgba(255,215,70,.45);
}

/* مليار */
.billion-card{
  width:320px;
  height:180px;

  border-color:
    rgba(80,190,255,.55);
}

.billion-card img{
  width:100%;
  height:140px;

  aspect-ratio:16/9;

  object-fit:cover;
}

.billion-card .auction-name{
  color:#ffd84a;

  font-size:15px;

  padding-top:4px;

  text-shadow:
    0 0 10px rgba(255,215,70,.4);
}

/* =========================
   القوائم
========================= */

.options-menu{
  display:none;

  width:320px;

  margin:16px auto 0;

  padding:15px;

  background:
    linear-gradient(
      145deg,
      rgba(7,25,55,.98),
      rgba(1,8,22,.99)
    );

  backdrop-filter:blur(30px);

  border:
    1px solid rgba(255,215,70,.65);

  border-radius:19px;

  box-shadow:
    0 15px 40px rgba(0,0,0,.6),
    0 0 25px rgba(0,100,255,.15),
    inset 0 0 30px rgba(0,90,200,.06);

  animation:menuIn .3s ease;
}

.options-menu.active{
  display:block;
}

@keyframes menuIn{
  from{
    opacity:0;
    transform:translateY(-10px) scale(.97);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* عنوان القائمة */
.options-title{
  margin-bottom:10px;

  color:#ffd84a;

  font-size:18px;
  font-weight:900;

  text-shadow:
    0 0 10px rgba(255,215,70,.4);
}

/* =========================
   الأزرار
========================= */

.option-btn{
  width:100%;

  margin:6px 0;

  padding:10px;

  border:none;

  border-radius:10px;

  color:#fff;

  font-family:'Cairo',sans-serif;

  font-size:14px;
  font-weight:900;

  cursor:pointer;

  background:
    linear-gradient(
      90deg,
      #176bc1,
      #48b6ff,
      #176bc1
    );

  box-shadow:
    0 0 14px rgba(0,130,255,.18);

  transition:
    transform .2s ease,
    filter .2s ease,
    box-shadow .2s ease;
}

.option-btn:hover{
  filter:brightness(1.15);

  transform:translateY(-2px);

  box-shadow:
    0 0 20px rgba(60,170,255,.35);
}

.option-btn:active{
  transform:scale(.97);
}

/* AI */
.option-btn.ai{
  background:
    linear-gradient(
      90deg,
      #254e9b,
      #4c8cff,
      #254e9b
    );

  box-shadow:
    0 0 15px rgba(60,120,255,.2);
}

/* الغرفة */
.option-btn.room{
  background:
    linear-gradient(
      90deg,
      #b98a16,
      #ffd84a,
      #b98a16
    );

  color:#061020;

  box-shadow:
    0 0 18px rgba(255,215,70,.18);
}

/* =========================
   نافذة الغرفة
========================= */

.room-popup{
  display:none;

  margin-top:10px;

  padding:20px;

  background:
    linear-gradient(
      145deg,
      rgba(4,22,48,.98),
      rgba(1,7,20,.99)
    );

  border:
    1px solid rgba(78,184,255,.65);

  border-radius:15px;

  box-shadow:
    inset 0 0 25px rgba(0,110,255,.1),
    0 10px 30px rgba(0,0,0,.5);

  animation:pop .3s ease;
}

.room-popup.active{
  display:block;
}

@keyframes pop{
  from{
    transform:scale(.8);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

/* =========================
   كود الغرفة
========================= */

.room-code{
  margin:10px 0;

  padding:15px;

  font-family:'Orbitron',sans-serif;

  font-size:32px;

  color:#fff;

  background:#020b1b;

  border:
    1px dashed #ffd84a;

  border-radius:10px;

  letter-spacing:5px;

  text-shadow:
    0 0 12px rgba(80,180,255,.8);

  box-shadow:
    inset 0 0 20px rgba(0,100,255,.12);
}

/* نسخ */
.copy-btn{
  width:100%;

  padding:8px;

  border:none;

  border-radius:8px;

  cursor:pointer;

  font-family:'Cairo',sans-serif;

  font-weight:900;

  color:#071020;

  background:
    linear-gradient(
      90deg,
      #ffd84a,
      #fff0a0
    );

  transition:.2s;
}

.copy-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 0 15px rgba(255,215,70,.3);
}

.copy-btn:active{
  transform:scale(.97);
}

/* =========================
   الانتظار
========================= */

.status{
  margin-top:7px;

  color:#ffd84a;

  font-size:12px;
  font-weight:700;

  text-shadow:
    0 0 8px rgba(255,215,70,.3);
}

/* =========================
   دخول الغرفة
========================= */

.join-box{
  margin-top:15px;

  padding-top:15px;

  border-top:
    1px solid rgba(100,160,220,.18);
}

.join-input{
  width:100%;

  margin-bottom:8px;

  padding:10px;

  background:#020a18;

  border:
    1px solid rgba(73,170,255,.6);

  border-radius:8px;

  color:#fff;

  text-align:center;

  font-family:'Orbitron',sans-serif;

  font-size:18px;

  outline:none;

  box-shadow:
    inset 0 0 15px rgba(0,100,255,.08);

  transition:.2s;
}

.join-input:focus{
  border-color:#62c3ff;

  box-shadow:
    0 0 15px rgba(70,170,255,.2),
    inset 0 0 15px rgba(0,100,255,.1);
}

.join-input::placeholder{
  color:#6e8eaf;

  font-family:'Cairo',sans-serif;

  font-size:13px;
}

/* دخول */
.join-btn{
  width:100%;

  padding:10px;

  border:none;

  border-radius:8px;

  cursor:pointer;

  font-family:'Cairo',sans-serif;

  font-weight:900;

  color:#061020;

  background:
    linear-gradient(
      90deg,
      #277fd1,
      #62c3ff
    );

  transition:.2s;
}

.join-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 0 18px rgba(60,180,255,.3);
}

.join-btn:active{
  transform:scale(.97);
}

/* =========================
   شاشات صغيرة
========================= */

@media(max-width:400px){

  html,
  body{
    width:100%;
  }

  .container{
    padding-left:8px;
    padding-right:8px;
  }

  .auction-card{
    width:145px;
  }

  .billion-card{
    width:300px;
  }

  .options-menu{
    width:300px;
  }
}

</style>
</head>

<body>

<!-- VS خلفية -->
<div class="vs-bg">VS</div>

<div class="container">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>


<script>

const firebaseConfig = {
  databaseURL:
    "https://mazad-noogom-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let currentRoomRef = null;

const userEmail =
  localStorage.getItem('userEmail') || 'guest';


/* =========================
   إظهار قائمة المزاد
========================= */

function show(t){

  document
    .querySelectorAll('.options-menu')
    .forEach(m =>
      m.classList.remove('active')
    );

  const menu =
    document.getElementById(t);

  if(menu){
    menu.classList.add('active');

    menu.scrollIntoView({
      behavior:'smooth',
      block:'nearest'
    });
  }
}


/* =========================
   إنشاء كود الغرفة
========================= */

function generateCode(){

  const chars =
    'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  let code = '';

  for(let i = 0; i < 6; i++){

    code += chars.charAt(
      Math.floor(
        Math.random() * chars.length
      )
    );

  }

  return code;
}


/* =========================
   الذهاب للّوبي
========================= */

function goToLobby(code, player, type){

  let lobbyPage = 'loby.html';

  if(type === 'normal'){
    lobbyPage = 'loby2.html';
  }

  if(type === 'billion'){
    lobbyPage = 'loby3.html';
  }

  window.location.href =
    `${lobbyPage}?room=${code}` +
    `&player=${player}` +
    `&type=${type}` +
    `&name=${encodeURIComponent(userEmail)}`;

}


/* =========================
   إنشاء غرفة
========================= */

async function createRoom(type){

  const statusEl =
    document.getElementById(
      'status-' + type
    );

  statusEl.textContent =
    'جاري انشاء الغرفة...';

  let code = generateCode();

  currentRoomRef =
    db.ref(
      'rooms/' +
      type +
      '/' +
      code
    );


  try{

    const snapshot =
      await currentRoomRef.get();


    /* لو الكود موجود بالفعل */
    if(snapshot.exists()){

      return createRoom(type);

    }


    /* إنشاء الغرفة */

    await currentRoomRef.set({

      player1:userEmail,

      player2:"",

      type:type,

      status:'waiting'

    });


    /* إظهار الكود */

    document.getElementById(
      'code-' + type
    ).textContent = code;


    document.getElementById(
      'room-' + type
    ).classList.add('active');


    statusEl.textContent =
      'في انتظار لاعب 2...';


    /* مراقبة الغرفة */

    currentRoomRef.on(
      'value',
      (snap) => {

        const data =
          snap.val();


        if(
          data &&
          data.player2 &&
          data.player2 !== "" &&
          data.status !== 'started'
        ){

          currentRoomRef.update({
            status:'started'
          });


          statusEl.textContent =
            'لاعب انضم! جاري الدخول للوبي...';


          setTimeout(
            () => {
              goToLobby(
                code,
                1,
                type
              );
            },
            1000
          );

        }

      }
    );

  }
  catch(error){

    console.error(error);

    statusEl.textContent =
      'حصل خطأ أثناء إنشاء الغرفة';

    alert(
      'حصل خطأ في إنشاء الغرفة'
    );

  }

}


/* =========================
   دخول غرفة
========================= */

async function joinRoom(type){

  const input =
    document.getElementById(
      'join-' + type
    );

  const code =
    input.value
      .trim()
      .toUpperCase();


  if(code.length < 4){

    alert(
      'دخل كود صحيح'
    );

    return;

  }


  currentRoomRef =
    db.ref(
      'rooms/' +
      type +
      '/' +
      code
    );


  try{

    const snapshot =
      await currentRoomRef.get();


    /* الغرفة غير موجودة */

    if(!snapshot.exists()){

      alert(
        'الكود ده مش موجود'
      );

      return;

    }


    const data =
      snapshot.val();


    /* الغرفة ممتلئة */

    if(
      data.player2 &&
      data.player2 !== ""
    ){

      alert(
        'الغرفة ممتلئة'
      );

      return;

    }


    /* اللعبة بدأت */

    if(data.status === 'started'){

      alert(
        'الجيم بدأ خلاص'
      );

      return;

    }


    /* تسجيل اللاعب الثاني */

    await currentRoomRef.update({

      player2:userEmail

    });


    /* الذهاب للّوبي */

    goToLobby(
      code,
      2,
      type
    );

  }
  catch(error){

    console.error(error);

    alert(
      'حصل خطأ أثناء دخول الغرفة'
    );

  }

}


/* =========================
   نسخ الكود
========================= */

function copyCode(id){

  const code =
    document.getElementById(id)
      .textContent;


  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(code)
      .then(() => {

        alert(
          'تم نسخ الكود'
        );

      })
      .catch(() => {

        alert(
          'انسخ الكود يدويًا: ' +
          code
        );

      });

  }
  else{

    alert(
      'انسخ الكود يدويًا: ' +
      code
    );

  }

}
