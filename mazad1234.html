<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=400, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>مزاد النجوم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">


<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap');

:root{--blue:#147cff;--cyan:#48d8ff;--gold:#ffd45a;--navy:#020817;--white:#f5f9ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Cairo,Arial,sans-serif}
body{
 color:var(--white);overflow-x:hidden;
 background:
 radial-gradient(circle at 50% 20%,rgba(22,105,255,.34),transparent 28%),
 radial-gradient(circle at 50% 100%,rgba(0,190,255,.12),transparent 35%),
 #01040d;
}
body:before{
 content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
 background:
  linear-gradient(rgba(1,5,15,.68),rgba(1,5,15,.78)),
  url("https://i.postimg.cc/hg5jQgBD/uefa-champions-league-star-sky-design-4naonnwbj0ncjr50.jpg") center/cover;
}
body:after{
 content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
 background-image:
  radial-gradient(circle,#fff 0 1px,transparent 1.5px),
  radial-gradient(circle,#58bdff 0 1px,transparent 1.5px);
 background-size:97px 97px,151px 151px;
 animation:starMove 16s linear infinite;
 opacity:.55;
}
@keyframes starMove{to{background-position:0 97px,0 -151px}}

.container{position:relative;z-index:3;width:min(980px,94%);margin:auto;padding:18px 0 60px}

/* دوري الأبطال: نجمة ضخمة خلف الصفحة */
.container:before{
 content:"✦";position:fixed;z-index:-1;left:50%;top:48%;
 transform:translate(-50%,-50%);
 font-size:min(75vw,720px);line-height:1;color:transparent;
 -webkit-text-stroke:1px rgba(64,154,255,.09);
 text-shadow:0 0 80px rgba(25,124,255,.09);
 animation:championStar 9s ease-in-out infinite;
}
@keyframes championStar{
 0%,100%{transform:translate(-50%,-50%) rotate(0deg) scale(1);opacity:.65}
 50%{transform:translate(-50%,-50%) rotate(9deg) scale(1.06);opacity:1}
}

/* الهيدر */
.main-title{
 position:relative;text-align:center;margin:0 auto 36px;padding:20px 10px 18px;
 border-radius:22px;overflow:hidden;
 border:1px solid rgba(86,171,255,.35);
 background:linear-gradient(180deg,rgba(7,28,66,.88),rgba(2,8,24,.78));
 box-shadow:0 0 45px rgba(16,112,255,.18),inset 0 1px rgba(255,255,255,.08);
 font:900 clamp(24px,6vw,44px) Orbitron,Cairo,sans-serif;
 letter-spacing:2px;text-shadow:0 0 22px rgba(64,168,255,.7);
}
.main-title:before{
 content:"";position:absolute;top:-120%;left:-25%;width:35%;height:340%;
 transform:rotate(25deg);
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
 animation:titleShine 3.5s ease-in-out infinite;
}
@keyframes titleShine{0%,45%{left:-45%;opacity:0}55%{opacity:1}100%{left:125%;opacity:0}}
.main-title:after{
 content:"★  UEFA CHAMPIONS NIGHT  ★";
 display:block;margin-top:7px;color:#8ec9ff;
 font:800 10px Orbitron,Cairo,sans-serif;letter-spacing:4px;
}

/* شبكة الكروت */
.auctions-wrapper{
 display:grid;grid-template-columns:repeat(2,1fr);gap:24px;
 perspective:1200px;
}
.auction-card{
 position:relative;min-height:355px;overflow:hidden;cursor:pointer;
 border-radius:28px;
 border:1px solid rgba(77,169,255,.35);
 background:
  linear-gradient(145deg,rgba(10,38,87,.94),rgba(1,7,21,.98)),
  radial-gradient(circle at 50% 20%,rgba(34,143,255,.25),transparent 50%);
 box-shadow:0 25px 65px rgba(0,0,0,.7),inset 0 1px rgba(255,255,255,.09);
 transform-style:preserve-3d;
 transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .45s;
 animation:cardFloat 5s ease-in-out infinite;
}
.auction-card:nth-child(2){animation-delay:-1.5s}
.auction-card:nth-child(3){animation-delay:-3s}
@keyframes cardFloat{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-6px)}
}
.auction-card:hover{
 transform:translateY(-16px) rotateX(5deg) rotateY(-2deg) scale(1.025)!important;
 border-color:rgba(90,192,255,.85);
 box-shadow:0 38px 90px rgba(0,0,0,.8),0 0 55px rgba(22,126,255,.28);
}
.auction-card:before{
 content:"";position:absolute;inset:-2px;border-radius:30px;z-index:0;
 background:conic-gradient(from 0deg,transparent 0 15%,rgba(50,174,255,.9) 23%,transparent 32% 60%,rgba(92,207,255,.65) 69%,transparent 78%);
 mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 mask-composite:exclude;padding:1px;
 animation:borderOrbit 5s linear infinite;
}
@keyframes borderOrbit{to{transform:rotate(360deg)}}

.auction-card .energy{
 position:absolute;left:50%;top:32px;width:260px;height:260px;
 transform:translateX(-50%);
 border-radius:50%;
 border:1px solid rgba(64,171,255,.18);
 box-shadow:0 0 35px rgba(30,143,255,.18),inset 0 0 40px rgba(30,143,255,.12);
 animation:energy 4s ease-in-out infinite;
}
.auction-card .energy:before,.auction-card .energy:after{
 content:"";position:absolute;inset:14%;border-radius:50%;
 border:1px solid rgba(84,202,255,.22);
 transform:rotate(30deg) scaleX(.5);
}
.auction-card .energy:after{transform:rotate(-30deg) scaleX(.5)}
@keyframes energy{50%{transform:translateX(-50%) scale(1.08) rotate(180deg);opacity:.7}}

.auction-card img{
 position:relative;z-index:2;display:block;width:88%;height:270px;margin:15px auto 0;
 object-fit:contain;filter:drop-shadow(0 22px 25px rgba(0,0,0,.65));
 animation:playerFloat 3.8s ease-in-out infinite;
 transition:.45s;
}
@keyframes playerFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-9px) rotate(.7deg)}}
.auction-card:hover img{transform:translateY(-15px) scale(1.06)}

.auction-name{
 position:absolute;z-index:5;left:14px;right:14px;bottom:14px;
 padding:12px;border-radius:15px;text-align:center;
 background:linear-gradient(180deg,rgba(7,25,55,.72),rgba(1,7,19,.94));
 border:1px solid rgba(93,179,255,.3);
 backdrop-filter:blur(12px);
 font-size:20px;font-weight:900;
 box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.auction-name:before{content:"✦ ";color:var(--cyan)}
.pro-card{
 border-color:rgba(255,213,87,.62);
 background:linear-gradient(145deg,rgba(67,49,9,.92),rgba(8,8,5,.98));
 box-shadow:0 25px 70px rgba(0,0,0,.72),0 0 55px rgba(255,192,42,.16);
}
.pro-card:before{background:conic-gradient(from 0deg,transparent 0 15%,#ffe889 23%,transparent 32% 60%,#ffad19 69%,transparent 78%)}
.pro-card .energy{border-color:rgba(255,213,83,.25);box-shadow:0 0 50px rgba(255,191,35,.25)}
.pro-card .auction-name{color:#ffe28a;border-color:rgba(255,210,76,.38)}
.pro-card .auction-name:before{color:#ffd54e}

.billion-card{
 grid-column:1/-1;min-height:290px;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(120deg,rgba(8,48,105,.96),rgba(2,8,24,.98));
}
.billion-card img{height:235px;width:72%;margin:0 auto}

/* أزرار وقوائم */
.options-menu{
 display:none;position:relative;margin:24px auto 0;max-width:680px;padding:22px;
 border-radius:24px;border:1px solid rgba(76,164,255,.35);
 background:linear-gradient(145deg,rgba(7,24,55,.96),rgba(1,7,20,.98));
 box-shadow:0 25px 70px rgba(0,0,0,.72),0 0 35px rgba(20,125,255,.16);
}
.options-menu.active{display:block;animation:menuIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes menuIn{from{opacity:0;transform:translateY(25px) scale(.97)}to{opacity:1;transform:none}}
.option-btn{
 position:relative;overflow:hidden;width:100%;padding:13px;margin:6px 0;
 border-radius:13px;cursor:pointer;
 color:#eaf5ff;font:900 15px Cairo;
 background:linear-gradient(180deg,rgba(26,79,148,.58),rgba(7,28,63,.85));
 border:1px solid rgba(88,169,255,.3);
 transition:.25s;
}
.option-btn:hover{transform:translateX(-5px);border-color:#5ec6ff;box-shadow:0 0 25px rgba(30,137,255,.2)}
.option-btn.room{color:#111a2c;background:linear-gradient(180deg,#fff0a1,#ffd24c,#d99011);border-color:#fff0a2}
.option-btn.ai{background:linear-gradient(180deg,#2b8fff,#0d4ca7)}

.room-popup{
 display:none;margin-top:16px;padding:18px;text-align:center;border-radius:18px;
 background:rgba(1,6,17,.82);border:1px solid rgba(255,207,75,.3);
}
.room-popup.active{display:block;animation:menuIn .3s ease}
.room-code{
 width:250px;max-width:100%;margin:9px auto;padding:12px;
 color:#ffe58d;background:#01050d;border:1px solid rgba(255,215,90,.45);
 border-radius:13px;font:900 26px Orbitron;letter-spacing:7px;
 box-shadow:0 0 30px rgba(255,183,30,.12);
}
.copy-btn,.join-btn{padding:10px 18px;border:0;border-radius:11px;cursor:pointer;font:900 13px Cairo}
.copy-btn{background:#162c50;color:#e2efff}.join-btn{background:linear-gradient(180deg,#4ed7ff,#1479ec);color:#fff}
.status{min-height:22px;margin:10px;color:#8db7e9;font-size:13px;font-weight:800}
.join-box{display:flex;gap:8px}
.join-input{flex:1;min-width:0;padding:11px;text-align:center;color:#fff;background:#020711;border:1px solid rgba(88,165,255,.3);border-radius:11px;outline:none;font:800 14px Cairo}
.join-input:focus{border-color:#4dbbff;box-shadow:0 0 20px rgba(44,153,255,.18)}

@media(max-width:650px){
 .auctions-wrapper{grid-template-columns:1fr}
 .billion-card{grid-column:auto;min-height:340px}
 .billion-card img{height:260px;width:88%}
}
@media(max-width:430px){
 .container{width:92%;padding-top:10px}
 .main-title{margin-bottom:22px}
 .auction-card{min-height:325px}
 .auction-card img{height:250px}
 .join-box{flex-direction:column}
}
</style>


<style>
/* ===== MOBILE POLISH ===== */
html,body{width:100%;min-width:0}
body{overflow-x:hidden;-webkit-text-size-adjust:100%;touch-action:pan-y}
.container{width:calc(100% - 18px);max-width:520px;padding:10px 0 35px}

/* عنوان أصغر وأنظف للموبايل */
.main-title{
  margin:0 auto 20px;
  padding:15px 8px 13px;
  border-radius:17px;
  font-size:clamp(20px,7vw,31px);
  letter-spacing:1px;
}
.main-title:after{
  font-size:8px;
  letter-spacing:2px;
  margin-top:5px;
}

/* كرت واحد في كل صف */
.auctions-wrapper{
  display:flex;
  flex-direction:column;
  gap:14px;
  width:100%;
}
.auction-card,
.auction-card:hover{
  width:100%;
  min-height:0;
  height:330px;
  transform:none !important;
  animation:mobileFloat 5s ease-in-out infinite;
  border-radius:21px;
}
.auction-card:nth-child(2){animation-delay:-1.2s}
.auction-card:nth-child(3){animation-delay:-2.4s}

@keyframes mobileFloat{
  0%,100%{transform:translateY(0)!important}
  50%{transform:translateY(-4px)!important}
}

/* صور الكروت */
.auction-card img,
.auction-card:hover img{
  width:92%;
  height:255px;
  margin:8px auto 0;
  transform:none;
  animation:mobilePlayer 4s ease-in-out infinite;
}
@keyframes mobilePlayer{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}

.auction-card .energy{
  width:220px;
  height:220px;
  top:30px;
}
.auction-card:after{animation-duration:4.8s}

.auction-name{
  left:10px;
  right:10px;
  bottom:10px;
  padding:9px 8px;
  border-radius:12px;
  font-size:17px;
}

/* المليار */
.billion-card,
.billion-card:hover{
  min-height:300px;
  height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.billion-card img{
  width:94%;
  height:245px;
  margin:0 auto;
}

/* القوائم */
.options-menu{
  width:100%;
  margin-top:14px;
  padding:15px;
  border-radius:18px;
}
.option-btn{
  min-height:48px;
  margin:5px 0;
  padding:11px 9px;
  font-size:14px;
  border-radius:11px;
}
.room-popup{
  padding:14px 10px;
  border-radius:15px;
}
.room-code{
  width:100%;
  font-size:22px;
  letter-spacing:5px;
}
.copy-btn,.join-btn{
  min-height:44px;
  padding:9px 14px;
}
.join-box{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.join-input{
  width:100%;
  min-height:45px;
  font-size:15px;
}

/* منع تأثير hover المزعج على الشاشات اللمسية */
@media (hover:none){
  .auction-card:hover{
    border-color:rgba(77,169,255,.35);
    box-shadow:0 25px 65px rgba(0,0,0,.7),inset 0 1px rgba(255,255,255,.09);
  }
}

/* شاشات صغيرة جداً */
@media(max-width:360px){
  .container{width:calc(100% - 12px)}
  .main-title{font-size:20px;padding:13px 5px}
  .main-title:after{font-size:7px;letter-spacing:1px}
  .auction-card{height:300px}
  .auction-card img{height:230px}
  .billion-card{height:280px;min-height:280px}
  .billion-card img{height:220px}
  .auction-name{font-size:15px}
}

/* لو الهاتف في الوضع الأفقي */
@media(max-height:520px) and (orientation:landscape){
  .container{max-width:760px}
  .auctions-wrapper{
    display:grid;
    grid-template-columns:repeat(2,1fr);
  }
  .billion-card{grid-column:1/-1}
  .auction-card{height:280px}
  .auction-card img{height:215px}
}
</style>


<style id="epicIntroCSS">
#clIntro{
 position:fixed;inset:0;z-index:999999;
 overflow:hidden;display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 background:
  radial-gradient(circle at 50% 48%,rgba(31,122,255,.28),transparent 22%),
  radial-gradient(circle at 50% 50%,rgba(5,38,110,.5),transparent 48%),
  #01040d;
 animation:introOut 1s ease 6.6s forwards;
 cursor:pointer;
}
#clIntro .cl-stars{
 position:absolute;inset:-20%;
 background-image:
  radial-gradient(circle,#fff 0 1px,transparent 1.6px),
  radial-gradient(circle,#65c8ff 0 1px,transparent 1.7px),
  radial-gradient(circle,#fff 0 .7px,transparent 1.3px);
 background-size:73px 73px,127px 127px,43px 43px;
 animation:introStars 4s linear infinite;
}
@keyframes introStars{to{transform:translateY(110px) rotate(.7deg)}}

#clIntro .cl-rays{
 position:absolute;width:170vmax;height:170vmax;
 background:conic-gradient(from 0deg,transparent 0 7%,rgba(61,153,255,.10) 9%,transparent 15% 25%,rgba(74,190,255,.08) 29%,transparent 38% 55%,rgba(255,215,100,.07) 60%,transparent 67% 100%);
 animation:introSpin 12s linear infinite;
}
@keyframes introSpin{to{transform:rotate(360deg)}}

#clIntro .cl-orbit{
 position:absolute;border:1px solid rgba(73,175,255,.22);
 border-radius:50%;left:50%;top:50%;
 transform:translate(-50%,-50%);
 box-shadow:0 0 30px rgba(25,130,255,.10);
}
#clIntro .orbit1{width:58vmin;height:20vmin;animation:orbitA 3.2s ease-in-out infinite}
#clIntro .orbit2{width:68vmin;height:25vmin;transform:translate(-50%,-50%) rotate(60deg);animation:orbitB 4s ease-in-out infinite}
#clIntro .orbit3{width:78vmin;height:30vmin;transform:translate(-50%,-50%) rotate(-60deg);animation:orbitC 5s ease-in-out infinite}
@keyframes orbitA{50%{transform:translate(-50%,-50%) rotate(180deg) scale(1.15)}}
@keyframes orbitB{50%{transform:translate(-50%,-50%) rotate(240deg) scale(.9)}}
@keyframes orbitC{50%{transform:translate(-50%,-50%) rotate(120deg) scale(1.08)}}

#clIntro .cl-ball{
 position:relative;z-index:3;
 width:clamp(88px,22vw,145px);height:clamp(88px,22vw,145px);
 border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 background:
  radial-gradient(circle at 32% 25%,#fff 0 3%,#b9d8ff 15%,#174f9d 47%,#020c24 75%);
 border:2px solid rgba(153,213,255,.7);
 box-shadow:
  0 0 0 10px rgba(45,144,255,.05),
  0 0 45px rgba(37,151,255,.65),
  0 0 110px rgba(24,105,255,.38);
 animation:ballIn 1.3s cubic-bezier(.16,1,.3,1) forwards,
           ballFloat 3s ease-in-out 1.3s infinite;
 transform:scale(0) rotate(-180deg);
}
.cl-ball-inner{
 font-size:clamp(34px,9vw,70px);color:#fff;
 text-shadow:0 0 14px #55caff,0 0 40px #167cff;
 animation:ballStar 1.8s ease-in-out 1.3s infinite;
}
@keyframes ballIn{to{transform:scale(1) rotate(0)}}
@keyframes ballFloat{50%{transform:translateY(-12px) rotate(180deg)}}
@keyframes ballStar{50%{transform:scale(1.15);opacity:.75}}

#clIntro .cl-small{
 margin-top:24px;z-index:4;
 color:#8dcaff;letter-spacing:clamp(3px,1.3vw,7px);
 font:800 clamp(9px,2vw,13px) Orbitron,Cairo,sans-serif;
 opacity:0;animation:fadeUp .8s ease 1.2s forwards;
}
#clIntro .cl-logo{
 z-index:4;margin-top:5px;
 color:#ffd45a;font-size:34px;line-height:1;
 text-shadow:0 0 15px #ffd45a,0 0 45px rgba(255,190,40,.75);
 opacity:0;animation:logoPop .8s cubic-bezier(.2,1.4,.3,1) 1.55s forwards;
}
#clIntro .cl-title{
 z-index:4;text-align:center;
 font:900 clamp(38px,11vw,78px)/.86 Orbitron,Cairo,sans-serif;
 letter-spacing:clamp(2px,1vw,6px);
 color:#fff;
 text-shadow:0 0 8px #fff,0 0 25px #248dff,0 0 60px rgba(35,122,255,.8);
 opacity:0;transform:scale(.72);
 animation:titlePop 1s cubic-bezier(.15,1.4,.25,1) 1.8s forwards;
}
#clIntro .cl-title span{
 background:linear-gradient(#fff,#acd9ff 42%,#4caeff 70%,#fff);
 -webkit-background-clip:text;background-clip:text;color:transparent;
}
#clIntro .cl-line{
 z-index:4;width:0;height:2px;margin-top:17px;
 background:linear-gradient(90deg,transparent,#ffd45a,#fff,#54caff,transparent);
 box-shadow:0 0 18px #3caeff,0 0 10px #ffd45a;
 animation:lineGrow .9s ease 2.65s forwards;
}
#clIntro .cl-sub{
 z-index:4;margin-top:11px;
 color:#ffd96b;letter-spacing:clamp(2px,1vw,5px);
 font:800 clamp(9px,2.2vw,14px) Orbitron,Cairo,sans-serif;
 opacity:0;animation:fadeUp .8s ease 2.9s forwards;
}
#clIntro .cl-skip{
 position:absolute;bottom:22px;z-index:5;
 color:rgba(194,218,255,.6);font:700 9px Cairo;
 letter-spacing:1px;opacity:0;
 animation:fadeIn .7s ease 4s forwards;
}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(15px)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes logoPop{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes titlePop{to{opacity:1;transform:scale(1)}}
@keyframes lineGrow{to{width:min(70vw,430px)}}
@keyframes introOut{to{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.08)}}

@media(max-width:420px){
 #clIntro .cl-small{margin-top:18px}
 #clIntro .cl-logo{font-size:27px}
 #clIntro .cl-sub{margin-top:9px}
}
@media(prefers-reduced-motion:reduce){
 #clIntro{animation:introOut .4s ease 3s forwards}
 #clIntro *{animation-duration:.01ms!important}
}
</style>

</head>

<body>

<!-- CHAMPIONS LEAGUE EPIC INTRO -->
<div id="clIntro" aria-hidden="true">
  <div class="cl-stars"></div>
  <div class="cl-rays"></div>
  <div class="cl-orbit orbit1"></div>
  <div class="cl-orbit orbit2"></div>
  <div class="cl-orbit orbit3"></div>

  <div class="cl-ball">
    <div class="cl-ball-inner">★</div>
  </div>

  <div class="cl-small">THE CHAMPIONS</div>
  <div class="cl-logo">★</div>
  <div class="cl-title">CHAMPIONS<br><span>LEAGUE</span></div>
  <div class="cl-line"></div>
  <div class="cl-sub">THE ROAD TO GLORY</div>
  <div class="cl-skip">L&amp;S GAMES • TAP TO SKIP</div>
</div>


<!-- VS خلفية -->
<div class="vs-bg">VS</div>

<div class="container">

  <!-- العنوان -->
  <div class="main-title">
    مزاد النجوم
  </div>

  <!-- أنواع المزاد -->
  <div class="auctions-wrapper">

    <div
      class="auction-card pro-card"

    >

      <img
        src="https://i.postimg.cc/Wdsn7wnd/image.png"
        alt="المزاد الذهبي"
      >

      <div class="auction-name">
        الذهبي 👑
      </div>

    </div>


    <!-- العادي -->
    <div
      class="auction-card"
      onclick="show('normal')"

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>


<script>

const firebaseConfig = {
  databaseURL:
    "https://mazad-noogom-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let currentRoomRef = null;

const userEmail =
  localStorage.getItem('userEmail') || 'guest';


/* =========================
   إظهار قائمة المزاد
========================= */

function show(t){

  document
    .querySelectorAll('.options-menu')
    .forEach(m =>
      m.classList.remove('active')
    );

  const menu =
    document.getElementById(t);

  if(menu){
    menu.classList.add('active');

    menu.scrollIntoView({
      behavior:'smooth',
      block:'nearest'
    });
  }
}


/* =========================
   إنشاء كود الغرفة
========================= */

function generateCode(){

  const chars =
    'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  let code = '';

  for(let i = 0; i < 6; i++){

    code += chars.charAt(
      Math.floor(
        Math.random() * chars.length
      )
    );

  }

  return code;
}


/* =========================
   الذهاب للّوبي
========================= */

function goToLobby(code, player, type){

  let lobbyPage = 'loby.html';

  if(type === 'normal'){
    lobbyPage = 'loby2.html';
  }

  if(type === 'billion'){
    lobbyPage = 'loby3.html';
  }

  window.location.href =
    `${lobbyPage}?room=${code}` +
    `&player=${player}` +
    `&type=${type}` +
    `&name=${encodeURIComponent(userEmail)}`;

}


/* =========================
   إنشاء غرفة
========================= */

async function createRoom(type){

  const statusEl =
    document.getElementById(
      'status-' + type
    );

  statusEl.textContent =
    'جاري انشاء الغرفة...';

  let code = generateCode();

  currentRoomRef =
    db.ref(
      'rooms/' +
      type +
      '/' +
      code
    );


  try{

    const snapshot =
      await currentRoomRef.get();


    /* لو الكود موجود بالفعل */
    if(snapshot.exists()){

      return createRoom(type);

    }


    /* إنشاء الغرفة */

    await currentRoomRef.set({

      player1:userEmail,

      player2:"",

      type:type,

      status:'waiting'

    });


    /* إظهار الكود */

    document.getElementById(
      'code-' + type
    ).textContent = code;


    document.getElementById(
      'room-' + type
    ).classList.add('active');


    statusEl.textContent =
      'في انتظار لاعب 2...';


    /* مراقبة الغرفة */

    currentRoomRef.on(
      'value',
      (snap) => {

        const data =
          snap.val();


        if(
          data &&
          data.player2 &&
          data.player2 !== "" &&
          data.status !== 'started'
        ){

          currentRoomRef.update({
            status:'started'
          });


          statusEl.textContent =
            'لاعب انضم! جاري الدخول للوبي...';


          setTimeout(
            () => {
              goToLobby(
                code,
                1,
                type
              );
            },
            1000
          );

        }

      }
    );

  }
  catch(error){

    console.error(error);

    statusEl.textContent =
      'حصل خطأ أثناء إنشاء الغرفة';

    alert(
      'حصل خطأ في إنشاء الغرفة'
    );

  }

}


/* =========================
   دخول غرفة
========================= */

async function joinRoom(type){

  const input =
    document.getElementById(
      'join-' + type
    );

  const code =
    input.value
      .trim()
      .toUpperCase();


  if(code.length < 4){

    alert(
      'دخل كود صحيح'
    );

    return;

  }


  currentRoomRef =
    db.ref(
      'rooms/' +
      type +
      '/' +
      code
    );


  try{

    const snapshot =
      await currentRoomRef.get();


    /* الغرفة غير موجودة */

    if(!snapshot.exists()){

      alert(
        'الكود ده مش موجود'
      );

      return;

    }


    const data =
      snapshot.val();


    /* الغرفة ممتلئة */

    if(
      data.player2 &&
      data.player2 !== ""
    ){

      alert(
        'الغرفة ممتلئة'
      );

      return;

    }


    /* اللعبة بدأت */

    if(data.status === 'started'){

      alert(
        'الجيم بدأ خلاص'
      );

      return;

    }


    /* تسجيل اللاعب الثاني */

    await currentRoomRef.update({

      player2:userEmail

    });


    /* الذهاب للّوبي */

    goToLobby(
      code,
      2,
      type
    );

  }
  catch(error){

    console.error(error);

    alert(
      'حصل خطأ أثناء دخول الغرفة'
    );

  }

}


/* =========================
   نسخ الكود
========================= */

function copyCode(id){

  const code =
    document.getElementById(id)
      .textContent;


  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(code)
      .then(() => {

        alert(
          'تم نسخ الكود'
        );

      })
      .catch(() => {

        alert(
          'انسخ الكود يدويًا: ' +
          code
        );

      });

  }
  else{

    alert(
      'انسخ الكود يدويًا: ' +
      code
    );

  }

}

</script>


<script id="epicIntroJS">
(function(){
  const intro=document.getElementById('clIntro');
  if(!intro)return;
  let closed=false;
  function closeIntro(){
    if(closed)return;
    closed=true;
    intro.style.animation='introOut .65s ease forwards';
    setTimeout(()=>intro.remove(),680);
  }
  intro.addEventListener('click',closeIntro);
  setTimeout(closeIntro,7600);
})();
</script>
