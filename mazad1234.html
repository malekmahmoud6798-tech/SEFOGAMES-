<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=400, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مزاد النجوم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html, body{width:400px;margin:0 auto;background:#000;overflow-x:hidden;}
body{font-family:'Cairo';color:#fff;background:#000;min-height:100vh}

.vs-bg{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-family:'Orbitron'; font-size:180px; font-weight:900; background: linear-gradient(90deg, #ff0000 50%, #0066ff 50%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; opacity: 0.1; z-index:0; pointer-events:none;}

.container{position:relative;z-index:2;padding:20px 10px;width:100%;text-align:center}
.main-title{font-size:28px; font-weight:900; color:#ffd700; margin-bottom:5px}

.auctions-wrapper{display:flex; gap:10px; justify-content:center; width:100%; flex-wrap:wrap;}
.auction-card{width:150px; height:180px; background:rgba(255,255,255,0.05); backdrop-filter:blur(15px); border:2px solid rgba(0,204,255,0.3); border-radius:15px; padding:6px; cursor:pointer; transition:0.3s; display:flex; flex-direction:column;}
.auction-card:hover{transform:translateY(-5px); border-color:#00ccff; box-shadow:0 0 20px rgba(0,204,255,0.6)}
.auction-card img{width:100%; height:120px; border-radius:10px; margin-bottom:6px; object-fit:cover; flex-shrink:0;}
.auction-name{font-size:14px; font-weight:700; color:#00ccff; flex-grow:1; display:flex; align-items:center; justify-content:center;}
.pro-card{border-color:rgba(255,215,0,0.4)} .pro-card .auction-name{color:#ffd700}

.billion-card{width:320px; height:180px; border-color:rgba(0,255,136,0.5)}
.billion-card img{width:100%; height:140px; aspect-ratio:16/9; object-fit:cover}
.billion-card .auction-name{color:#00ff88; font-size:15px; padding-top:4px}

.options-menu{display:none; background:rgba(0,0,0,0.9); backdrop-filter:blur(30px); border:2px solid #ffd700; border-radius:15px; padding:15px; margin-top:15px; width:320px; margin:15px auto 0 auto;}
.options-menu.active{display:block}
.options-title{font-size:18px; font-weight:900; color:#ffd700; margin-bottom:10px}
.option-btn{width:100%; padding:10px; margin:6px 0; background:linear-gradient(135deg,#00ccff,#0066ff); border:none; border-radius:10px; color:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:'Cairo';}
.option-btn.ai{background:linear-gradient(135deg,#ff00ff,#9900ff)}
.option-btn.room{background:linear-gradient(135deg,#ffd700,#ff8c00); color:#000}
.room-popup{display:none; background:rgba(0,0,0,0.95); border:2px solid #00ff88; border-radius:15px; padding:20px; margin-top:10px; animation:pop 0.3s;}
.room-popup.active{display:block}
@keyframes pop{from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1}}
.room-code{font-family:'Orbitron'; font-size:32px; color:#00ff88; background:#111; padding:15px; border-radius:10px; margin:10px 0; letter-spacing:5px; border:2px dashed #00ff88;}
.copy-btn{background:#00ff88; color:#000; padding:8px; border-radius:8px; border:none; font-weight:900; cursor:pointer; width:100%;}
.join-box{margin-top:15px; padding-top:15px; border-top:1px solid #333}
.join-input{width:100%; padding:10px; background:#111; border:2px solid #00ccff; border-radius:8px; color:#fff; text-align:center; font-size:18px; font-family:'Orbitron'; margin-bottom:8px;}
.join-btn{background:linear-gradient(135deg,#00ff88,#00cc88); color:#000; padding:10px; border:none; border-radius:8px; font-weight:900; cursor:pointer; width:100%;}
.status{font-size:12px; color:#00ff88; margin-top:5px}
</style>
</head>
<body>

<div class="vs-bg">VS</div>

<div class="container">
  <div class="main-title">مزاد النجوم</div>

  <div class="auctions-wrapper">
    <div class="auction-card pro-card" onclick="show('pro')">
      <img src="https://i.postimg.cc/Wdsn7wnd/image.png">
      <div class="auction-name">الذهبي 👑</div>
    </div>
    <div class="auction-card" onclick="show('normal')">
      <img src="https://i.postimg.cc/pmPZBJZr/image.png">
      <div class="auction-name">العادي ⚽</div>
    </div>
    <div class="auction-card billion-card" onclick="show('billion')">
      <img src="https://i.postimg.cc/D8YTYNBy/image.png">
      <div class="auction-name">مزاد المليار 💰</div>
    </div>
  </div>

  <!-- الذهبي -->
  <div class="options-menu" id="pro">
    <div class="options-title">المزاد الذهبي 👑</div>
    <button class="option-btn room" onclick="createRoom('pro')">انشاء غرفة</button>
    <button class="option-btn ai" onclick="window.location.href='mazad2.html'">ضد الذكاء الاصطناعي 🤖</button>
    <div class="room-popup" id="room-pro">
      <div>كود الغرفة:</div>
      <div class="room-code" id="code-pro">...</div>
      <button class="copy-btn" onclick="copyCode('code-pro')">نسخ الكود</button>
      <div class="status" id="status-pro">في انتظار لاعب 2...</div>
      <div class="join-box">
        <input type="text" class="join-input" id="join-pro" placeholder="اكتب الكود" maxlength="6">
        <button class="join-btn" onclick="joinRoom('pro')">دخول</button>
      </div>
    </div>
  </div>

  <!-- العادي -->
  <div class="options-menu" id="normal">
    <div class="options-title">المزاد العادي ⚽</div>
    <button class="option-btn room" onclick="createRoom('normal')">انشاء غرفة</button>
    <button class="option-btn ai" onclick="window.location.href='mazadnormal.html'">ضد الذكاء الاصطناعي 🤖</button>
    <div class="room-popup" id="room-normal">
      <div>كود الغرفة:</div>
      <div class="room-code" id="code-normal">...</div>
      <button class="copy-btn" onclick="copyCode('code-normal')">نسخ الكود</button>
      <div class="status" id="status-normal">في انتظار لاعب 2...</div>
      <div class="join-box">
        <input type="text" class="join-input" id="join-normal" placeholder="اكتب الكود" maxlength="6">
        <button class="join-btn" onclick="joinRoom('normal')">دخول</button>
      </div>
    </div>
  </div>

  <!-- مزاد المليار -->
  <div class="options-menu" id="billion">
    <div class="options-title">مزاد المليار 💰</div>
    <button class="option-btn room" onclick="createRoom('billion')">انشاء غرفة</button>
    <button class="option-btn ai" onclick="window.location.href='bilpno1.html'">ضد الذكاء الاصطناعي 🤖</button>
    <div class="room-popup" id="room-billion">
      <div>كود الغرفة:</div>
      <div class="room-code" id="code-billion">...</div>
      <button class="copy-btn" onclick="copyCode('code-billion')">نسخ الكود</button>
      <div class="status" id="status-billion">في انتظار لاعب 2...</div>
      <div class="join-box">
        <input type="text" class="join-input" id="join-billion" placeholder="اكتب الكود" maxlength="6">
        <button class="join-btn" onclick="joinRoom('billion')">دخول</button>
      </div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = { databaseURL: "https://mazad-noogom-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentRoomRef = null;
const userEmail = localStorage.getItem('userEmail') || 'guest';

function show(t){
  document.querySelectorAll('.options-menu').forEach(m=>m.classList.remove('active'))
  document.getElementById(t).classList.add('active')
}

function generateCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for(let i=0; i<6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  return code;
}

function goToLobby(code, player, type){
  // كل نوع ليه اللوبي بتاعه
  let lobbyPage = 'loby.html'; // الذهبي default
  if(type === 'normal') lobbyPage = 'loby2.html';
  if(type === 'billion') lobbyPage = 'loby3.html';
  
  window.location.href = `${lobbyPage}?room=${code}&player=${player}&type=${type}&name=${encodeURIComponent(userEmail)}`;
}

async function createRoom(type){
  const statusEl = document.getElementById('status-' + type);
  statusEl.textContent = 'جاري انشاء الغرفة...';
  
  let code = generateCode();
  currentRoomRef = db.ref('rooms/' + type + '/' + code);
  
  const snapshot = await currentRoomRef.get();
  if(snapshot.exists()) return createRoom(type);
  
  await currentRoomRef.set({
    player1: userEmail,
    player2: "", // فاضية مش null
    type: type,
    status: 'waiting'
  });
  
  document.getElementById('code-' + type).textContent = code;
  document.getElementById('room-' + type).classList.add('active');
  statusEl.textContent = 'في انتظار لاعب 2...';
  
  currentRoomRef.on('value', (snap) => {
    const data = snap.val();
    if(data && data.player2 && data.player2 !== "" && data.status !== 'started'){
      currentRoomRef.update({status: 'started'});
      statusEl.textContent = 'لاعب انضم! جاري الدخول للوبي...';
      setTimeout(()=> goToLobby(code, 1, type), 1000)
    }
  });
}

async function joinRoom(type){
  const code = document.getElementById('join-' + type).value.toUpperCase();
  if(code.length < 4) return alert('دخل كود صحيح');
  
  currentRoomRef = db.ref('rooms/' + type + '/' + code);
  const snapshot = await currentRoomRef.get();
  
  if(!snapshot.exists()) return alert('الكود ده مش موجود');
  
  const data = snapshot.val();
  if(data.player2 && data.player2 !== "") return alert('الغرفة ممتلئة');
  if(data.status === 'started') return alert('الجيم بدأ خلاص');
  
  await currentRoomRef.update({
    player2: userEmail
  });

  goToLobby(code, 2, type);
}

function copyCode(id){
  navigator.clipboard.writeText(document.getElementById(id).textContent);
  alert('تم نسخ الكود');
}
</script>
</body>
</html>
