function makePlayer(arr,key){
  return {wiki:aliases[arr[0]]||arr[0],n:arr[1],r:arr[2],p:arr[3],slot:key,id:arr[0]+"-"+key+"-"+Math.random()};
}
function getPool(key){
  return db[roleBase(key)]||[];
}
function choosePlayer(key){
  const pool=getPool(key).filter(x=>!state.used.has(x[0]));
  if(!pool.length){state.used.clear();return choosePlayer(key)}
  const arr=pool[Math.floor(Math.random()*pool.length)];state.used.add(arr[0]);return makePlayer(arr,key);
}

async function getWikiImage(name){
  const title=aliases[name]||name;
  if(state.imageCache.has(title)) return state.imageCache.get(title);

  const api1="https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=700&titles="+encodeURIComponent(title);
  const api2="https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1&prop=pageimages&piprop=original&titles="+encodeURIComponent(title);
  const rest="https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title.replace(/ /g,"_"));

  try{
    let res=await fetch(api1,{cache:"no-store"});
    let data=await res.json();
    let page=data?.query?.pages?.[0];
    let src=page?.thumbnail?.source||page?.original?.source||"";
    if(src){state.imageCache.set(title,src);return src;}

    res=await fetch(api2,{cache:"no-store"});
    data=await res.json();
    page=data?.query?.pages?.[0];
    src=page?.original?.source||page?.thumbnail?.source||"";
    if(src){state.imageCache.set(title,src);return src;}

    res=await fetch(rest,{cache:"no-store"});
    data=await res.json();
    src=data?.originalimage?.source||data?.thumbnail?.source||"";
    state.imageCache.set(title,src||"");
    return src||"";
  }catch(e){
    console.warn("Image load failed:",title,e);
    state.imageCache.set(title,"");
    return "";
  }
}

async function loadPlayerImage(player,imgEl,fallback){
  if(!imgEl||!fallback||!player)return "";
  const key=String(player.id||player.wiki||player.n);
  imgEl.dataset.playerKey=key;
  imgEl.style.display="none";
  imgEl.removeAttribute("src");
  fallback.style.display="flex";
  fallback.textContent="⚽";

  const src=player.photo||await getWikiImage(player.wiki);
  if(imgEl.dataset.playerKey!==key)return "";

  if(src){
    player.photo=src;
    imgEl.onload=()=>{
      if(imgEl.dataset.playerKey!==key)return;
      imgEl.style.display="block";
      fallback.style.display="none";
    };
    imgEl.onerror=()=>{
      if(imgEl.dataset.playerKey!==key)return;
      imgEl.style.display="none";
      fallback.style.display="flex";
      fallback.textContent=(player.n||"⚽").slice(0,1);
    };
    imgEl.src=src;
  }else{
    fallback.textContent=(player.n||"⚽").slice(0,1);
  }
  return src||"";
}

async function preparePlayerImage(player){
  if(!player)return "";
  if(player.photo)return player.photo;
  const src=await getWikiImage(player.wiki);
  if(src)player.photo=src;
  return src;
}

let imageWarmStarted=false;
function warmAllImages(){
  if(imageWarmStarted)return;
  imageWarmStarted=true;
  const all=[];
  Object.keys(db).forEach(role=>{
    (db[role]||[]).forEach(arr=>all.push(aliases[arr[0]]||arr[0]));
  });
  let i=0;
  const batch=async()=>{
    const jobs=[];
    for(let n=0;n<5 && i<all.length;n++,i++) jobs.push(getWikiImage(all[i]));
    await Promise.all(jobs);
    if(i<all.length)setTimeout(batch,80);
  };
  batch();
}

function renderTeam(team){
  const list=$(team===1?"userList":"aiList");

  POSITIONS.forEach(pos=>{

    if(!el)return;
    el.classList.remove("filled");

    const c=document.createElement("div");
    c.className="chip";
    c.innerHTML="<b>"+escapeHtml(p.slot)+"</b> "+escapeHtml(p.n)+" • "+p.r;
    list.appendChild(c);

    const el=$((team===1?"u-":"a-")+p.slot);
    if(!el)return;
    el.classList.remove("empty");
    el.classList.add("filled");

    const nameEl=el.querySelector(".slot-name");
    if(nameEl){nameEl.textContent=p.n;nameEl.title=p.n;}

    const box=el.querySelector(".player-mini");
    if(!box)return;
    box.innerHTML='<img class="formation-photo" alt=""><div class="mini-fallback">⚽</div>';
    const img=box.querySelector("img");
    const fb=box.querySelector(".mini-fallback");
    const cached=state.imageCache.get(aliases[p.wiki]||p.wiki);
    if(cached && !p.photo)p.photo=cached;
    loadPlayerImage(p,img,fb);
  });
}

async function startRound(){
  if(state.round>=posOrder.length){finishMatch();return}
  state.thinking=false;state.turn=1;state.highest=0;
  const key=posOrder[state.round];
  state.current=choosePlayer(key);
  // جهّز صورة لاعب المزاد قبل عرض الجولة حتى لا يظهر الكرت فارغاً.
  await preparePlayerImage(state.current);
  state.currentBid=Math.max(1000000,Math.round(state.current.p/2/1000000)*1000000);
  state.userBid=state.currentBid+1000000;
  $("positionBadge").textContent=key+" • "+roleLabel(key);
  $("rating").innerHTML=state.current.r+'<small>OVR</small>';
  $("name").textContent=state.current.n;$("pos").textContent="المركز: "+roleLabel(key);
  $("price").textContent="السعر الافتتاحي: "+money(state.currentBid);
  $("currentBidDisplay").textContent=money(state.userBid);
  $("turn").textContent="دور المزايدة: أنت";
  $("log").textContent="🎯 اللاعب ظهر. الهدف الآن تجهيز المركز "+roleLabel(key);
  const img=$("playerImg"),fb=$("photoFallback");loadPlayerImage(state.current,img,fb);
  updateButtons();updateStats();
}
function updateButtons(){
  const userHasSlot=hasRole(1,state.current.slot);
  const aiHasSlot=hasRole(2,state.current.slot);
  const userCanAct=state.turn===1 && !state.thinking && !userHasSlot;
  $("bidBtn").disabled=!userCanAct;
  $("takeBtn").disabled=state.turn!==1 || state.thinking;
  $("plusBtn").disabled=!userCanAct;
  $("minusBtn").disabled=!userCanAct;
  if(userHasSlot) $("log").textContent="ℹ️ هذا المركز موجود عندك، لذلك لا يمكنك مزايدة هذا اللاعب.";
  else if(aiHasSlot) $("log").textContent="🔥 AI لديه لاعب في هذا المركز، وقد يترك لك اللاعب.";
}

function increaseBid(){if($("plusBtn").disabled)return;const next=state.userBid+1000000;if(next>state.money[1]){alert("ميزانيتك لا تكفي.");return}state.userBid=next;$("currentBidDisplay").textContent=money(state.userBid)}
function decreaseBid(){if($("minusBtn").disabled)return;const next=state.userBid-1000000;if(next<=state.currentBid){return}state.userBid=next;$("currentBidDisplay").textContent=money(state.userBid)}

function bid(){
  if(state.turn!==1||state.thinking)return;
  if(hasRole(1,state.current.slot)){forceAIWin();return}
  if(state.userBid<=state.currentBid){alert("ارفع السعر أولاً.");return}
  if(state.userBid>state.money[1]){alert("لا تملك المبلغ.");return}
  state.currentBid=state.userBid;state.highest=1;state.turn=2;
  $("price").textContent="السعر الحالي: "+money(state.currentBid);
  $("turn").textContent="🤖 AI يفكر في الرد...";
  $("log").textContent="🔵 أنت رفعت إلى "+money(state.currentBid);
  updateButtons();setTimeout(aiMove,850+Math.random()*650);
}
function take(){
  if(state.turn!==1 || state.thinking)return;
  takeBy(1);
}

// "خده" = صاحب الزر يأخذ لاعب المزاد، والطرف الآخر
// يحصل على لاعب عشوائي مجاناً من نفس نوع المركز إن أمكن.
async function takeBy(taker){
  const opponent=taker===1?2:1;
  const auctionPlayer=state.current;
  if(!auctionPlayer)return;

  // اللاعب العشوائي للخصم يجب أن يكون من نفس المركز/النوع.
  const randomPlayer=chooseRandomSameRole(opponent, auctionPlayer.slot);

  // لا نكمل الصفقة إذا لم نجد لاعباً عشوائياً من نفس المركز.
  // هذا يمنع أن يظهر "خده" وكأن الصفقة تمت بدون أن يحصل الطرف الآخر على لاعب.
  if(!randomPlayer){
    $("log").textContent="⚠️ لا يوجد لاعب عشوائي متاح من نفس المركز للخصم.";
    state.thinking=false;
    updateButtons();
    return;
  }

  if(state.money[taker] < state.currentBid){
    $("log").textContent="⚠️ ميزانية صاحب «خده» لا تكفي.";
    state.thinking=false;
    updateButtons();
    return;
  }

  await Promise.all([
    preparePlayerImage(auctionPlayer),
    preparePlayerImage(randomPlayer)
  ]);

  // صاحب "خده" يأخذ لاعب المزاد ويدفع السعر الحالي.
  state.money[taker]-=state.currentBid;
  state.teams[taker].push({...auctionPlayer,paid:state.currentBid});

  // الخصم يأخذ لاعباً عشوائياً مجاناً من نفس نوع المركز.
  state.teams[opponent].push({...randomPlayer,paid:0,random:true});

  $("log").textContent=taker===1
    ? "🔄 أنت خدت اللاعب: "+auctionPlayer.n+" — والـAI أخذ مجاناً لاعباً عشوائياً من نفس المركز: "+randomPlayer.n
    : "🤖 AI قال خده: أنت أخذت "+auctionPlayer.n+" — والـAI أخذ مجاناً لاعباً عشوائياً من نفس المركز: "+randomPlayer.n;

  renderAll();

  state.turn=1;
  state.highest=0;
  state.thinking=false;

  setTimeout(()=>{
    state.round++;
    startRound();
  },650);
}

// يختار لاعباً عشوائياً حقيقياً من نفس نوع مركز لاعب المزاد.
// مثال: ST -> ST، LW -> LW، CB -> CB.
// لا يختار اللاعب الحالي نفسه ولا لاعباً مستخدماً من قبل.
function chooseRandomSameRole(team, auctionSlot){
  const base=roleBase(auctionSlot);

  const freeSlots=POSITIONS
    .filter(pos=>roleBase(pos.key)===base && !hasRole(team,pos.key))
    .map(pos=>pos.key);

  if(!freeSlots.length)return null;

  const pool=getPool(base).filter(player=>!state.used.has(player[0]));

  if(!pool.length)return null;

  const player=pool[Math.floor(Math.random()*pool.length)];
  const slot=freeSlots[Math.floor(Math.random()*freeSlots.length)];

  state.used.add(player[0]);

  return makePlayer(player,slot);
}

function aiStrength(){
  const team=state.teams[2];const avg=team.length?team.reduce((a,p)=>a+p.r,0)/team.length:82;
  const need=!hasRole(2,state.current.slot);let budget=state.money[2];
  let aggression=0.55+(avg<state.current.r?0.18:0)+(need?.12:0);
  if(budget<state.current.p)aggression-=.2;
  return {need,aggression};
}
function aiMove(){
  if(state.thinking)return;state.thinking=true;updateButtons();
  setTimeout(()=>{
    if(hasRole(2,state.current.slot)){award(1);return}
    const x=aiStrength(), value=state.current.r*700000, ceiling=Math.min(state.money[2],Math.max(state.currentBid+1000000,value*(1.2+x.aggression)));
    // الـAI لا يزايد كل مرة: أحياناً ينسحب ويترك اللاعب يأخذ اللاعب بالسعر الحالي.
    // كلما كان اللاعب أقوى أو احتاجه AI تزيد فرصة المزايدة، لكن تظل هناك فرصة واضحة لـ "خده".
    const bidChance = Math.min(0.78, Math.max(0.28, 0.42 + (state.current.r-80)*0.012 + (x.need?0.10:0) + (x.aggression-0.55)*0.20));
    const wants=state.current.r>=78 && Math.random()<bidChance;
    if(wants && ceiling>state.currentBid+1000000){
      const jump=Math.max(1000000,Math.round((1+Math.random()*3))*1000000);
      state.currentBid=Math.min(ceiling,state.currentBid+jump);state.highest=2;state.turn=1;
      $("price").textContent="السعر الحالي: "+money(state.currentBid);$("userBidDisplay");
      state.userBid=Math.min(state.money[1],state.currentBid+1000000);
      $("currentBidDisplay").textContent=money(state.userBid);
      $("turn").textContent="دور المزايدة: أنت";
      $("log").textContent="🔴 AI زايد إلى "+money(state.currentBid);
      state.thinking=false;updateButtons();
    }else{
      // AI يقول "خده":
      // أنت تأخذ لاعب المزاد، والـAI يأخذ لاعباً عشوائياً مجاناً
      // من نفس نوع المركز. لا نستخدم award(1) هنا لأنه كان
      // يعطي اللاعب لك فقط ويترك الـAI بدون لاعب.
      $("turn").textContent="🤖 AI: خده! 🔥";
      $("log").textContent="🤖 AI قال: خده! — جاري إعطاءك اللاعب وإعطاء AI لاعباً عشوائياً من نفس المركز...";
      state.thinking=false;
      state.turn=1;
      updateButtons();
      setTimeout(()=>takeBy(1),450);
    }
  },750+Math.random()*850);
}

async function award(winner){
  const p=state.current;if(!p)return;
  if(winner===1 && state.money[1]<state.currentBid){alert("ميزانيتك لا تكفي.");return}
  if(winner===2 && state.money[2]<state.currentBid){winner=1}
  await preparePlayerImage(p);
  state.money[winner]-=state.currentBid;
  state.teams[winner].push({...p,paid:state.currentBid});
  $("log").textContent=(winner===1?"🏆 أخذته أنت: ":"🤖 أخذه AI: ")+p.n+" مقابل "+money(state.currentBid);
  renderAll();
  setTimeout(()=>{state.round++;startRound()},550);
}

function teamStrength(team){
  const players=state.teams[team];if(players.length<11)return 50;
  const avg=players.reduce((a,p)=>a+p.r,0)/players.length;
  const gk=players.find(p=>p.slot==="GK")?.r||80;
  const def=players.filter(p=>["LB","CB1","CB2","RB"].includes(p.slot)).reduce((a,p)=>a+p.r,0)/4;
  const mid=players.filter(p=>["CM1","CM2","CAM"].includes(p.slot)).reduce((a,p)=>a+p.r,0)/3;
  const atk=players.filter(p=>["LW","ST","RW"].includes(p.slot)).reduce((a,p)=>a+p.r,0)/3;
  return avg*.15+gk*.15+def*.25+mid*.22+atk*.23;
}
function poisson(lambda){let L=Math.exp(-lambda),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function simulateMatch(){
  const s1=teamStrength(1),s2=teamStrength(2),diff=s1-s2;
  let g1=clamp(poisson(1.25+diff*.055),0,6),g2=clamp(poisson(1.25-diff*.055),0,6);
  if(g1===g2 && Math.random()<.08){if(diff>=0)g1++;else g2++}
  const poss1=clamp(Math.round(50+diff*1.1+(Math.random()*8-4)),35,65),poss2=100-poss1;
  const shots1=clamp(Math.round(9+diff*.9+Math.random()*7),4,22),shots2=clamp(Math.round(9-diff*.7+Math.random()*7),4,22);
  const on1=clamp(Math.round(shots1*(.34+Math.random()*.16)),1,shots1),on2=clamp(Math.round(shots2*(.34+Math.random()*.16)),1,shots2);
  const pass1=clamp(Math.round(82+diff*.7+Math.random()*10),70,96),pass2=clamp(Math.round(82-diff*.6+Math.random()*10),70,96);
  const corners1=clamp(Math.round(3+Math.random()*5+diff*.1),1,10),corners2=clamp(Math.round(3+Math.random()*5-diff*.1),1,10);
  const fouls1=Math.round(7+Math.random()*8),fouls2=Math.round(7+Math.random()*8);
  return {g1,g2,poss1,poss2,shots1,shots2,on1,on2,pass1,pass2,corners1,corners2,fouls1,fouls2,diff};
}
function pickScorers(team,count){
  const pool=state.teams[team].filter(p=>["ST","LW","RW","CAM"].includes(p.slot)).sort((a,b)=>b.r-a.r);
  const names=[];for(let i=0;i<count;i++){if(pool.length)names.push(pool[Math.floor(Math.random()*Math.min(4,pool.length))])}
  return names;
}
function finishMatch(){
  $("loading").style.display="flex";$("loadingText").textContent="🤖 تجهيز تحليل المباراة والإحصائيات...";
  setTimeout(()=>{
    $("loading").style.display="none";const m=simulateMatch();showResult(m);
  },1800);
}
function showResult(m){
  $("resultOverlay").style.display="flex";
  $("rScore").textContent=m.g1+" - "+m.g2;
  const winner=m.g1>m.g2?"🏆 فوز فريقك":m.g2>m.g1?"🤖 فوز AI":"🤝 تعادل";
  $("rWinner").textContent=winner;
  $("rWinner").className=m.g1>m.g2?"winner":m.g2>m.g1?"loser":"";
  const rows=[
    ["الاستحواذ",m.poss1+"%",m.poss2+"%",m.poss1],
    ["التسديدات",m.shots1,m.shots2,clamp(m.shots1/(m.shots1+m.shots2)*100,0,100)],
    ["على المرمى",m.on1,m.on2,clamp(m.on1/(m.on1+m.on2)*100,0,100)],
    ["دقة التمرير",m.pass1+"%",m.pass2+"%",m.pass1],
    ["الركنيات",m.corners1,m.corners2,clamp(m.corners1/(m.corners1+m.corners2)*100,0,100)],
    ["الأخطاء",m.fouls1,m.fouls2,clamp(m.fouls1/(m.fouls1+m.fouls2)*100,0,100)]
  ];
  $("matchStats").innerHTML=rows.map(r=>`<div class="stat"><div class="stat-title"><span>${r[1]}</span><span>${r[0]}</span><span>${r[2]}</span></div><div class="bar"><i style="width:${r[3]}%"></i></div></div>`).join("");
  const scorers1=pickScorers(1,m.g1),scorers2=pickScorers(2,m.g2),events=[];
  scorers1.forEach(p=>events.push("🔵 ⚽ "+p.n+" — هدف لفريقك"));
  scorers2.forEach(p=>events.push("🔴 ⚽ "+p.n+" — هدف لـ AI"));
  if(!events.length)events.push("🧤 المباراة انتهت بدون أهداف.");
  events.push("📊 تقييم فريقك: "+Math.round(teamStrength(1))+" OVR");
  events.push("📊 تقييم AI: "+Math.round(teamStrength(2))+" OVR");
  $("events").innerHTML=events.map(x=>`<div class="event">${x}</div>`).join("");
}

$("plusBtn").onclick=increaseBid;$("minusBtn").onclick=decreaseBid;$("bidBtn").onclick=bid;$("takeBtn").onclick=take;
renderAll();startRound();
</script>
