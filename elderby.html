.pos-name{color:#ddd;font-size:6px}.player-name{color:#fff;font-size:7px}
.pos-GK{left:5.5%;top:50%}.pos-CB1{left:18%;top:30%}.pos-CB2{left:18%;top:70%}.pos-LB{left:18%;top:8%}.pos-RB{left:18%;top:92%}.pos-CM1{left:42%;top:30%}.pos-CM2{left:42%;top:70%}.pos-CAM{left:58%;top:50%}.pos-LW{left:78%;top:22%}.pos-ST{left:90%;top:50%}.pos-RW{left:78%;top:78%}

function readSelectedTeams(){
  const params = new URLSearchParams(window.location.search);
  const urlMy = params.get('myTeam');
  const urlAI = params.get('aiTeam');
  if(urlMy && urlAI) return [urlMy, urlAI];

  const pairs = [
    ['myTeam','aiTeam'], ['team1','team2'], ['team1Name','team2Name'],
    ['selectedTeam1','selectedTeam2'], ['selectedTeamA','selectedTeamB'],
    ['playerTeam','opponentTeam'], ['homeTeam','awayTeam']
  ];

  for(const [a,b] of pairs){
    const x = localStorage.getItem(a);
    const y = localStorage.getItem(b);
    if(x && y) return [x,y];
  }

  // دعم sessionStorage أيضاً
  for(const [a,b] of pairs){
    const x = sessionStorage.getItem(a);
    const y = sessionStorage.getItem(b);
    if(x && y) return [x,y];
  }

  return [null,null];
}

// تحويل اسم الفريق المختار في lobbyderby إلى مفتاح الفريق داخل playersDB
function normalizeTeamName(name){
  return String(name || "")
    .toLowerCase()
    .replace(/[^a-z0-9؀-ۿ]/g, "");
}

const teamAliases = {
  real: "RealMadrid",
  realmad: "RealMadrid",
  real madrid: "RealMadrid",
  realmadrid: "RealMadrid",
  mancity: "ManchesterCity",
  manchestercity: "ManchesterCity",
  manchester city: "ManchesterCity",
  bayern: "BayernMunich",
  bayernmunich: "BayernMunich",
  bayern munich: "BayernMunich",
  barca: "Barcelona",
  psg: "PSG",
  inter: "InterMilan",
  intermilan: "InterMilan",
  inter milan: "InterMilan",
  atletico: "AtleticoMadrid",
  atletico madrid: "AtleticoMadrid",
  bayer: "BayerLeverkusen",
  bayer leverkusen: "BayerLeverkusen",
  dortmund: "BorussiaDortmund",
  borussia dortmund: "BorussiaDortmund",
  ac milan: "ACMilan",
  milan: "ACMilan",
  juventus: "Juventus",
  tottenham: "Tottenham",
  alhilal: "AlHilal",
  al hilal: "AlHilal",
  alnassr: "AlNassr",
  al nassr: "AlNassr"
};

function getTeamKey(teamName){
  const normalized = normalizeTeamName(teamName);

  // لو الاسم المختار مطابق لاسم المفتاح مباشرة
  for(const key of Object.keys(playersDB)){
    if(normalizeTeamName(key) === normalized) return key;
  }

  // البحث في الأسماء المختصرة والمختلفة
  for(const [alias, key] of Object.entries(teamAliases)){
    if(normalizeTeamName(alias) === normalized) return key;
  }

  // مطابقة جزئية للأسماء
  for(const key of Object.keys(playersDB)){
    const normalizedKey = normalizeTeamName(key);
    if(normalizedKey.includes(normalized) || normalized.includes(normalizedKey)) return key;
  }

  console.warn("الفريق المختار غير موجود في playersDB:", teamName);
  return null;
}

function getPlayerForPos(teamName, pos){
  const key = getTeamKey(teamName);

  if(!key || !playersDB[key]){
    throw new Error("لا توجد قائمة لاعبين للفريق: " + teamName);
  }

  let posKey = pos;
  if(pos === "CB1") posKey = "CB1";
  if(pos === "CB2") posKey = "CB2";
  if(pos === "CM1") posKey = "CM1";
  if(pos === "CM2") posKey = "CM2";

  let teamPlayers = playersDB[key][posKey] || playersDB[key][pos];

  if(!teamPlayers || !teamPlayers.length){
    throw new Error("لا يوجد لاعبين للمركز " + pos + " في فريق " + teamName);
  }

  // منع تكرار نفس اللاعب داخل نفس المزاد قدر الإمكان
  let available = teamPlayers.filter(p => !usedPlayers.includes(key + "::" + p.n));
  if(available.length === 0) available = teamPlayers;

  let player = available[Math.floor(Math.random() * available.length)];
  usedPlayers.push(key + "::" + player.n);
  return player;
}

function newPlayer(){
  isAIThinking = false;
  let posName=positions[currentPosIndex];
  document.getElementById('pos').innerText="المركز: " + posName;

  // اللاعب في المزاد يأتي عشوائياً من واحد من الفريقين المختارين في lobbyderby
  const validTeams = auctionTeams.filter(team => getTeamKey(team));
  const sourceTeam = validTeams.length
    ? validTeams[Math.floor(Math.random() * validTeams.length)]
    : myTeamName;

  currentPlayer=getPlayerForPos(sourceTeam, posName);
  currentPlayer.sourceTeam = sourceTeam;
  currentBid=currentPlayer.p;
  userBid=currentBid+1000000;
  highestBidder=0;

  document.getElementById('pos').innerText="المركز: " + posName + " | من: " + sourceTeam;
  updateBidDisplay();show();
  if(turn==2) setTimeout(aiMove, 1200);
}

function updateBidDisplay(){
  document.getElementById('currentBidDisplay').innerText=userBid.toLocaleString()+"$";
}

function increaseBid(){
  let money=turn==1?m1:m2;
  if(userBid+1000000 > money){alert("مفيش فلوس كفاية");return}
  userBid+=1000000;updateBidDisplay();
}

function decreaseBid(){
  if(userBid-1000000 <= currentBid){alert("اقل حاجة "+(currentBid+1000000).toLocaleString());return}
  userBid-=1000000;updateBidDisplay();
}

function show(){
  document.getElementById('name').innerText=currentPlayer.n;
  document.getElementById('price').innerText="السعر الحالي: "+currentBid.toLocaleString()+"$";
  document.getElementById('bidBtn').disabled = turn==2;document.getElementById('takeBtn').disabled = turn==2;
  document.getElementById('plusBtn').disabled = turn==2;document.getElementById('minusBtn').disabled = turn==2;
}

function bid(){
  let money=turn==1?m1:m2;
  if(userBid<=currentBid){alert("لازم تعلي عن "+currentBid.toLocaleString());return}
  if(userBid>money){alert("مفيش فلوس معاك "+money.toLocaleString());return}
  currentBid=userBid; highestBidder=turn;
  document.getElementById('price').innerText="السعر الحالي: "+currentBid.toLocaleString()+"$";
  turn=turn==1?2:1;document.getElementById('turn').innerText="دور المزايدة: " + (turn==1?"انت":"AI");
  userBid=currentBid+1000000;updateBidDisplay();show();
  if(turn==2) setTimeout(aiMove, 1200);
}

function take(){
    if(highestBidder==0){alert("لازم حد يزايد الاول");return}
    doTake(highestBidder);
}

function doTake(winner){
  let loser = winner == 1? 2 : 1;
  let posName = positions[currentPosIndex];

  // الفايز ياخد اللاعب بفلوس
  if(winner==1){
    m1-=currentBid;
    t1[currentPosIndex]=currentPlayer;
    // الخسران ياخد لاعب مجاني من نفس المركز
    t2[currentPosIndex]=getPlayerForPos(aiTeamName, posName);
  } else {
    m2-=currentBid;
    t2[currentPosIndex]=currentPlayer;
    // الخسران ياخد لاعب مجاني من نفس المركز
    t1[currentPosIndex]=getPlayerForPos(myTeamName, posName);
  }
  update();nextPos();
}

function skip(){nextPos()}

function aiMove(){
  if(isAIThinking) return;isAIThinking = true;
  setTimeout(() => {
    if(m2 > currentBid + 1000000 && Math.random() > 0.3){
      let increase = 1000000 + Math.floor(Math.random()*3000000);
      if(currentPlayer.n.includes("⭐")) increase += 2000000; // AI يحب الاساطير
      let newBid = currentBid + increase;if(newBid > m2) newBid = m2;
      currentBid = newBid; highestBidder = 2;
      document.getElementById('price').innerText="السعر الحالي: "+currentBid.toLocaleString()+"$";
      turn = 1; document.getElementById('turn').innerText="دور المزايدة: انت";
      userBid=currentBid+1000000;updateBidDisplay();show();
    } else {
      document.getElementById('turn').innerText="🤖 AI: خده!";
      setTimeout(() => { doTake(1); }, 800);
    }
    isAIThinking = false;
  }, 1200);
}

function nextPos(){
  currentPosIndex++;
  if(currentPosIndex>=11){
    document.getElementById('loading').style.display = 'flex';
    setTimeout(aiEvaluate, 3500);return;
  }
  document.getElementById('count').innerText=(currentPosIndex+1)+" / 11";
  turn=1;document.getElementById('turn').innerText="دور المزايدة: انت";newPlayer();
}

function aiEvaluate(){
  let score1 = 0, score2 = 0, stars1=0, stars2=0;
  t1.forEach(p => { if(p){ score1 += p.p; if(p.n.includes("⭐")) {score1 += 10000000; stars1++;} } });
  t2.forEach(p => { if(p){ score2 += p.p; if(p.n.includes("⭐")) {score2 += 10000000; stars2++;} } });
  let winnerText = ""; let winnerColor = "#ffd700";
  if(score1 > score2) {winnerText = "🏆 الفائز: انت"; winnerColor="lime";}
  else if(score2 > score1) {winnerText = "🏆 الفائز: "+aiTeamName; winnerColor="#ff4444";}
  else {winnerText = "🤝 النتيجة: تعادل";}
  document.getElementById('aiText').innerText = "اكتمل التحليل";
  document.getElementById('resultBox').style.display = "block";
  document.getElementById('resultBox').innerHTML = `<div style="font-size:24px;font-weight:900;color:${winnerColor};margin-bottom:15px">${winnerText}</div><div style="display:flex;justify-content:space-between;margin:10px 0"><span>${myTeamName}:</span><span style="color:#00aaff;font-weight:700">${(score1/1000000).toFixed(1)} مليون | ${stars1} نجوم</span></div><div style="display:flex;justify-content:space-between;margin:10px 0"><span>${aiTeamName}:</span><span style="color:#ff4444;font-weight:700">${(score2/1000000).toFixed(1)} مليون | ${stars2} نجوم</span></div><button onclick="location.reload()" style="margin-top:20px;width:100%;background:#ffd700;color:#000">🔄 العب تاني</button>`;
}

  document.getElementById('m1').innerText=m1.toLocaleString();
