<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=340, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مزاد المليار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html, body{width:340px;margin:0 auto;background:#000;overflow-x:hidden;}
body{color:#fff;font-family:'Cairo',sans-serif;text-align:center;padding:8px;margin:0}
h1{color:gold;text-shadow:0 0 10px gold;margin:8px 0;font-size:18px}
.stats{display:flex;justify-content:space-between;align-items:center;background:#111;padding:6px 8px;border-radius:10px;margin:8px auto;border:2px solid gold;font-size:12px}
.p1{color:#00aaff;font-weight:900}
.p2{color:#ff4444;font-weight:900}
#count{background:gold;color:#000;padding:3px 8px;border-radius:10px;font-weight:900}
.turn{background:gold;color:#000;padding:5px;border-radius:6px;font-weight:900;margin:8px auto;font-size:12px}
.pitch{width:320px;height:190px;background:linear-gradient(#1a8a1a,#0d6e0d);border:2px solid #fff;border-radius:15px;position:relative;margin:10px auto}
.pitch::before{content:'';position:absolute;top:50%;left:0;width:100%;height:2px;background:#fff;opacity:0.3}
.pitch::after{content:'';position:absolute;top:50%;left:50%;width:60px;height:60px;border:2px solid #fff;opacity:0.3;border-radius:50%;transform:translate(-50%,-50%)}
.bench{width:320px;background:#111;border:2px solid #555;border-radius:10px;padding:6px;margin:8px auto}
.bench-title{background:gold;color:#000;padding:4px;font-weight:900;border-radius:6px;margin-bottom:5px;font-size:12px}
.bench-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.team-title{font-size:16px;font-weight:900;margin:4px 0;text-shadow:0 0 8px}
.title1{color:#00aaff}
.title2{color:#ff4444}
.card{border:2px solid gold;border-radius:12px;padding:10px;width:320px;margin:10px auto;background:#111}
.legend-tag{background:linear-gradient(45deg,gold,#ffaa00);color:#000;padding:2px 6px;border-radius:10px;font-size:9px;font-weight:900;margin:4px 0;display:inline-block}
.name{font-size:16px;color:gold;font-weight:900;margin:3px 0}
.price{font-size:13px;color:#0f0;font-weight:700;margin-bottom:5px}
input{width:100px;padding:6px;border-radius:5px;border:2px solid gold;background:#222;color:#fff;text-align:center;font-family:'Cairo';font-size:12px;margin:3px}
button{padding:6px 10px;margin:2px;border:none;border-radius:5px;font-weight:900;cursor:pointer;font-family:'Cairo';font-size:12px}
.bid{background:lime;color:#000}.take{background:red;color:#fff}.skip{background:#555;color:#fff}
button:disabled{opacity:0.4;cursor:not-allowed}

.player-circle{width:55px;height:35px;border-radius:8px;border:2px solid #fff;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7px;font-weight:900;position:absolute;color:#fff;padding:1px}
.player-circle.filled{border-color:gold;background:#111}
.player-circle b{font-size:8px;margin-bottom:1px;color:#0ff}
.player-circle.p-name{font-size:7px;opacity:0.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50px;color:gold}

.slot{border:2px solid #333;background:#000;padding:3px;border-radius:5px;font-size:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;min-height:35px;color:#fff}
.slot.filled{border-color:gold;background:#111}
.slot b{color:#0ff;font-size:8px;margin-bottom:1px}
.slot.p-name{font-size:8px;opacity:0.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px;color:gold}
</style>
</head>
<body>

<h1>🤖 مزاد المليار - 🤖</h1>
<div class="stats">
  <div class="p1">انت: <span id="m1">1,000,000,000</span>$</div>
  <div id="count">1 / 23</div>
  <div class="p2">AI: <span id="m2">1,000,000,000</span>$</div>
</div>
<div class="turn" id="turn">دورك</div>

<div class="team-title title1">فريقك</div>
<div class="pitch" id="pitch1">
  <div class="player-circle" id="p1-LB" style="top:12px;left:65px"><b>LB</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p1-CB1" style="top:55px;left:65px"><b>CB1</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p1-GK" style="top:75px;left:8px"><b>GK</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p1-CB2" style="top:105px;left:65px"><b>CB2</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p1-RB" style="top:145px;left:65px"><b>RB</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p1-CM1" style="top:38px;left:135px"><b>CM1</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p1-CM2" style="top:112px;left:135px"><b>CM2</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p1-CAM" style="top:75px;left:195px"><b>CAM</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p1-LW" style="top:20px;left:265px"><b>LW</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p1-ST" style="top:75px;left:295px"><b>ST</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p1-RW" style="top:130px;left:265px"><b>RW</b><div class="p-name">-</div></div>
</div>
<div class="bench">
  <div class="bench-title">الدكة 12 لاعب</div>
  <div class="bench-slots" id="bench1"></div>
</div>

<div class="team-title title2">فريق AI</div>
<div class="pitch" id="pitch2">
  <div class="player-circle" id="p2-LB" style="top:12px;left:65px"><b>LB</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p2-CB1" style="top:55px;left:65px"><b>CB1</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p2-GK" style="top:75px;left:8px"><b>GK</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p2-CB2" style="top:105px;left:65px"><b>CB2</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p2-RB" style="top:145px;left:65px"><b>RB</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p2-CM1" style="top:38px;left:135px"><b>CM1</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p2-CM2" style="top:112px;left:135px"><b>CM2</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p2-CAM" style="top:75px;left:195px"><b>CAM</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p2-LW" style="top:20px;left:265px"><b>LW</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p2-ST" style="top:75px;left:295px"><b>ST</b><div class="p-name">-</div></div>
  <div class="player-circle" id="p2-RW" style="top:130px;left:265px"><b>RW</b><div class="p-name">-</div></div>
</div>
<div class="bench">
  <div class="bench-title">دكة AI</div>
  <div class="bench-slots" id="bench2"></div>
</div>

<div class="card">
  <div id="legendBadge"></div>
  <div class="pos" id="pos" style="color:#aaa;font-size:12px">المركز</div>
  <div class="name" id="name">-</div>
  <div class="price" id="price">-</div>
  <input id="bidInput" type="number" placeholder="المزايدة"><br>
  <button class="bid" id="bidBtn" onclick="bid()">مزايدة</button>
  <button class="take" id="takeBtn" onclick="giveToAI()">خده</button>
  <button class="skip" onclick="skip()">تخطي</button>
</div>

<script>
const positions = ["GK","LB","CB1","CB2","RB","CM1","CM2","CAM","LW","ST","RW","GK2","LB2","CB3","CB4","RB2","CM3","CM4","CAM2","LW2","ST2","RW2","MF"];
const benchPositions = ["GK2","LB2","CB3","CB4","RB2","CM3","CM4","CAM2","LW2","ST2","RW2","MF"];

const LEGENDS = {
GK: [{n:"Buffon",p:20000000,legend:true},{n:"Casillas",p:19000000,legend:true}],
LB: [{n:"Roberto Carlos",p:45000000,legend:true},{n:"Maldini",p:48000000,legend:true}],
CB: [{n:"Nesta",p:50000000,legend:true},{n:"Cannavaro",p:49000000,legend:true}],
RB: [{n:"Cafu",p:46000000,legend:true},{n:"Dani Alves",p:46500000,legend:true}],
CM: [{n:"Zidane",p:60000000,legend:true},{n:"Pirlo",p:55000000,legend:true}],
CAM: [{n:"Ronaldinho",p:65000000,legend:true},{n:"Kaka",p:63000000,legend:true}],
LW: [{n:"Ronaldinho",p:65000000,legend:true},{n:"Figo",p:64000000,legend:true}],
ST: [{n:"Ronaldo",p:70000000,legend:true},{n:"Henry",p:68000000,legend:true}],
RW: [{n:"Beckham",p:65000000,legend:true},{n:"Figo",p:64000000,legend:true}]
};

const playersDB = {
GK: [{n:"Courtois",p:15000000},{n:"Alisson",p:14000000},{n:"Ter Stegen",p:13000000},...LEGENDS.GK],
LB: [{n:"Davies",p:35000000},{n:"Robertson",p:30000000},...LEGENDS.LB],
CB1: [{n:"Van Dijk",p:40000000},{n:"R.Dias",p:38000000},...LEGENDS.CB],
CB2: [{n:"Kim",p:38000000},{n:"Konate",p:30000000},...LEGENDS.CB],
RB: [{n:"Hakimi",p:40000000},{n:"TAA",p:38000000},...LEGENDS.RB],
CM1: [{n:"Rodri",p:45000000},{n:"Valverde",p:40000000},...LEGENDS.CM],
CM2: [{n:"Modric",p:30000000},{n:"Gundogan",p:25000000},...LEGENDS.CM],
CAM: [{n:"De Bruyne",p:50000000},{n:"Bellingham",p:55000000},...LEGENDS.CAM],
LW: [{n:"Vinicius",p:62000000},{n:"Leao",p:42000000},...LEGENDS.LW],
ST: [{n:"Haaland",p:60000000},{n:"Mbappe",p:65000000},...LEGENDS.ST],
RW: [{n:"Salah",p:50000000},{n:"Saka",p:45000000},...LEGENDS.RW],
GK2: [{n:"Neuer",p:12000000},{n:"Ederson",p:12500000},{n:"Donnarumma",p:14500000}],
LB2: [{n:"T.Hernandez",p:32000000},{n:"Cancelo",p:33000000},{n:"N.Mendes",p:29000000}],
CB3: [{n:"Rudiger",p:35000000},{n:"Saliba",p:37000000},{n:"Militao",p:33000000}],
CB4: [{n:"Araujo",p:36000000},{n:"Marquinhos",p:34000000},{n:"Gvardiol",p:42000000}],
RB2: [{n:"Walker",p:30000000},{n:"Reece James",p:35000000},{n:"Frimpong",p:27000000}],
CM3: [{n:"Kimmich",p:38000000},{n:"Odegaard",p:40000000},{n:"Casemiro",p:28000000}],
CM4: [{n:"Camavinga",p:38000000},{n:"Tchouameni",p:41000000},{n:"Barella",p:39000000}],
CAM2: [{n:"B.Fernandes",p:45000000},{n:"B.Silva",p:42000000},{n:"Wirtz",p:50000000}],
LW2: [{n:"Sane",p:38000000},{n:"Rashford",p:41000000},{n:"Coman",p:38000000}],
ST2: [{n:"Kane",p:55000000},{n:"Lautaro",p:50000000},{n:"Osimhen",p:58000000}],
RW2: [{n:"Rodrygo",p:32000000},{n:"Foden",p:48000000},{n:"Dembele",p:41000000}],
MF: [{n:"Rice",p:42000000},{n:"Enzo",p:35000000},{n:"Caicedo",p:28000000}]
};

let currentPosIndex=0, currentPlayer, currentBid=0, highestBidder=0;
let turn=1, m1=1000000000, m2=1000000000;
let t1={}, t2={};
let aiThinking = false;

benchPositions.forEach(pos=>{
  document.getElementById('bench1').innerHTML += `<div class="slot" id="b1-${pos}"><b>${pos}</b><div class="p-name">-</div></div>`;
  document.getElementById('bench2').innerHTML += `<div class="slot" id="b2-${pos}"><b>${pos}</b><div class="p-name">-</div></div>`;
})

newPlayer();

function getRandomPlayer(pos){
  let arr = playersDB[pos];
  return arr[Math.floor(Math.random()*arr.length)];
}

function newPlayer(){
  if(currentPosIndex>=23){alert("خلص المزاد");return;}
  let pos=positions[currentPosIndex];
  currentPlayer=getRandomPlayer(pos);
  currentBid=currentPlayer.p;
  highestBidder=0;
  turn=1;
  show();
  currentPosIndex++;
}

function show(){
  document.getElementById('pos').innerText="المركز: " + positions[currentPosIndex-1];
  document.getElementById('name').innerText=currentPlayer.n;
  document.getElementById('price').innerText="السعر: "+currentBid.toLocaleString()+"$";
  document.getElementById('bidInput').value=currentBid+10000000;
  document.getElementById('m1').innerText=m1.toLocaleString();
  document.getElementById('m2').innerText=m2.toLocaleString();
  document.getElementById('count').innerText=currentPosIndex+" / 23";
  document.getElementById('turn').innerText = turn==1? "دورك" : "AI بيفكر...";
  document.getElementById('bidBtn').disabled = turn!=1;
  document.getElementById('legendBadge').innerHTML = currentPlayer.legend? '<div class="legend-tag">⭐ اسطورة ⭐</div>' : '';
  if(turn==2 &&!aiThinking){ aiThinking=true; setTimeout(aiTurn, 900); }
}

function aiTurn(){
  let aiMoney = m2;
  if(Math.random() < 0.4 && aiMoney > currentBid*1.2){
    let aiBid = currentBid + 10000000 + Math.floor(Math.random()*30000000);
    if(aiBid <= aiMoney){ currentBid = aiBid; highestBidder = 2; turn = 1; show(); aiThinking=false; return; }
  }
  if(highestBidder==2){ takeAI(); } else { turn=1; show(); aiThinking=false; }
}

function bid(){ if(turn!=1) return; let val=parseInt(document.getElementById('bidInput').value); if(val<=currentBid || val>m1) return alert("مزايدة غلط"); currentBid=val; highestBidder=1; turn=2; show(); }

function giveToAI(){
  let pos=positions[currentPosIndex-1];
  m2-=currentBid; t2[pos]=currentPlayer; highestBidder=2;
  let myPlayer = getRandomPlayer(pos);
  t1[pos] = myPlayer; m1 -= myPlayer.p;
  updateTeams(); newPlayer();
}

function takeAI(){ let pos=positions[currentPosIndex-1]; m2-=currentBid; t2[pos]=currentPlayer; updateTeams(); newPlayer(); }
function skip(){ if(turn!=1) return; turn=2; show(); }

function updateTeams(){
  for(let pos in t1){
    let el = benchPositions.includes(pos)? `b1-${pos}` : `p1-${pos}`;
    if(document.getElementById(el)){
      document.getElementById(el).querySelector('.p-name').innerText = t1[pos].n;
      document.getElementById(el).classList.add('filled');
    }
  }
  for(let pos in t2){
    let el = benchPositions.includes(pos)? `b2-${pos}` : `p2-${pos}`;
    if(document.getElementById(el)){
      document.getElementById(el).querySelector('.p-name').innerText = t2[pos].n;
      document.getElementById(el).classList.add('filled');
    }
  }
}
</script>
</body>
</html>
