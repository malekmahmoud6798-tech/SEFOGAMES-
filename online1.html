/* =====================================================
GENERAL
===================================================== */

*{

}

body{
    margin:0;
    min-height:100vh;
    font-family:'Cairo',sans-serif;
    color:#fff;
    text-align:center;
    overflow-x:hidden;

    background:

}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.15;

    background-image:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);

    background-size:35px 35px;
}

h1{
    margin:0;
    padding:18px 10px 8px;

    font-size:clamp(22px,5vw,40px);

    font-family:'Orbitron','Cairo',sans-serif;

    background:
    linear-gradient(
        90deg,
        #fff,
        #ffd700,
        #fff,
        #ffd700

    background-size:300%;

    -webkit-background-clip:text;
    color:transparent;

    animation:titleMove 5s linear infinite;
}

@keyframes titleMove{

    0%{
        background-position:0%;
    }

    100%{
        background-position:300%;
    }

}

.app{
    width:min(1450px,96%);
    margin:auto;
}

/* =====================================================
STATS
===================================================== */

.stats{

    display:grid;

    grid-template-columns:
    1fr
    auto
    1fr;

    gap:10px;

    align-items:center;

    margin:15px auto;

    padding:12px;

    border-radius:18px;

    border:1px solid rgba(255,215,0,.35);

    background:
    linear-gradient(
        135deg,
        rgba(20,25,24,.95),
        rgba(5,8,7,.95)
    );

    box-shadow:
    0 15px 50px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.08);
}

.money-box{

    padding:12px;

    border-radius:14px;

    font-size:15px;

    font-weight:900;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.08);
}

.money-box.blue{

    color:#56c7ff;

}

.money-box.red{

    color:#ff7474;

}

.money-value{

    display:block;

    margin-top:4px;

    color:#fff;

    font-family:'Orbitron';

    font-size:18px;
}

#count{

    padding:10px 15px;

    border-radius:50px;

    color:#111;

    font-family:'Orbitron';

    font-weight:900;

    background:
    linear-gradient(
        135deg,
        #fff7b0,
        #ffd700,
        #c98700
    );
}

/* =====================================================
TURN
===================================================== */

.turn{

    margin:10px auto 18px;

    width:min(600px,95%);

    padding:12px 18px;

    border-radius:14px;

    font-weight:900;

    background:
    linear-gradient(
        135deg,
        #17231f,
        #0a0f0d
    );

    border:1px solid rgba(255,215,0,.4);
}

/* =====================================================
FIELDS
===================================================== */

.field-container{

    display:grid;

    grid-template-columns:
    repeat(2,minmax(300px,1fr));

    gap:25px;

    margin:25px auto;

    align-items:start;
}

.team-wrap{

    border-radius:20px;

    overflow:hidden;

    background:#07100c;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 20px 50px rgba(0,0,0,.4);
}

.team-title{

    padding:13px;

    font-size:18px;

    font-weight:900;
}

.team-title.blue{

    background:
    linear-gradient(
        90deg,
        #0077aa,
        #00aaff,
        #006699
    );
}

.team-title.red{

    background:
    linear-gradient(
        90deg,
        #a40000,
        #ff3333,
        #990000
    );
}

.pitch{

    width:100%;

    aspect-ratio:7/9;

    position:relative;

    overflow:hidden;

    background:

    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.025) 0,
        rgba(255,255,255,.025) 10%,
        transparent 10%,
        transparent 20%
    ),

    linear-gradient(
        180deg,
        #168b49,
        #0b542d
    );
}

.pitch::before{

    content:"";

    position:absolute;

    top:45%;

    left:0;

    width:100%;

    height:2px;

    background:rgba(255,255,255,.7);
}

.pitch::after{

    content:"";

    position:absolute;

    top:45%;

    left:50%;

    width:100px;

    height:100px;

    border:2px solid rgba(255,255,255,.7);

    border-radius:50%;

    transform:translate(-50%,-50%);
}

.penalty{

    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:60%;

    height:22%;

    border:
    2px solid rgba(255,255,255,.8);

    border-bottom:none;
}

.goal{

    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:28%;

    height:7%;

    border:
    2px solid rgba(255,255,255,.9);

    border-bottom:none;
}

/* =====================================================
PLAYER ON FIELD
===================================================== */

.player-spot{

    position:absolute;

    width:82px;

    transform:translate(-50%,-50%);

    text-align:center;

    z-index:5;
}

.pos-label{

    position:absolute;

    top:-12px;

    left:50%;

    transform:translateX(-50%);

    padding:2px 6px;

    border-radius:8px;

    background:rgba(0,0,0,.7);

    font-size:9px;

    font-family:'Orbitron';

    z-index:10;
}

.mini-card{

    width:64px;

    height:76px;

    margin:auto;

    position:relative;

    overflow:hidden;

    border-radius:10px;

    display:flex;

    flex-direction:column;

    justify-content:flex-end;

    padding:5px;

    border:2px solid #777;

    box-shadow:
    0 8px 15px rgba(0,0,0,.4);

    transition:.3s;
}

.mini-card:hover{

    transform:
    translateY(-5px)
    scale(1.08);
}

.mini-card::before{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.2),
        transparent 45%
    );
}

.mini-card.empty{

    opacity:.3;

    filter:grayscale(1);

    background:#222;

    border-style:dashed;
}

.mini-rating{

    position:absolute;

    top:5px;

    right:6px;

    font-family:'Orbitron';

    font-size:12px;

    font-weight:900;
}

.mini-pos{

    position:absolute;

    top:20px;

    right:6px;

    font-size:8px;

    font-weight:900;
}

.mini-name{

    position:relative;

    z-index:2;

    font-size:8px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

CARD — REFERENCE DESIGN

/* =====================================================

let audioContext=null;

function playMoneySound(){

try{

if(!audioContext){

audioContext=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

const now=
audioContext.currentTime;

const oscillator=
audioContext.createOscillator();

const gain=
audioContext.createGain();

oscillator.type="sine";

oscillator.frequency.setValueAtTime(
520,
now
);

oscillator.frequency.exponentialRampToValueAtTime(
180,
now+.25
);

gain.gain.setValueAtTime(
.001,
now
);

gain.gain.exponentialRampToValueAtTime(
.35,
now+.03
);

gain.gain.exponentialRampToValueAtTime(
.001,
now+.3
);

oscillator.connect(gain);

gain.connect(
audioContext.destination
);

oscillator.start(now);

oscillator.stop(
now+.32
);

}catch(e){}

}

/* =====================================================
BID
===================================================== */

function bid(){

const val=parseInt(document.getElementById('bidInput').value,10);
if(!Number.isFinite(val)){
 alert("اكتب رقم صحيح");
 return;
}

roomRef.transaction(data=>{
 if(!data || !data.currentPlayer) return;
 const liveTurn=data.turn||1;
 const liveBid=data.currentBid||0;
 const liveMoney=myPlayer===1 ? (data.m1??200000000) : (data.m2??200000000);
 if(liveTurn!==myPlayer){
   alert("مش دورك في المزايدة دلوقتي");
   return;
 }
 if(val<=liveBid){
   alert("لازم تزود عن السعر الحالي");
   return;
 }
 if(val>liveMoney){
   alert("مفيش فلوس كفاية");
   return;
 }
 data.currentBid=val;
 data.highestBidder=myPlayer;
 data.turn=myPlayer===1?2:1;
 return data;
},(error,committed)=>{
 if(!error && committed) playMoneySound();
});

}

TAKE
===================================================== */

function take(){

if(turn!=myPlayer)
return;

if(!currentPlayer)
return;

const pos=
positions[currentPosIndex];

const taker=
highestBidder||myPlayer;

const other=
taker==1?2:1;

const updates={};

if(taker==1){

if(currentBid>m1){

alert(
"اللاعب الأول معندوش فلوس كفاية"
);

return;

}

updates["m1"]=
m1-currentBid;

updates["t1/"+pos]=
currentPlayer;

updates["filled1/"+pos]=
true;

}else{

if(currentBid>m2){

alert(
"اللاعب الثاني معندوش فلوس كفاية"
);

return;

}

updates["m2"]=
m2-currentBid;

updates["t2/"+pos]=
currentPlayer;

updates["filled2/"+pos]=
true;

}


/* اللاعب الآخر */

const randomPlayer=
getRandomPlayer(pos);

removePlayerFromPool(
pos,
randomPlayer.n
);

if(other==1){

updates["t1/"+pos]=
randomPlayer;

updates["filled1/"+pos]=
true;

}else{

updates["t2/"+pos]=
randomPlayer;

updates["filled2/"+pos]=
true;

}


/* RESET */

updates.currentPlayer=null;

updates.currentBid=0;

updates.highestBidder=0;

updates.turn=1;

updates.usedPlayers=usedPlayers;

updates.availablePlayers=availablePlayers;

playMoneySound();

roomRef.update(updates);

}

}

/* =====================================================
MATCH RESULT GENERATOR
===================================================== */

function createMatchResult(){

/*
    بنحسب قوة كل فريق
*/

let power1=0;

let power2=0;

positions.forEach(pos=>{

power1+=
t1[pos]?.r||
80;

power2+=
t2[pos]?.r||
80;

});


/*
    فرق القوة
*/

const totalPower=
power1+power2;

let possession1=
Math.round(
50+
((power1-power2)/totalPower)*35+
(Math.random()*6-3)
);

possession1=
Math.max(
35,
Math.min(
65,
possession1
)
);

const possession2=
100-possession1;


/*
    الأهداف
*/

const strengthDifference=
power1-power2;

let goals1=
Math.round(
2+
strengthDifference/40+
(Math.random()*3-1.5)
);

let goals2=
Math.round(
2-
strengthDifference/40+
(Math.random()*3-1.5)
);

goals1=
Math.max(
0,
Math.min(7,goals1)
);

goals2=
Math.max(
0,
Math.min(7,goals2)
);


/*
    تسديدات
*/

const shots1=
Math.max(
goals1+2,
Math.round(
8+
power1/14+
Math.random()*6
)
);

const shots2=
Math.max(
goals2+2,
Math.round(
8+
power2/14+
Math.random()*6
)
);

const onTarget1=
Math.min(
shots1,
Math.max(
goals1,
Math.round(shots1*(.35+Math.random()*.25))
)
);

const onTarget2=
Math.min(
shots2,
Math.max(
goals2,
Math.round(shots2*(.35+Math.random()*.25))
)
);


/*
    ركنيات
*/

const corners1=
Math.max(
1,
Math.round(
2+
possession1/15+
Math.random()*3
)
);

const corners2=
Math.max(
1,
Math.round(
2+
possession2/15+
Math.random()*3
)
);


/*
    بطاقات
*/

const yellow1=
Math.floor(Math.random()*4);

const yellow2=
Math.floor(Math.random()*4);

const red1=
Math.random()<.12?1:0;

const red2=
Math.random()<.12?1:0;


/*
    أخطاء
*/

const fouls1=
Math.round(
7+Math.random()*9
);

const fouls2=
Math.round(
7+Math.random()*9
);


/*
    التمريرات
*/

const passes1=
Math.round(
280+
power1*1.8+
Math.random()*100
);

const passes2=
Math.round(
280+
power2*1.8+
Math.random()*100
);


/*
    رجل المباراة
*/

let manTeam;

if(goals1>goals2){

manTeam=1;

}else if(goals2>goals1){

manTeam=2;

}else{

manTeam=
power1>=power2?1:2;

}

const manPlayers=
manTeam===1?t1:t2;

let manPlayer=null;

positions.forEach(pos=>{

const p=manPlayers[pos];

if(!p)
return;

if(
!manPlayer||
(p.r||0)>(manPlayer.r||0)
){

manPlayer=p;

}

});


/*
    تحديد الفائز
*/

let winner=0;

if(goals1>goals2){

winner=1;

}else if(goals2>goals1){

winner=2;

}


/*
    البيانات كلها في Firebase
*/

const matchResult={

goals1,
goals2,

possession1,
possession2,

shots1,
shots2,

onTarget1,
onTarget2,

corners1,
corners2,

yellow1,
yellow2,

red1,
red2,

fouls1,
fouls2,

passes1,
passes2,

power1,
power2,

winner,

manPlayer:
manPlayer?
manPlayer.n:
"أفضل لاعب",

manTeam

};


roomRef.update({

matchResult:matchResult,

currentPos:positions.length

});

}

function createFormationHTML(team){

let html="";

positions.forEach(pos=>{

const p=team[pos];

if(!p)
return;

html+=`

<div class="formation-player">

<strong>
${pos}
</strong>

<br>

${p.n}

<br>

<span style="color:#ffd700">
${p.r}
</span>

</div>

`;

});

return html;

}


/* =====================================================
FINAL SOUND
===================================================== */

function playFinalSound(){

try{

if(!audioContext){

audioContext=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

const now=
audioContext.currentTime;

const notes=[
523.25,
659.25,
783.99,
1046.50
];

notes.forEach(
(freq,i)=>{

const osc=
audioContext.createOscillator();

const gain=
audioContext.createGain();

osc.type="triangle";

osc.frequency.value=freq;

gain.gain.setValueAtTime(
.001,
now+i*.13
);

gain.gain.exponentialRampToValueAtTime(
.25,
now+i*.13+.04
);

gain.gain.exponentialRampToValueAtTime(
.001,
now+i*.13+.3
);

osc.connect(gain);

gain.connect(
audioContext.destination
);

osc.start(
now+i*.13
);

osc.stop(
now+i*.13+.32
);

});

}catch(e){}

}
