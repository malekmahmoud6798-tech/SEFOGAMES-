<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>مزاد النجوم - Ultimate</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>

/* =====================================================
GENERAL
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    font-family:'Cairo',sans-serif;
    color:#fff;
    text-align:center;
    overflow-x:hidden;

    background:
    radial-gradient(circle at 50% -10%,#1d513e 0%,#0a1913 30%,#020504 75%);
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.13;

    background-image:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);

    background-size:35px 35px;

    z-index:-1;
}

h1{
    margin:0;
    padding:20px 10px 8px;

    font-size:clamp(22px,5vw,40px);

    font-family:'Orbitron','Cairo',sans-serif;

    background:
    linear-gradient(
        90deg,
        #fff,
        #ffd700,
        #fff,
        #ffd700,
        #fff
    );

    background-size:400%;

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    animation:titleMove 5s linear infinite;

    text-shadow:0 0 30px rgba(255,215,0,.12);
}

@keyframes titleMove{

    0%{
        background-position:0%;
    }

    100%{
        background-position:400%;
    }

}

.app{
    width:min(1450px,96%);
    margin:auto;
}

/* =====================================================
STATS
===================================================== */

.stats{

    display:grid;

    grid-template-columns:
    1fr
    auto
    1fr;

    gap:10px;

    align-items:center;

    margin:15px auto;

    padding:12px;

    border-radius:20px;

    border:1px solid rgba(255,215,0,.35);

    background:
    linear-gradient(
        135deg,
        rgba(20,25,24,.97),
        rgba(5,8,7,.97)
    );

    box-shadow:
    0 15px 50px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.08);
}

.money-box{

    padding:12px;

    border-radius:15px;

    font-size:15px;

    font-weight:900;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.08);

    transition:.3s;
}

.money-box:hover{
    background:rgba(255,255,255,.07);
}

.money-box.blue{
    color:#56c7ff;
}

.money-box.red{
    color:#ff7474;
}

.money-value{

    display:block;

    margin-top:4px;

    color:#fff;

    font-family:'Orbitron';

    font-size:18px;
}

#count{

    padding:10px 17px;

    border-radius:50px;

    color:#111;

    font-family:'Orbitron';

    font-weight:900;

    background:
    linear-gradient(
        135deg,
        #fff7b0,
        #ffd700,
        #c98700
    );

    box-shadow:
    0 0 20px rgba(255,215,0,.25);
}

/* =====================================================
TURN
===================================================== */

.turn{

    margin:10px auto 18px;

    width:min(600px,95%);

    padding:13px 18px;

    border-radius:15px;

    font-weight:900;

    background:
    linear-gradient(
        135deg,
        #17231f,
        #0a0f0d
    );

    border:1px solid rgba(255,215,0,.4);

    box-shadow:
    0 10px 30px rgba(0,0,0,.25);
}

/* =====================================================
FIELDS
===================================================== */

.field-container{

    display:grid;

    grid-template-columns:
    repeat(2,minmax(300px,1fr));

    gap:25px;

    margin:25px auto;

    align-items:start;
}

.team-wrap{

    border-radius:22px;

    overflow:hidden;

    background:#07100c;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 20px 50px rgba(0,0,0,.4);
}

.team-title{

    padding:13px;

    font-size:18px;

    font-weight:900;
}

.team-title.blue{

    background:
    linear-gradient(
        90deg,
        #0077aa,
        #00aaff,
        #006699
    );
}

.team-title.red{

    background:
    linear-gradient(
        90deg,
        #a40000,
        #ff3333,
        #990000
    );
}

.pitch{

    width:100%;

    aspect-ratio:7/9;

    position:relative;

    overflow:hidden;

    background:

    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.025) 0,
        rgba(255,255,255,.025) 10%,
        transparent 10%,
        transparent 20%
    ),

    linear-gradient(
        180deg,
        #168b49,
        #0b542d
    );
}

.pitch::before{

    content:"";

    position:absolute;

    top:45%;

    left:0;

    width:100%;

    height:2px;

    background:rgba(255,255,255,.7);
}

.pitch::after{

    content:"";

    position:absolute;

    top:45%;

    left:50%;

    width:100px;

    height:100px;

    border:2px solid rgba(255,255,255,.7);

    border-radius:50%;

    transform:translate(-50%,-50%);
}

.penalty{

    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:60%;

    height:22%;

    border:
    2px solid rgba(255,255,255,.8);

    border-bottom:none;
}

.goal{

    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:28%;

    height:7%;

    border:
    2px solid rgba(255,255,255,.9);

    border-bottom:none;
}

/* =====================================================
PLAYER ON FIELD
===================================================== */

.player-spot{

    position:absolute;

    width:86px;

    transform:translate(-50%,-50%);

    text-align:center;

    z-index:5;
}

.pos-label{

    position:absolute;

    top:-12px;

    left:50%;

    transform:translateX(-50%);

    padding:2px 6px;

    border-radius:8px;

    background:rgba(0,0,0,.78);

    font-size:8px;

    font-family:'Orbitron';

    z-index:10;
}

/* =====================================================
MINI FIFA CARD
===================================================== */

.mini-card{

    width:68px;

    height:82px;

    margin:auto;

    position:relative;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    justify-content:flex-end;

    padding:4px;

    border-radius:11px;

    border:2px solid #d6b13b;

    background:
    linear-gradient(
        145deg,
        #fff4a0,
        #d59e00 55%,
        #6d4700
    );

    box-shadow:
    0 8px 15px rgba(0,0,0,.5),
    0 0 10px rgba(255,215,0,.18);

    transition:.25s;
}

.mini-card:hover{

    transform:
    translateY(-5px)
    scale(1.08);

    z-index:20;
}

.mini-card::before{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.35),
        transparent 35%,
        transparent 70%,
        rgba(0,0,0,.25)
    );

    z-index:3;

    pointer-events:none;
}

.mini-photo{

    position:absolute;

    left:5px;

    right:5px;

    top:13px;

    height:53px;

    z-index:1;

    display:flex;

    align-items:flex-start;

    justify-content:center;
}

.mini-photo img{

    width:100%;

    height:100%;

    object-fit:cover;

    object-position:center top;

    border-radius:7px;

    filter:saturate(1.05)
           contrast(1.04);

    mask-image:
    linear-gradient(
        to bottom,
        #000 65%,
        transparent 100%
    );
}

.mini-rating{

    position:absolute;

    top:4px;

    left:5px;

    font-family:'Orbitron';

    font-size:11px;

    font-weight:900;

    z-index:5;
}

.mini-pos{

    position:absolute;

    top:18px;

    left:6px;

    font-size:7px;

    font-weight:900;

    z-index:5;
}

.mini-name{

    position:relative;

    z-index:5;

    font-size:7px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    color:#120d00;

    text-shadow:0 1px rgba(255,255,255,.35);
}

.mini-card.empty{

    opacity:.35;

    filter:grayscale(1);

    background:#222;

    border:2px dashed #777;
}

/* ICON MINI */

.mini-card.card-icon{

    background:
    radial-gradient(circle at 50% 30%, #fff7d6 0%, #d4af37 50%, #102138 100%);

    border-color:#ffd700;

    box-shadow:0 0 10px rgba(0, 162, 255, 0.5);
}

.mini-card.card-icon .mini-name{
    color:#fff;
    text-shadow:0 1px 2px #000;
}

/* GOAT MINI */

.mini-card.card-goat{

    background:
    radial-gradient(
        circle at 50% 10%,
        #fff,
        #ffd700 25%,
        #7500d9 65%,
        #13001e
    );

    color:#fff;

    border-color:#fff;

    box-shadow:
    0 0 15px rgba(255,215,0,.7),
    0 0 25px rgba(122,0,255,.45);
}

.mini-card.card-goat .mini-name{
    color:#fff;
}

/* =====================================================
MAIN FIFA STYLE CARD (UPDATED TO MATCH IMAGE)
===================================================== */

.card-area{

    display:flex;

    justify-content:center;

    align-items:center;

    margin:30px auto 40px;

    perspective:1200px;
}

.player-card{

    width:min(390px,94vw);

    min-height:580px;

    position:relative;

    overflow:hidden;

    padding:20px 22px 18px;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    isolation:isolate;

    border-radius:35px;

    animation:cardEnter .7s cubic-bezier(.2,.8,.2,1);

    box-shadow:0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.3);

    clip-path:
    polygon(
        7% 0,
        93% 0,
        100% 6%,
        97% 94%,
        90% 100%,
        10% 100%,
        3% 94%,
        0 6%
    );
}

@keyframes cardEnter{

    0%{

        opacity:0;

        transform:
        scale(.72)
        rotateY(35deg)
        translateY(30px);

    }

    100%{

        opacity:1;

        transform:
        scale(1)
        rotateY(0)
        translateY(0);

    }

}

/* CARD BORDER & CRYSTALS */

.player-card::before{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.9),
        rgba(255,215,0,.85),
        rgba(255,255,255,.35),
        rgba(255,215,0,.9)
    );

    z-index:-2;
}

.player-card::after{

    content:"";

    position:absolute;

    inset:5px;

    background:
    linear-gradient(
        145deg,
        rgba(0,0,0,.05),
        rgba(0,0,0,.3)
    );

    clip-path:
    polygon(
        7% 0,
        93% 0,
        100% 6%,
        97% 94%,
        90% 100%,
        10% 100%,
        3% 94%,
        0 6%
    );

    z-index:-1;

    pointer-events:none;
}

/* GOLD CARD DESIGN */

.card-gold{

    background:
    radial-gradient(
        ellipse at 50% 20%,
        #fff6a8 0%,
        #e6b62c 35%,
        #a66d00 70%,
        #513000 100%
    );

    color:#181000;

    box-shadow:
    0 0 35px rgba(255,215,0,.35),
    0 30px 70px rgba(0,0,0,.6);
}

/* ICON / LEGEND CARD DESIGN (مستوحى تماماً من الصورة) */

.card-icon{

    background: 
        radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.4) 0%, transparent 60%),
        linear-gradient(135deg, #102138 0%, #060b12 100%),
        radial-gradient(ellipse at 50% 10%, #fff7d6 0%, #d4af37 40%, #5a400c 80%);

    color:#fff;

    border: 3px solid #f3e5ab;

    box-shadow: 0 0 30px rgba(0, 162, 255, 0.4), 0 0 60px rgba(212, 175, 55, 0.5);
}

.card-icon::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 2px solid rgba(255, 215, 0, 0.8);
    border-radius: 28px;
    pointer-events: none;
    z-index: 2;
    box-shadow: 
        inset 0 0 15px rgba(0, 195, 255, 0.6),
        inset 0 0 30px rgba(255, 215, 0, 0.4);
}

.card-icon::after {
    content: "";
    position: absolute;
    inset: 0;
    background: 
        radial-gradient(circle at 0% 50%, rgba(0, 140, 255, 0.5), transparent 40%),
        radial-gradient(circle at 100% 50%, rgba(0, 140, 255, 0.5), transparent 40%),
        radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.6), transparent 50%);
    z-index: 1;
    pointer-events: none;
}

/* GOAT CARD DESIGN */

.card-goat{

    background:
    radial-gradient(
        ellipse at 50% 10%,
        #ffffff 0%,
        #ffd700 22%,
        #b300ff 48%,
        #5500a8 68%,
        #090014 100%
    );

    color:#fff;

    box-shadow:
    0 0 25px #fff,
    0 0 50px #ffd700,
    0 0 90px #7a00ff,
    0 30px 80px rgba(0,0,0,.7);

    animation:
    cardEnter .7s cubic-bezier(.2,.8,.2,1),
    goatGlow 2s infinite alternate;
}

@keyframes goatGlow{

    from{

        box-shadow:
        0 0 20px #fff,
        0 0 45px #ffd700,
        0 0 70px #7a00ff,
        0 30px 80px rgba(0,0,0,.7);

    }

    to{

        box-shadow:
        0 0 35px #fff,
        0 0 70px #ffd700,
        0 0 110px #7a00ff,
        0 30px 80px rgba(0,0,0,.7);

    }

}

/* =====================================================
CARD DECORATION
===================================================== */

.card-pattern{

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:0;

    opacity:.25;

    background:

    linear-gradient(
        135deg,
        transparent 35%,
        rgba(255,255,255,.35) 35.5%,
        transparent 36%
    ),

    linear-gradient(
        45deg,
        transparent 55%,
        rgba(255,255,255,.18) 55.5%,
        transparent 56%
    );
}

.card-shine{

    position:absolute;

    width:180px;

    height:700px;

    top:-100px;

    right:-250px;

    transform:rotate(25deg);

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.45),
        transparent
    );

    animation:shine 4s infinite;

    pointer-events:none;

    z-index:4;
}

@keyframes shine{

    0%{
        right:-250px;
    }

    55%,100%{
        right:550px;
    }

}

/* =====================================================
CARD TOP
===================================================== */

.card-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    position:relative;

    z-index:6;
}

.rating-box{

    display:flex;

    flex-direction:column;

    align-items:center;
}

.rating{

    font-family:'Orbitron';

    font-size:58px;

    font-weight:900;

    line-height:.8;

    background: linear-gradient(180deg, #ffffff 0%, #ffd700 70%, #996515 100%);

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    text-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

.position{

    font-family:'Orbitron';

    font-size:14px;

    font-weight:900;

    color: #ffd700;

    letter-spacing: 2px;

    margin-top: 4px;
}

.card-type{

    max-width:170px;

    padding:8px 12px;

    border-radius:20px;

    font-size:10px;

    font-weight:900;

    background:rgba(0,0,0,.35);

    border:1px solid rgba(255,215,0,.6);

    backdrop-filter:blur(4px);
}

/* =====================================================
PLAYER PHOTO
===================================================== */

.player-photo{

    width:275px;

    height:295px;

    margin:-8px auto -5px;

    position:relative;

    z-index:3;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    overflow:hidden;
}

.player-photo::before{

    content:"";

    position:absolute;

    width:280px;

    height:280px;

    bottom:-60px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(255,255,255,.25),
        transparent 65%
    );

    filter:blur(5px);
}

.player-photo::after{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        to bottom,
        transparent 65%,
        rgba(0,0,0,.12) 100%
    );

    pointer-events:none;
}

.player-photo img{

    width:100%;

    height:100%;

    object-fit:cover;

    object-position:center top;

    border-radius:18px;

    filter:
    saturate(1.08)
    contrast(1.05)
    drop-shadow(0 18px 12px rgba(0,0,0,.4));

    mask-image:
    linear-gradient(
        to bottom,
        #000 75%,
        transparent 100%
    );
}

/* =====================================================
PLAYER NAME & SHAPE (مستوحى من شريط الاسم في الصورة)
===================================================== */

.player-name{

    position:relative;

    z-index:7;

    font-family:'Orbitron','Cairo';

    font-size:22px;

    font-weight:900;

    text-align:center;

    margin:5px auto 0;

    padding:8px 20px;

    width:90%;

    color:#fff;

    text-transform:uppercase;

    background:linear-gradient(180deg, #1b263b 0%, #0b111e 100%);

    border:2px solid #ffd700;

    border-radius:8px;

    box-shadow:0 5px 15px rgba(0,0,0,0.8), 0 0 10px rgba(255,215,0,0.5);

    text-shadow:0 2px 4px rgba(0,0,0,0.8);
}

.card-price{

    position:relative;

    z-index:7;

    text-align:center;

    margin-top:8px;

    padding:9px;

    border-radius:12px;

    font-family:'Orbitron';

    font-size:19px;

    font-weight:900;

    background:rgba(0,0,0,.35);

    border:1px solid rgba(255,215,0,.5);
}

/* =====================================================
FIFA STATS
===================================================== */

.card-stats{

    position:relative;

    z-index:7;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:6px;

    margin-top:9px;
}

.card-stat{

    padding:5px 2px;

    border-radius:8px;

    background:rgba(0,0,0,.4);

    border:1px solid rgba(255,215,0,.3);

    font-family:'Orbitron';

    font-size:10px;

    font-weight:900;

    color:#fff;
}

.card-stat span{

    display:block;

    font-size:7px;

    margin-bottom:2px;

    opacity:.85;

    color:#ffd700;
}

/* =====================================================
CONTROLS
===================================================== */

.controls{

    position:relative;

    z-index:5;

    width:min(450px,95%);

    margin:18px auto;

    padding:18px;

    border-radius:22px;

    background:
    linear-gradient(
        145deg,
        rgba(20,25,24,.96),
        rgba(4,6,5,.98)
    );

    border:1px solid rgba(255,215,0,.35);

    box-shadow:
    0 20px 60px rgba(0,0,0,.4);
}

#bidInput{

    width:100%;

    padding:14px;

    margin-bottom:10px;

    border-radius:12px;

    border:2px solid #d5aa19;

    outline:none;

    background:#080b0a;

    color:#fff;

    text-align:center;

    font-family:'Orbitron';

    font-size:16px;
}

#bidInput:focus{

    box-shadow:
    0 0 20px rgba(255,215,0,.2);
}

.buttons{

    display:grid;

    grid-template-columns:
    1fr 1fr 1fr;

    gap:8px;
}

button{

    padding:13px 8px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-family:'Cairo';

    font-weight:900;

    font-size:14px;

    transition:.2s;
}

button:hover:not(:disabled){

    transform:translateY(-3px);

    filter:brightness(1.12);
}

button:active:not(:disabled){

    transform:scale(.96);
}

button:disabled{

    opacity:.4;

    cursor:not-allowed;
}

.bid{

    background:
    linear-gradient(
        135deg,
        #50ff85,
        #00a43a
    );

    color:#001b09;
}

.take{

    background:
    linear-gradient(
        135deg,
        #ff5252,
        #a80000
    );

    color:#fff;
}

.skip{

    background:
    linear-gradient(
        135deg,
        #555,
        #222
    );

    color:#fff;
}

/* =====================================================
TIMER
===================================================== */

.timer{

    display:none;

    width:min(500px,92%);

    margin:20px auto;

    padding:20px;

    border-radius:20px;

    font-family:'Orbitron';

    font-size:22px;

    color:#ffd700;

    background:#090b0a;

    border:1px solid #d5aa19;

    box-shadow:
    0 0 30px rgba(255,215,0,.15);
}

/* =====================================================
MATCH RESULT
===================================================== */

.result{

    width:100%;
}

.match-result{

    width:min(1100px,96%);

    margin:35px auto 70px;

    padding:25px;

    border-radius:30px;

    background:

    radial-gradient(
        circle at 50% 0%,
        rgba(255,215,0,.14),
        transparent 40%
    ),

    linear-gradient(
        145deg,
        #101715,
        #030605
    );

    border:2px solid rgba(255,215,0,.45);

    box-shadow:
    0 30px 90px rgba(0,0,0,.65),
    0 0 50px rgba(255,215,0,.12);

===================================================== */

async function getRealPlayerImage(name){

if(imageCache[name])
return imageCache[name];

if(imageLoading[name])
return imageLoading[name];

const wikiName=
imageAliases[name]||name;

imageLoading[name]=
(async()=>{

try{

/*
    المحاولة الأولى:
    Wikipedia REST
*/

const url=
"https://en.wikipedia.org/api/rest_v1/page/summary/"+
encodeURIComponent(wikiName);

const response=
await fetch(
url,
{
cache:"force-cache"
}
);

if(response.ok){

const data=
await response.json();

const image=
data?.thumbnail?.source||
data?.originalimage?.source;

if(image){

imageCache[name]=image;

return image;

}

}


/*
    المحاولة الثانية:
    Wikipedia Search API
*/

const searchURL=
"https://en.wikipedia.org/w/api.php"+
"?action=query"+
"&generator=search"+
"&gsrsearch="+
encodeURIComponent(
wikiName+" footballer"
)+
"&gsrnamespace=0"+
"&prop=pageimages"+
"&piprop=thumbnail"+
"&pithumbsize=600"+
"&format=json"+
"&origin=*";

const searchResponse=
await fetch(
searchURL,
{
cache:"force-cache"
}
);

if(searchResponse.ok){

const searchData=
await searchResponse.json();

const pages=
Object.values(
searchData?.query?.pages||{}
);

for(const page of pages){

if(page.thumbnail?.source){

imageCache[name]=
page.thumbnail.source;

return page.thumbnail.source;

}

}

}

}catch(error){

console.warn(
"Image loading failed:",
name,
error
);

}

return getFallbackImg(name);

})();

const result=
await imageLoading[name];

delete imageLoading[name];

return result;

}

oscillator.type="sine";

oscillator.frequency.setValueAtTime(
520,
now
);

oscillator.frequency.exponentialRampToValueAtTime(
180,
now+.25
);

gain.gain.setValueAtTime(
.001,
now
);

gain.gain.exponentialRampToValueAtTime(
.35,
now+.03
);

gain.gain.exponentialRampToValueAtTime(
.001,
now+.3
);

oscillator.connect(gain);

gain.connect(
audioContext.destination
);

oscillator.start(now);

oscillator.stop(
now+.32
);

}catch(e){}

}

DEF:r,
PHY:r

};


/*
    توزيع تقريبي حسب المركز
*/

if(pos==="GK"){

stats={

PAC:clamp(r-8),
SHO:clamp(r-35),
PAS:clamp(r-3),
DRI:clamp(r-12),
DEF:clamp(r+1),
PHY:clamp(r-2)

};

}

else if(
pos==="LB"||
pos==="RB"
){

stats={

PAC:clamp(r+3),
SHO:clamp(r-5),
PAS:clamp(r+1),
DRI:clamp(r+2),
DEF:clamp(r+2),
PHY:clamp(r)

};

}

else if(
pos==="CB1"||
pos==="CB2"
){

stats={

PAC:clamp(r-2),
SHO:clamp(r-18),
PAS:clamp(r-1),
DRI:clamp(r-8),
DEF:clamp(r+3),
PHY:clamp(r+3)

};

}

else if(
pos==="CM1"||
pos==="CM2"
){

stats={

PAC:clamp(r),
SHO:clamp(r-1),
PAS:clamp(r+3),
DRI:clamp(r+2),
DEF:clamp(r-1),
PHY:clamp(r)

};

}

else if(pos==="CAM"){

stats={

PAC:clamp(r+1),
SHO:clamp(r+2),
PAS:clamp(r+3),
DRI:clamp(r+4),
DEF:clamp(r-15),
PHY:clamp(r-4)

};

}

else{

stats={

PAC:clamp(r+3),
SHO:clamp(r+4),
PAS:clamp(r),
DRI:clamp(r+3),
DEF:clamp(r-14),
PHY:clamp(r)

};

}

return stats;

}

/* =====================================================
LOAD
===================================================== */

async function loadData(data){

currentPosIndex=data.currentPos||0;

currentBid=data.currentBid||0;

highestBidder=data.highestBidder||0;

turn=data.turn||1;

m1=data.m1??200000000;

m2=data.m2??200000000;

t1=data.t1||{};

t2=data.t2||{};

currentPlayer=data.currentPlayer||null;

filled1=data.filled1||{};

filled2=data.filled2||{};

usedPlayers=data.usedPlayers||{};

availablePlayers=
data.availablePlayers||
JSON.parse(
JSON.stringify(playersDB)
);


/* =====================================================
MATCH RESULT
===================================================== */

if(data.matchResult){

showMatchResult(
data.matchResult
);

return;

}


/* =====================================================
END AUCTION
===================================================== */

if(currentPosIndex>=positions.length){

if(amIHost){

createMatchResult();

}

return;

}


const currentPos=
positions[currentPosIndex];

if(

filled1[currentPos]&&
filled2[currentPos]&&
!timerInterval&&
amIHost

){

startTimer();

return;

}

if(

!currentPlayer&&
!filled1[currentPos]&&
!filled2[currentPos]&&
amIHost

){

newPlayer();

}

updatePitch();

show();

}


/* =====================================================
TIMER
===================================================== */

function startTimer(){

document.querySelector('.controls').style.display='none';

document.getElementById('auctionCard').style.display='none';

const timer=
document.getElementById('timer');

timer.style.display='block';

let count=3;

timer.innerText=
`المركز القادم: ${positions[currentPosIndex+1]||'النهاية'} بعد ${count}`;

timerInterval=setInterval(()=>{

const next=
positions[currentPosIndex+1]||
'النهاية';

timer.innerText=
`المركز القادم: ${next} بعد ${count}`;

count--;

if(count<0){

clearInterval(timerInterval);

timerInterval=null;

timer.style.display='none';

document.querySelector('.controls').style.display='block';

document.getElementById('auctionCard').style.display='flex';

roomRef.update({

currentPos:
currentPosIndex+1

});

}

},1000);

}


/* =====================================================
RANDOM PLAYER
===================================================== */

function getRandomPlayer(pos){

if(

!availablePlayers[pos]||
availablePlayers[pos].length===0

){

availablePlayers[pos]=
JSON.parse(
JSON.stringify(playersDB[pos])
);

}

const data=
availablePlayers[pos];

return data[
Math.floor(
Math.random()*data.length
)
];

}


/* =====================================================
REMOVE PLAYER
===================================================== */

function removePlayerFromPool(
pos,
playerName
){

if(!availablePlayers[pos])
return;

availablePlayers[pos]=
availablePlayers[pos].filter(
p=>p.n!==playerName
);

usedPlayers[playerName]=true;

}


/* =====================================================
NEW PLAYER
===================================================== */

function newPlayer(){

const posName=
positions[currentPosIndex];

const player=
getRandomPlayer(posName);

removePlayerFromPool(
posName,
player.n
);

roomRef.update({

currentBid:player.p,

currentPlayer:player,

highestBidder:0,

turn:1,

usedPlayers,

availablePlayers

});

}

/* =====================================================
BID
===================================================== */

function bid(){

if(turn!=myPlayer)
return;

const val=
parseInt(
document.getElementById('bidInput').value
);

const money=
myPlayer==1?m1:m2;

if(isNaN(val)){

alert("اكتب رقم صحيح");

return;

}

if(val<=currentBid){

alert("لازم تزود عن السعر الحالي");

return;

}

if(val>money){

alert("مفيش فلوس كفاية");

return;

}

playMoneySound();

roomRef.update({

currentBid:val,

highestBidder:myPlayer,

turn:myPlayer==1?2:1

});

}


/* =====================================================
TAKE
===================================================== */

function take(){

if(turn!=myPlayer)
return;

if(!currentPlayer)
return;

const pos=
positions[currentPosIndex];

const taker=
highestBidder||myPlayer;

const other=
taker==1?2:1;

const updates={};

if(taker==1){

if(currentBid>m1){

alert(
"اللاعب الأول معندوش فلوس كفاية"
);

return;

}

updates["m1"]=
m1-currentBid;

updates["t1/"+pos]=
currentPlayer;

updates["filled1/"+pos]=
true;

}else{

if(currentBid>m2){

alert(
"اللاعب الثاني معندوش فلوس كفاية"
);

return;

}

updates["m2"]=
m2-currentBid;

updates["t2/"+pos]=
currentPlayer;

updates["filled2/"+pos]=
true;

}


/*
    اللاعب الآخر
*/

const randomPlayer=
getRandomPlayer(pos);

removePlayerFromPool(
pos,
randomPlayer.n
);

if(other==1){

updates["t1/"+pos]=
randomPlayer;

updates["filled1/"+pos]=
true;

}else{

updates["t2/"+pos]=
randomPlayer;

updates["filled2/"+pos]=
true;

}


/*
    RESET
*/

updates.currentPlayer=null;

updates.currentBid=0;

updates.highestBidder=0;

updates.turn=1;

updates.usedPlayers=usedPlayers;

updates.availablePlayers=availablePlayers;

playMoneySound();

roomRef.update(updates);

}


/* =====================================================
SKIP
===================================================== */

function skip(){

if(turn!=myPlayer)
return;

const pos=
positions[currentPosIndex];

const p1=
getRandomPlayer(pos);

removePlayerFromPool(
pos,
p1.n
);

const p2=
getRandomPlayer(pos);

removePlayerFromPool(
pos,
p2.n
);

const updates={};

updates["t1/"+pos]=p1;

updates["t2/"+pos]=p2;

updates["filled1/"+pos]=true;

updates["filled2/"+pos]=true;

updates.currentPlayer=null;

updates.currentBid=0;

updates.highestBidder=0;

updates.turn=1;

updates.usedPlayers=usedPlayers;

updates.availablePlayers=availablePlayers;

roomRef.update(updates);

}

/* =====================================================
MATCH RESULT GENERATOR
===================================================== */

function createMatchResult(){

let power1=0;

let power2=0;

positions.forEach(pos=>{

power1+=
t1[pos]?.r||
80;

power2+=
t2[pos]?.r||
80;

});

const totalPower=
power1+power2;

let possession1=
Math.round(
50+
((power1-power2)/totalPower)*35+
(Math.random()*6-3)
);

possession1=
Math.max(
35,
Math.min(
65,
possession1
)
);

const possession2=
100-possession1;

const strengthDifference=
power1-power2;

let goals1=
Math.round(
2+
strengthDifference/40+
(Math.random()*3-1.5)
);

let goals2=
Math.round(
2-
strengthDifference/40+
(Math.random()*3-1.5)
);

goals1=
Math.max(
0,
Math.min(7,goals1)
);

goals2=
Math.max(
0,
Math.min(7,goals2)
);

const shots1=
Math.max(
goals1+2,
Math.round(
8+
power1/14+
Math.random()*6
)
);

const shots2=
Math.max(
goals2+2,
Math.round(
8+
power2/14+
Math.random()*6
)
);

const onTarget1=
Math.min(
shots1,
Math.max(
goals1,
Math.round(
shots1*
(.35+Math.random()*.25)
)
)
);

const onTarget2=
Math.min(
shots2,
Math.max(
goals2,
Math.round(
shots2*
(.35+Math.random()*.25)
)
)
);

const corners1=
Math.max(
1,
Math.round(
2+
possession1/15+
Math.random()*3
)
);

const corners2=
Math.max(
1,
Math.round(
2+
possession2/15+
Math.random()*3
)
);

const yellow1=
Math.floor(Math.random()*4);

const yellow2=
Math.floor(Math.random()*4);

const red1=
Math.random()<.12?1:0;

const red2=
Math.random()<.12?1:0;

const fouls1=
Math.round(
7+Math.random()*9
);

const fouls2=
Math.round(
7+Math.random()*9
);

const passes1=
Math.round(
280+
power1*1.8+
Math.random()*100
);

const passes2=
Math.round(
280+
power2*1.8+
Math.random()*100
);

let manTeam;

if(goals1>goals2){

manTeam=1;

}else if(goals2>goals1){

manTeam=2;

}else{

manTeam=
power1>=power2?1:2;

}

const manPlayers=
manTeam===1?t1:t2;

let manPlayer=null;

positions.forEach(pos=>{

const p=manPlayers[pos];

if(!p)
return;

if(
!manPlayer||
(p.r||0)>(manPlayer.r||0)
){

manPlayer=p;

}

});

let winner=0;

if(goals1>goals2){

winner=1;

}else if(goals2>goals1){

winner=2;

}

const matchResult={

goals1,
goals2,

possession1,
possession2,

shots1,
shots2,

onTarget1,
onTarget2,

corners1,
corners2,

yellow1,
yellow2,

red1,
red2,

fouls1,
fouls2,

passes1,
passes2,

power1,
power2,

winner,

manPlayer:
manPlayer?
manPlayer.n:
"أفضل لاعب",

manTeam

};

roomRef.update({

matchResult:matchResult,

currentPos:positions.length

});

}
