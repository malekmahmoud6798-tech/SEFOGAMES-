<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>مزاد النجوم - ULTIMATE 200</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>

/* =====================================================
GENERAL
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    font-family:'Cairo',sans-serif;

    color:#fff;

    text-align:center;

    overflow-x:hidden;

    background:

    radial-gradient(
        circle at 50% -15%,
        #174d3a 0%,
        #0b2118 25%,
        #030807 65%,
        #010202 100%
    );
}

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.12;

    background-image:

    linear-gradient(
        rgba(255,255,255,.05) 1px,
        transparent 1px
    ),

    linear-gradient(
        90deg,
        rgba(255,255,255,.05) 1px,
        transparent 1px
    );

    background-size:35px 35px;

    z-index:-1;
}

body::after{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background:

    radial-gradient(
        circle at 20% 30%,
        rgba(0,195,255,.06),
        transparent 25%
    ),

    radial-gradient(
        circle at 80% 70%,
        rgba(255,0,170,.05),
        transparent 25%
    );

    z-index:-1;
}

h1{

    margin:0;

    padding:22px 10px 8px;

    font-size:clamp(22px,5vw,42px);

    font-family:'Orbitron','Cairo',sans-serif;

    background:

    linear-gradient(
        90deg,
        #fff,
        #ffd700,
        #fff,
        #6ee7ff,
        #ffd700,
        #fff
    );

    background-size:500%;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    animation:titleMove 6s linear infinite;

    text-shadow:
        0 0 30px rgba(255,215,0,.15);
}

@keyframes titleMove{

    0%{
        background-position:0%;
    }

    100%{
        background-position:500%;
    }
}

.app{

    width:min(1450px,96%);

    margin:auto;
}

/* =====================================================
STATS
===================================================== */

.stats{

    display:grid;

    grid-template-columns:
    1fr
    auto
    1fr;

    gap:10px;

    align-items:center;

    margin:15px auto;

    padding:12px;

    border-radius:22px;

    border:1px solid rgba(255,215,0,.35);

    background:

    linear-gradient(
        135deg,
        rgba(20,28,25,.97),
        rgba(3,7,5,.98)
    );

    box-shadow:

    0 15px 50px rgba(0,0,0,.5),

    inset 0 1px rgba(255,255,255,.08);
}

.money-box{

    padding:12px;

    border-radius:15px;

    font-size:15px;

    font-weight:900;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.08);

    transition:.3s;
}

.money-box:hover{

    background:rgba(255,255,255,.08);

    transform:translateY(-2px);
}

.money-box.blue{
    color:#56c7ff;
}

.money-box.red{
    color:#ff7474;
}

.money-value{

    display:block;

    margin-top:4px;

    color:#fff;

    font-family:'Orbitron';

    font-size:18px;
}

#count{

    padding:10px 17px;

    border-radius:50px;

    color:#111;

    font-family:'Orbitron';

    font-weight:900;

    background:

    linear-gradient(
        135deg,
        #fff7b0,
        #ffd700,
        #c98700
    );

    box-shadow:

    0 0 20px rgba(255,215,0,.35),

    inset 0 1px rgba(255,255,255,.8);
}

/* =====================================================
TURN
===================================================== */

.turn{

    margin:10px auto 18px;

    width:min(650px,95%);

    padding:13px 18px;

    border-radius:15px;

    font-weight:900;

    background:

    linear-gradient(
        135deg,
        #17231f,
        #070b09
    );

    border:1px solid rgba(255,215,0,.4);

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}

/* =====================================================
FIELDS
===================================================== */

.field-container{

    display:grid;

    grid-template-columns:
    repeat(2,minmax(300px,1fr));

    gap:25px;

    margin:25px auto;

    align-items:start;
}

.team-wrap{

    border-radius:24px;

    overflow:hidden;

    background:#07100c;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:

    0 20px 50px rgba(0,0,0,.45);
}

.team-title{

    padding:13px;

    font-size:18px;

    font-weight:900;
}

.team-title.blue{

    background:

    linear-gradient(
        90deg,
        #005f8a,
        #00bfff,
        #006699
    );
}

.team-title.red{

    background:

    linear-gradient(
        90deg,
        #870000,
        #ff3030,
        #990000
    );
}

.pitch{

    width:100%;

    aspect-ratio:7/9;

    position:relative;

    overflow:hidden;

    background:

    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.025) 0,
        rgba(255,255,255,.025) 10%,
        transparent 10%,
        transparent 20%
    ),

    linear-gradient(
        180deg,
        #168b49,
        #0b542d
    );
}

.pitch::before{

    content:"";

    position:absolute;

    top:45%;

    left:0;

    width:100%;

    height:2px;

    background:rgba(255,255,255,.7);
}

.pitch::after{

    content:"";

    position:absolute;

    top:45%;

    left:50%;

    width:100px;

    height:100px;

    border:2px solid rgba(255,255,255,.7);

    border-radius:50%;

    transform:translate(-50%,-50%);
}

.penalty{

    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:60%;

    height:22%;

    border:
    2px solid rgba(255,255,255,.8);

    border-bottom:none;
}

.goal{

    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:28%;

    height:7%;

    border:
    2px solid rgba(255,255,255,.9);

    border-bottom:none;
}

/* =====================================================
PLAYER ON FIELD
===================================================== */

.player-spot{

    position:absolute;

    width:86px;

    transform:translate(-50%,-50%);

    text-align:center;

    z-index:5;
}

.pos-label{

    position:absolute;

    top:-12px;

    left:50%;

    transform:translateX(-50%);

    padding:2px 6px;

    border-radius:8px;

    background:rgba(0,0,0,.78);

    font-size:8px;

    font-family:'Orbitron';

    z-index:10;
}

/* =====================================================
MINI CARD
===================================================== */

.mini-card{

    width:70px;

    height:88px;

    margin:auto;

    position:relative;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    justify-content:flex-end;

    padding:4px;

    border-radius:12px;

    transition:.3s;

    box-shadow:
        0 8px 18px rgba(0,0,0,.65);
}

.mini-card:hover{

    transform:
        translateY(-7px)
        scale(1.12);

    z-index:30;
}

.mini-card::before{

    content:"";

    position:absolute;

    inset:0;

    background:

    linear-gradient(
        135deg,
        rgba(255,255,255,.55),
        transparent 25%,
        transparent 70%,
        rgba(255,255,255,.2)
    );

    z-index:4;

    pointer-events:none;
}

.mini-card::after{

    content:"";

    position:absolute;

    inset:3px;

    border-radius:9px;

    border:1px solid rgba(255,255,255,.5);

    pointer-events:none;

    z-index:5;
}

.mini-photo{

    position:absolute;

    left:5px;

    right:5px;

    top:12px;

    height:59px;

    z-index:1;

    display:flex;

    align-items:flex-start;

    justify-content:center;
}

.mini-photo img{

    width:100%;

    height:100%;

    object-fit:cover;

    object-position:center top;

    border-radius:7px;

    filter:
        saturate(1.12)
        contrast(1.05);

    mask-image:

    linear-gradient(
        to bottom,
        #000 65%,
        transparent 100%
    );
}

.mini-rating{

    position:absolute;

    top:4px;

    left:6px;

    font-family:'Orbitron';

    font-size:11px;

    font-weight:900;

    z-index:8;
}

.mini-pos{

    position:absolute;

    top:19px;

    left:6px;

    font-size:7px;

    font-weight:900;

    z-index:8;
}

.mini-name{

    position:relative;

    z-index:8;

    font-size:7px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    text-shadow:0 1px 2px #000;
}

.mini-card.empty{

    opacity:.35;

    filter:grayscale(1);

    background:#222;

    border:2px dashed #777;
}

/* =====================================================
CURRENT MINI
===================================================== */

.mini-card.card-current{

    background:

    radial-gradient(
        circle at 50% 15%,
        #dfffff,
        #19d7ff 28%,
        #0064a8 65%,
        #031323 100%
    );

    border:2px solid #69edff;

    color:#fff;

    box-shadow:

    0 0 10px rgba(0,220,255,.7),

    0 0 22px rgba(0,130,255,.35);
}

/* =====================================================
RETIRED MINI
===================================================== */

.mini-card.card-retired{

    background:

    radial-gradient(
        circle at 50% 10%,
        #fff5d0,
        #c98b24 30%,
        #713900 65%,
        #241000 100%
    );

    border:2px solid #e9b94d;

    color:#fff;

    box-shadow:

    0 0 12px rgba(230,160,30,.6);
}

/* =====================================================
ICON MINI
===================================================== */

.mini-card.card-icon{

    background:

    radial-gradient(
        circle at 50% 10%,
        #ffffff,
        #d7bd52 18%,
        #16345d 48%,
        #030816 100%
    );

    border:2px solid #fff1a8;

    color:#fff;

    box-shadow:

    0 0 12px rgba(255,215,0,.8),

    0 0 22px rgba(0,162,255,.5);
}

/* =====================================================
GOAT MINI
===================================================== */

.mini-card.card-goat{

    background:

    radial-gradient(
        circle at 50% 5%,
        #fff,
        #ffd700 20%,
        #ff4fd8 42%,
        #7100c7 68%,
        #0b0018 100%
    );

    border:2px solid #fff;

    color:#fff;

    box-shadow:

    0 0 15px #ffd700,

    0 0 28px #a000ff;
}

/* =====================================================
MAIN CARD AREA
===================================================== */

.card-area{

    display:flex;

    justify-content:center;

    align-items:center;

    margin:30px auto 40px;

    perspective:1500px;
}

.player-card{

    width:min(420px,94vw);

    min-height:620px;

    position:relative;

    overflow:hidden;

    padding:21px 24px 18px;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    isolation:isolate;

    border-radius:38px;

    animation:
        cardEnter .75s cubic-bezier(.2,.8,.2,1);

    clip-path:

    polygon(
        7% 0,
        93% 0,
        100% 6%,
        97% 94%,
        90% 100%,
        10% 100%,
        3% 94%,
        0 6%
    );

    box-shadow:

    0 30px 70px rgba(0,0,0,.85);
}

@keyframes cardEnter{

    0%{

        opacity:0;

        transform:
            scale(.68)
            rotateY(35deg)
            translateY(35px);

    }

    100%{

        opacity:1;

        transform:
            scale(1)
            rotateY(0)
            translateY(0);

    }
}

/* =====================================================
CARD BORDER
===================================================== */

.player-card::before{

    content:"";

    position:absolute;

    inset:0;

    background:

    linear-gradient(
        135deg,
        #fff,
        #ffd700 18%,
        #fff 30%,
        #d7a51e 48%,
        #fff 65%,
        #ffd700 82%,
        #fff
    );

    z-index:-2;
}

.player-card::after{

    content:"";

    position:absolute;

    inset:6px;

    clip-path:

    polygon(
        7% 0,
        93% 0,
        100% 6%,
        97% 94%,
        90% 100%,
        10% 100%,
        3% 94%,
        0 6%
    );

    z-index:-1;

    pointer-events:none;
}

/* =====================================================
CURRENT CARD
===================================================== */

.card-current{

    background:

    radial-gradient(
        ellipse at 50% 15%,
        #eaffff 0%,
        #20d9ff 20%,
        #0076c9 45%,
        #003b70 72%,
        #020b18 100%
    );

    color:#fff;

    box-shadow:

    0 0 25px rgba(0,220,255,.7),

    0 0 65px rgba(0,130,255,.4),

    0 30px 80px rgba(0,0,0,.8);
}

.card-current::after{

    background:

    linear-gradient(
        135deg,
        rgba(0,255,255,.25),
        rgba(0,0,0,.2)
    );

    border:
        2px solid rgba(110,240,255,.75);
}

/* =====================================================
RETIRED CARD
===================================================== */

.card-retired{

    background:

    radial-gradient(
        ellipse at 50% 10%,
        #fff5d4 0%,
        #e4b044 22%,
        #a9630b 48%,
        #552700 73%,
        #1c0900 100%
    );

    color:#fff;

    box-shadow:

    0 0 30px rgba(255,190,50,.55),

    0 0 70px rgba(150,70,0,.35),

    0 30px 80px rgba(0,0,0,.8);
}

.card-retired::after{

    background:

    linear-gradient(
        135deg,
        rgba(255,255,255,.18),
        rgba(80,25,0,.25)
    );

    border:
        2px solid rgba(255,220,130,.8);
}

/* =====================================================
ICON CARD
===================================================== */

.card-icon{

    background:

    radial-gradient(
        ellipse at 50% 10%,
        #ffffff 0%,
        #f2df87 12%,
        #c59d35 26%,
        #173962 48%,
        #071324 72%,
        #01050c 100%
    );

    color:#fff;

    box-shadow:

    0 0 25px rgba(255,215,0,.8),

    0 0 55px rgba(0,180,255,.5),

    0 0 90px rgba(255,180,0,.25),

    0 30px 80px rgba(0,0,0,.85);
}

.card-icon::after{

    background:

    radial-gradient(
        circle at 0% 50%,
        rgba(0,180,255,.45),
        transparent 35%
    ),

    radial-gradient(
        circle at 100% 50%,
        rgba(0,180,255,.45),
        transparent 35%
    ),

    linear-gradient(
        135deg,
        rgba(255,215,0,.18),
        transparent
    );

    border:
        2px solid rgba(255,230,150,.8);
}

/* =====================================================
GOAT CARD
===================================================== */

.card-goat{

    background:

    radial-gradient(
        ellipse at 50% 8%,
        #fff 0%,
        #fff3a0 12%,
        #ffd700 25%,
        #ff4bd8 43%,
        #8d00d9 64%,
        #27004e 82%,
        #05000c 100%
    );

    color:#fff;

    animation:

        cardEnter .75s cubic-bezier(.2,.8,.2,1),

        goatGlow 2s infinite alternate;
}

@keyframes goatGlow{

    from{

        box-shadow:

        0 0 20px #fff,

        0 0 45px #ffd700,

        0 0 75px #9b00ff,

        0 30px 80px rgba(0,0,0,.8);
    }

    to{

        box-shadow:

        0 0 35px #fff,

        0 0 75px #ffd700,

        0 0 115px #9b00ff,

        0 30px 80px rgba(0,0,0,.8);
    }
}

.card-goat::after{

    background:

    radial-gradient(
        circle at 50% 0%,
        rgba(255,255,255,.45),
        transparent 45%
    ),

    linear-gradient(
        135deg,
        rgba(255,215,0,.15),
        rgba(150,0,255,.25)
    );

    border:
        2px solid rgba(255,255,255,.85);
}

/* =====================================================
CARD PATTERN
===================================================== */

.card-pattern{

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:0;

    opacity:.35;

    background:

    linear-gradient(
        135deg,
        transparent 30%,
        rgba(255,255,255,.25) 30.5%,
        transparent 31%
    ),

    linear-gradient(
        45deg,
        transparent 55%,
        rgba(255,255,255,.16) 55.5%,
        transparent 56%
    ),

    linear-gradient(
        120deg,
        transparent 70%,
        rgba(255,215,0,.2) 70.5%,
        transparent 71%
    );
}

/* =====================================================
CRYSTAL EFFECT
===================================================== */

.player-card .crystal{

    position:absolute;

    width:80px;

    height:80px;

    transform:rotate(45deg);

    border:

    2px solid rgba(255,255,255,.65);

    background:

    linear-gradient(
        135deg,
        rgba(255,255,255,.5),
        rgba(0,190,255,.2),
        rgba(255,215,0,.35)
    );

    box-shadow:

    0 0 25px rgba(255,255,255,.3);

    pointer-events:none;

    z-index:1;
}

.crystal.c1{
    top:170px;
    left:-42px;
}

.crystal.c2{
    top:270px;
    right:-42px;
}

.crystal.c3{
    bottom:115px;
    left:-35px;
}

.crystal.c4{
    bottom:160px;
    right:-35px;
}

/* =====================================================
SHINE
===================================================== */

.card-shine{

    position:absolute;

    width:180px;

    height:750px;

    top:-100px;

    right:-280px;

    transform:rotate(25deg);

    background:

    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.5),
        transparent
    );

    animation:shine 4s infinite;

    pointer-events:none;

    z-index:4;
}

@keyframes shine{

    0%{
        right:-280px;
    }

    55%,100%{
        right:600px;
    }
}

/* =====================================================
CARD TOP
===================================================== */

.card-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    position:relative;

    z-index:8;
}

.rating-box{

    display:flex;

    flex-direction:column;

    align-items:center;
}

.rating{

    font-family:'Orbitron';

    font-size:62px;

    font-weight:900;

    line-height:.8;

    background:

    linear-gradient(
        180deg,
        #ffffff 0%,
        #fff5a0 30%,
        #ffd700 70%,
        #9b6500 100%
    );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    text-shadow:
        0 4px 10px rgba(0,0,0,.6);
}

.position{

    font-family:'Orbitron';

    font-size:14px;

    font-weight:900;

    color:#fff;

    letter-spacing:2px;

    margin-top:5px;

    text-shadow:
        0 2px 5px #000;
}

.card-type{

    max-width:190px;

    padding:9px 13px;

    border-radius:20px;

    font-size:10px;

    font-weight:900;

    background:rgba(0,0,0,.45);

    border:1px solid rgba(255,215,0,.8);

    backdrop-filter:blur(6px);

    box-shadow:
        0 5px 15px rgba(0,0,0,.4);
}

/* =====================================================
PLAYER PHOTO
===================================================== */

.player-photo{

    width:285px;

    height:310px;

    margin:-7px auto -5px;

    position:relative;

    z-index:3;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    overflow:hidden;
}

.player-photo::before{

    content:"";

    position:absolute;

    width:290px;

    height:290px;

    bottom:-60px;

    border-radius:50%;

    background:

    radial-gradient(
        circle,
        rgba(255,255,255,.3),
        transparent 65%
    );

    filter:blur(5px);
}

.player-photo::after{

    content:"";

    position:absolute;

    inset:0;

    background:

    linear-gradient(
        to bottom,
        transparent 62%,
        rgba(0,0,0,.15) 100%
    );

    pointer-events:none;
}

.player-photo img{

    width:100%;

    height:100%;

    object-fit:cover;

    object-position:center top;

    border-radius:18px;

    filter:

        saturate(1.1)

        contrast(1.06)

        drop-shadow(
            0 18px 12px rgba(0,0,0,.5)
        );

    mask-image:

    linear-gradient(
        to bottom,
        #000 75%,
        transparent 100%
    );
}

/* =====================================================
PLAYER NAME
===================================================== */

.player-name{

    position:relative;

    z-index:9;

    font-family:'Orbitron','Cairo';

    font-size:22px;

    font-weight:900;

    text-align:center;

    margin:5px auto 0;

    padding:9px 20px;

    width:92%;

    color:#fff;

    text-transform:uppercase;

    background:

    linear-gradient(
        180deg,
        #17283e,
        #050b15
    );

    border:

    2px solid #ffd700;

    border-radius:10px;

    box-shadow:

    0 5px 15px rgba(0,0,0,.8),

    0 0 15px rgba(255,215,0,.45);

    text-shadow:
        0 2px 4px #000;
}

/* =====================================================
PRICE
===================================================== */

.card-price{

    position:relative;

    z-index:9;

    text-align:center;

    margin-top:8px;

    padding:9px;

    border-radius:12px;

    font-family:'Orbitron';

    font-size:19px;

    font-weight:900;

    background:rgba(0,0,0,.42);

    border:1px solid rgba(255,215,0,.65);

    box-shadow:
        inset 0 0 15px rgba(0,0,0,.3);
}

/* =====================================================
CARD STATS
===================================================== */

.card-stats{

    position:relative;

    z-index:9;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:6px;

    margin-top:9px;
}

.card-stat{

    padding:6px 2px;

    border-radius:8px;

    background:rgba(0,0,0,.45);

    border:1px solid rgba(255,215,0,.35);

    font-family:'Orbitron';

    font-size:11px;

    font-weight:900;

    color:#fff;

    box-shadow:
        inset 0 0 10px rgba(0,0,0,.2);
}

.card-stat span{

    display:block;

    font-size:7px;

    margin-bottom:2px;

    opacity:.9;

    color:#ffd700;
}

/* =====================================================
CONTROLS
===================================================== */

.controls{

    position:relative;

    z-index:5;

    width:min(500px,95%);

    margin:18px auto;

    padding:18px;

    border-radius:22px;

    background:

    linear-gradient(
        145deg,
        rgba(20,25,24,.96),
        rgba(4,6,5,.98)
    );

    border:1px solid rgba(255,215,0,.35);

    box-shadow:
        0 20px 60px rgba(0,0,0,.5);
}

#bidInput{

    width:100%;

    padding:14px;

    margin-bottom:10px;

    border-radius:12px;

    border:2px solid #d5aa19;

    outline:none;

    background:#080b0a;

    color:#fff;

    text-align:center;

    font-family:'Orbitron';

    font-size:16px;
}

#bidInput:focus{

    box-shadow:
        0 0 20px rgba(255,215,0,.3);
}

.buttons{

    display:grid;

    grid-template-columns:
    1fr 1fr 1fr;

    gap:8px;
}

button{

    padding:13px 8px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-family:'Cairo';

    font-weight:900;

    font-size:14px;

    transition:.2s;
}

button:hover:not(:disabled){

    transform:translateY(-3px);

    filter:brightness(1.12);
}

button:active:not(:disabled){

    transform:scale(.96);
}

button:disabled{

    opacity:.4;

    cursor:not-allowed;
}

.bid{

    background:

    linear-gradient(
        135deg,
        #50ff85,
        #00a43a
    );

    color:#001b09;
}

.take{

    background:

    linear-gradient(
        135deg,
        #ff5252,
        #a80000
    );

    color:#fff;
}

.skip{

    background:

    linear-gradient(
        135deg,
        #555,
        #222
    );

    color:#fff;
}

/* =====================================================
TIMER
===================================================== */

.timer{

    display:none;

    width:min(500px,92%);

    margin:20px auto;

    padding:20px;

    border-radius:20px;

    font-family:'Orbitron';

    font-size:22px;

    color:#ffd700;

    background:#090b0a;

    border:1px solid #d5aa19;

    box-shadow:
        0 0 30px rgba(255,215,0,.2);
}

/* =====================================================
MATCH RESULT
===================================================== */

.result{

    width:100%;
}

.match-result{

    width:min(1100px,96%);

    margin:35px auto 70px;

    padding:25px;

    border-radius:30px;

    background:

    radial-gradient(
        circle at 50% 0%,
        rgba(255,215,0,.15),
        transparent 40%
    ),

    linear-gradient(
        145deg,
        #101715,
        #030605
    );

    border:2px solid rgba(255,215,0,.45);

    box-shadow:

    0 30px 90px rgba(0,0,0,.65),

    0 0 50px rgba(255,215,0,.12);

    animation:matchEnter .8s ease;
}

@keyframes matchEnter{

    from{

        opacity:0;

        transform:
            scale(.88)
            translateY(30px);
    }

    to{

        opacity:1;

        transform:
            scale(1)
            translateY(0);
    }
}

.match-header{

    font-family:'Orbitron';

    font-size:14px;

    color:#ffd700;

    letter-spacing:2px;

    margin-bottom:18px;
}

.match-teams{

    display:grid;

    grid-template-columns:
    1fr
    auto
    1fr;

    gap:15px;

    align-items:center;
}

.match-team{

    padding:18px;

    border-radius:22px;

    min-height:120px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    font-weight:900;
}

.match-team.blue{

    background:

    linear-gradient(
        145deg,
        rgba(0,170,255,.22),
        rgba(0,75,120,.12)
    );

    border:1px solid rgba(0,170,255,.45);
}

.match-team.red{

    background:

    linear-gradient(
        145deg,
        rgba(255,50,50,.22),
        rgba(120,0,0,.12)
    );

    border:1px solid rgba(255,60,60,.45);
}

.team-name-result{

    font-size:20px;

    margin-bottom:8px;
}

.team-score{

    font-family:'Orbitron';

    font-size:55px;

    line-height:1;
}

.vs{

    font-family:'Orbitron';

    font-size:20px;

    color:#ffd700;
}

.winner-badge{

    display:inline-block;

    margin-top:8px;

    padding:4px 12px;

    border-radius:20px;

    background:#ffd700;

    color:#111;

    font-size:11px;
}

.match-score-title{

    margin:25px 0 15px;

    font-size:18px;

    font-weight:900;
}

.stats-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;
}

.match-stat{

    padding:14px;

    border-radius:15px;

    background:rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.07);
}

.stat-label{

    display:block;

    font-size:12px;

    color:#bbb;

    margin-bottom:8px;
}

.stat-values{

    display:grid;

    grid-template-columns:
    1fr
    auto
    1fr;

    align-items:center;

    gap:8px;

    font-family:'Orbitron';

    font-size:18px;
}

.stat-values .blue-value{

    color:#56c7ff;

    text-align:right;
}

.stat-values .red-value{

    color:#ff7474;

    text-align:left;
}

.stat-values .icon{

    font-family:'Cairo';

    font-size:13px;
}

.possession{

    grid-column:1/-1;
}

.possession-bar{

    height:16px;

    width:100%;

    display:flex;

    overflow:hidden;

    border-radius:20px;

    background:#222;

    margin-top:10px;
}

.pos-blue{

    height:100%;

    background:

    linear-gradient(
        90deg,
        #0077aa,
        #00c8ff
    );
}

.pos-red{

    height:100%;

    background:

    linear-gradient(
        90deg,
        #ff3333,
        #a00000
    );
}

.possession-numbers{

    display:flex;

    justify-content:space-between;

    margin-top:7px;

    font-family:'Orbitron';

    font-size:13px;
}

.match-man{

    margin-top:20px;

    padding:18px;

    border-radius:20px;

    background:

    linear-gradient(
        135deg,
        rgba(255,215,0,.13),
        rgba(255,255,255,.03)
    );

    border:1px solid rgba(255,215,0,.3);
}

.man-title{

    color:#ffd700;

    font-size:12px;

    font-weight:900;
}

.man-name{

    font-family:'Orbitron';

    font-size:22px;

    margin-top:5px;
}

.formations{

    margin-top:25px;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:20px;
}

.formation-box{

    padding:15px;

    border-radius:20px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.07);
}

.formation-title{

    font-weight:900;

    margin-bottom:12px;
}

.formation-list{

    display:grid;

    grid-template-columns:

    gap:7px;

/* =====================================================
STABLE RATING
===================================================== */

function stableHash(text){

let hash=0;

for(let i=0;i<text.length;i++){

hash=
((hash<<5)-hash)+
text.charCodeAt(i);

hash|=0;

}

return Math.abs(hash);
}


function getRating(name,tag){

const hash=
stableHash(name);

if(tag==="goat")
return 99;

if(tag==="icon")
return 95+(hash%5);

if(tag==="retired")
return 91+(hash%7);

return 89+(hash%8);

}

/* =====================================================
REAL PLAYER IMAGE
===================================================== */

async function getRealPlayerImage(name){

if(imageCache[name])
return imageCache[name];

if(imageLoading[name])
return imageLoading[name];

imageLoading[name]=(async()=>{

try{

const url=
"https://en.wikipedia.org/api/rest_v1/page/summary/"+
encodeURIComponent(name);

const response=
await fetch(
url,
{
cache:"force-cache"
}
);

if(response.ok){

const data=
await response.json();

const image=
data?.thumbnail?.source||
data?.originalimage?.source;

if(image){

imageCache[name]=image;

return image;

}

}


/* Search API */

const searchURL=
"https://en.wikipedia.org/w/api.php"+
"?action=query"+
"&generator=search"+
"&gsrsearch="+
encodeURIComponent(
name+" footballer"
)+
"&gsrnamespace=0"+
"&prop=pageimages"+
"&piprop=thumbnail"+
"&pithumbsize=600"+
"&format=json"+
"&origin=*";

const searchResponse=
await fetch(
searchURL,
{
cache:"force-cache"
}
);

if(searchResponse.ok){

const searchData=
await searchResponse.json();

const pages=
Object.values(
searchData?.query?.pages||{}
);

for(const page of pages){

if(page.thumbnail?.source){

imageCache[name]=
page.thumbnail.source;

return page.thumbnail.source;

}

}

}

}catch(error){

console.warn(
"Image loading failed:",
name,
error
);

}

return getFallbackImg(name);

})();

const result=
await imageLoading[name];

delete imageLoading[name];

return result;

}

/* =====================================================
AUDIO
===================================================== */

let audioContext=null;

function playMoneySound(){

try{

if(!audioContext){

audioContext=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

const now=
audioContext.currentTime;

const oscillator=
audioContext.createOscillator();

const gain=
audioContext.createGain();

oscillator.type="sine";

oscillator.frequency.setValueAtTime(
520,
now
);

oscillator.frequency.exponentialRampToValueAtTime(
180,
now+.25
);

gain.gain.setValueAtTime(
.001,
now
);

gain.gain.exponentialRampToValueAtTime(
.35,
now+.03
);

gain.gain.exponentialRampToValueAtTime(
.001,
now+.3
);

oscillator.connect(gain);

gain.connect(
audioContext.destination
);

oscillator.start(now);

oscillator.stop(
now+.32
);

}catch(e){}

}

/* =====================================================

function clamp(value){

return Math.max(
50,
Math.min(
99,
Math.round(value)
)
);

}


function getCardStats(player){

const r=
Number(player.r)||85;

const pos=
positions[currentPosIndex];

let stats={

PAC:r,
SHO:r,
PAS:r,
DRI:r,
DEF:r,
PHY:r

};


if(pos==="GK"){

stats={

PAC:clamp(r-7),

SHO:clamp(r-35),

PAS:clamp(r-2),

DRI:clamp(r-10),

DEF:clamp(r+1),

PHY:clamp(r)

};

}

else if(
pos==="LB"||
pos==="RB"
){

stats={

PAC:clamp(r+3),

SHO:clamp(r-4),

PAS:clamp(r+2),

DRI:clamp(r+3),

DEF:clamp(r+2),

PHY:clamp(r)

};

}

else if(
pos==="CB1"||
pos==="CB2"
){

stats={

PAC:clamp(r-1),

SHO:clamp(r-18),

PAS:clamp(r),

DRI:clamp(r-7),

DEF:clamp(r+4),

PHY:clamp(r+3)

};

}

else if(
pos==="CM1"||
pos==="CM2"
){

stats={

PAC:clamp(r),

SHO:clamp(r),

PAS:clamp(r+4),

DRI:clamp(r+3),

DEF:clamp(r),

PHY:clamp(r+1)

};

}

else if(pos==="CAM"){

stats={

PAC:clamp(r+2),

SHO:clamp(r+3),

PAS:clamp(r+4),

DRI:clamp(r+5),

DEF:clamp(r-14),

PHY:clamp(r-3)

};

}

else{

stats={

PAC:clamp(r+4),

SHO:clamp(r+5),

PAS:clamp(r+1),

DRI:clamp(r+4),

DEF:clamp(r-13),

PHY:clamp(r+1)

};

}

return stats;

}

goals1=
Math.max(
0,
Math.min(
7,
goals1
)
);


goals2=
Math.max(
0,
Math.min(
7,
goals2
);


const shots1=
Math.max(

goals1+2,

Math.round(

8+
power1/14+
Math.random()*6

)

);


const shots2=
Math.max(

goals2+2,

Math.round(

8+
power2/14+
Math.random()*6

)

);


const onTarget1=
Math.min(

shots1,

Math.max(

goals1,

Math.round(

shots1*
(.35+Math.random()*.25)

)

)

);


const onTarget2=
Math.min(

shots2,

Math.max(

goals2,

Math.round(

shots2*
(.35+Math.random()*.25)

)

)

);


const corners1=
Math.max(

1,

Math.round(

2+
possession1/15+
Math.random()*3

)

);


const corners2=
Math.max(

1,

Math.round(

2+
possession2/15+
Math.random()*3

)

);


const yellow1=
Math.floor(
Math.random()*4
);

const yellow2=
Math.floor(
Math.random()*4
);


const red1=
Math.random()<.12?
1:
0;

const red2=
Math.random()<.12?
1:
0;


const fouls1=
Math.round(
7+
Math.random()*9
);

const fouls2=
Math.round(
7+
Math.random()*9
);


const passes1=
Math.round(

280+
power1*1.8+
Math.random()*100

);


const passes2=
Math.round(

280+
power2*1.8+
Math.random()*100

);


let manTeam;


if(goals1>goals2){

manTeam=1;

}

else if(goals2>goals1){

manTeam=2;

}

else{

manTeam=
power1>=power2?
1:
2;

}


const manPlayers=
manTeam===1?
t1:
t2;


let manPlayer=null;


positions.forEach(pos=>{

const p=
manPlayers[pos];

if(!p)
return;


if(
!manPlayer||
(p.r||0)>
(manPlayer.r||0)
){

manPlayer=p;

}

});


let winner=0;


if(goals1>goals2){

winner=1;

}

else if(goals2>goals1){

winner=2;

}


const matchResult={

goals1,

goals2,

possession1,

possession2,

shots1,

shots2,

onTarget1,

onTarget2,

corners1,

corners2,

yellow1,

yellow2,

red1,

red2,

fouls1,

fouls2,

passes1,

passes2,

power1,

power2,

winner,

manPlayer:
manPlayer?
manPlayer.n:
"أفضل لاعب",

manTeam

};


roomRef.update({

matchResult:

matchResult,

currentPos:

positions.length

});

}
