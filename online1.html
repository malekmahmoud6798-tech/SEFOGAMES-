<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L&S Football Auction</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Tahoma, sans-serif;
    background:
        radial-gradient(circle at top,#16243d 0%,#070b13 42%,#020305 100%);
    color:#fff;
    min-height:100vh;
}

button{
    font-family:inherit;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(5,8,14,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,215,100,.2);
    padding:14px 20px;
}

.header-inner{
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-weight:900;
    font-size:23px;
    letter-spacing:1px;
}

.logo span{
    color:#ffd45a;
}

.coins{
    background:linear-gradient(135deg,#211700,#a87400,#ffe58b,#9c6500);
    color:#140d00;
    padding:9px 17px;
    border-radius:30px;
    font-weight:900;
    box-shadow:0 0 20px rgba(255,195,50,.25);
}

.container{
    max-width:1250px;
    margin:auto;
    padding:20px;
}

.auction-box{
    background:linear-gradient(145deg,rgba(24,31,48,.95),rgba(6,9,16,.95));
    border:1px solid rgba(255,210,90,.22);
    border-radius:20px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.35);
}

.auction-title{
    text-align:center;
    font-size:28px;
    font-weight:900;
    margin-bottom:6px;
}

.auction-sub{
    text-align:center;
    color:#aeb8c9;
    margin-bottom:18px;
}

.auction-status{
    text-align:center;
    min-height:25px;
    margin-bottom:15px;
    color:#ffd45a;
    font-weight:bold;
}

.auction-content{
    display:none;
    grid-template-columns:360px 1fr;
    gap:25px;
    align-items:center;
}

.auction-content.show{
    display:grid;
}

.auction-card-wrap{
    display:flex;
    justify-content:center;
}

.auction-info{
    text-align:center;
}

.current-bid{
    font-size:38px;
    font-weight:900;
    color:#ffe082;
    margin:15px 0;
    text-shadow:0 0 20px rgba(255,205,70,.35);
}

.bid-buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

.bid-btn,
.start-btn,
.next-btn{
    border:0;
    cursor:pointer;
    color:#160e00;
    font-weight:900;
    padding:12px 20px;
    border-radius:12px;
    background:linear-gradient(135deg,#fff0a5,#ffc52e,#9d6500);
    box-shadow:0 7px 20px rgba(255,188,20,.2);
    transition:.2s;
}

.bid-btn:hover,
.start-btn:hover,
.next-btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.08);
}

.next-btn{
    margin-top:15px;
    background:linear-gradient(135deg,#b9eaff,#318fd0,#11518b);
    color:#fff;
}

.start-btn{
    display:block;
    margin:10px auto 0;
    font-size:17px;
}

/* ================= CARD ================= */

.player-card{
    width:320px;
    height:465px;
    position:relative;
    overflow:hidden;
    border-radius:22px;
    padding:7px;
    background:
        linear-gradient(145deg,#fff4b0,#9b6200 12%,#ffe98a 25%,#7c4800 42%,#fff0a1 60%,#8c5700 78%,#ffe789);
    box-shadow:
        0 0 0 2px #4d2d00,
        0 0 0 5px #d7a934,
        0 15px 50px rgba(0,0,0,.65),
        0 0 35px rgba(255,198,48,.22);
    transform:translateZ(0);
}

.player-card::before{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:17px;
    pointer-events:none;
    border:2px solid rgba(255,245,190,.75);
    z-index:10;
}

.card-inner{
    height:100%;
    position:relative;
    overflow:hidden;
    border-radius:17px;
    background:
        radial-gradient(circle at 70% 28%,rgba(255,230,100,.5),transparent 16%),
        linear-gradient(145deg,#0c1625,#111c31 35%,#04070e 70%,#182945);
}

/* crystals */
.crystal{
    position:absolute;
    width:45px;
    height:105px;
    background:linear-gradient(135deg,#fff,#63d7ff 25%,#155d9c 55%,#bceeff);
    clip-path:polygon(50% 0,100% 25%,80% 100%,35% 75%,0 30%);
    opacity:.75;
    filter:drop-shadow(0 0 10px #5bcfff);
}

.crystal.c1{left:-8px;top:95px;transform:rotate(-15deg);}
.crystal.c2{right:-7px;top:100px;transform:rotate(18deg);}
.crystal.c3{left:5px;bottom:20px;transform:rotate(25deg);height:85px;}
.crystal.c4{right:0;bottom:30px;transform:rotate(-25deg);height:90px;}

.gold-line{
    position:absolute;
    left:17px;
    right:17px;
    height:2px;
    background:linear-gradient(90deg,transparent,#fff3a0,#a96d00,#fff2a0,transparent);
    opacity:.8;
}

.gold-line.top{top:90px;}
.gold-line.bottom{bottom:74px;}

.card-top{
    position:absolute;
    left:15px;
    right:15px;
    top:12px;
    z-index:4;
    display:flex;
    justify-content:center;
}

.ball-emblem{
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    background:radial-gradient(circle,#fff5bd,#d89913,#674000);
    border:3px solid #ffe899;
    box-shadow:0 0 0 3px #704500,0 0 20px rgba(255,207,69,.5);
}

.rating{
    position:absolute;
    top:30px;
    left:24px;
    z-index:5;
    text-align:center;
}

.rating-number{
    font-size:56px;
    line-height:.9;
    font-weight:1000;
    color:#fff9e4;
    text-shadow:
        2px 2px 0 #704100,
        -1px -1px 0 #fff,
        0 0 15px rgba(255,255,255,.25);
}

.position{
    margin-top:5px;
    font-size:18px;
    font-weight:1000;
    color:#ffd65d;
    text-shadow:1px 1px #3d2200;
}

.card-photo{
    position:absolute;
    top:70px;
    left:45px;
    right:45px;
    height:235px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    z-index:2;
}

.player-avatar{
    width:205px;
    height:235px;
    object-fit:cover;
    object-position:center;
    border-radius:55% 55% 20% 20%;
    border:3px solid rgba(255,221,111,.75);
    background:linear-gradient(180deg,#4d6d8c,#101927);
    box-shadow:0 8px 30px rgba(0,0,0,.5);
}

.photo-glow{
    position:absolute;
    width:210px;
    height:210px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,207,68,.32),transparent 70%);
    z-index:-1;
}

.card-name{
    position:absolute;
    left:18px;
    right:18px;
    bottom:94px;
    z-index:5;
    text-align:center;
    padding:13px 7px 11px;
    border-radius:9px;
    background:
        linear-gradient(180deg,#fff8d0,#e7c777 18%,#8b570b 90%,#f5d986);
    border:2px solid #ffeeb0;
    box-shadow:0 0 0 2px #674000,0 5px 15px rgba(0,0,0,.4);
}

.card-name span{
    display:block;
    font-size:27px;
    line-height:1;
    font-weight:1000;
    letter-spacing:1px;
    color:#4b2800;
    text-shadow:1px 1px #fff1aa;
}

.card-type{
    position:absolute;
    left:22px;
    bottom:56px;
    z-index:5;
    color:#ffe08a;
    font-size:13px;
    font-weight:1000;
    letter-spacing:2px;
}

.flag{
    position:absolute;
    right:22px;
    bottom:46px;
    z-index:5;
    width:62px;
    height:37px;
    object-fit:cover;
    border-radius:5px;
    border:2px solid #f7d66e;
    box-shadow:0 3px 10px rgba(0,0,0,.4);
}

.card-footer{
    position:absolute;
    left:18px;
    right:18px;
    bottom:10px;
    z-index:5;
    display:flex;
    justify-content:center;
    gap:8px;
}

.stat{
    width:55px;
    text-align:center;
}

.stat b{
    display:block;
    color:#ffe27d;
    font-size:16px;
}

.stat small{
    color:#bfc9d9;
    font-size:9px;
}

/* categories */

.card-icon{
    background:linear-gradient(145deg,#fff8c9,#dca62c,#fff2a1,#8c5600);
}

.card-toty{
    background:linear-gradient(145deg,#fff,#65dfff,#1377ae,#fff,#4c8eff);
}

.card-tots{
    background:linear-gradient(145deg,#e6c1ff,#9136e4,#f8d5ff,#5a0eaa);
}

.card-hero{
    background:linear-gradient(145deg,#ffd6a0,#e36c18,#ffbf55,#792800);
}

.card-legend{
    background:linear-gradient(145deg,#c9f8ff,#36a9c7,#0d4660,#bdf7ff);
}

.card-rare{
    background:linear-gradient(145deg,#d9e6ff,#5776a8,#dbe7ff,#263c69);
}

/* ================= PLAYERS ================= */

.section-title{
    font-size:26px;
    font-weight:900;
    margin:25px 0 15px;
}

.filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:20px;
}

.filter{
    flex:none;
    cursor:pointer;
    border:1px solid #344158;
    background:#111827;
    color:#cbd5e1;
    border-radius:20px;
    padding:9px 15px;
}

.filter.active{
    background:linear-gradient(135deg,#ffe58a,#a96c00);
    color:#160d00;
    border-color:#ffe58a;
    font-weight:bold;
}

.players-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:18px;
}

.mini-card{
    background:linear-gradient(145deg,#161f30,#080b12);
    border:1px solid #29354c;
    border-radius:16px;
    padding:12px;
    cursor:pointer;
    transition:.2s;
}

.mini-card:hover{
    transform:translateY(-4px);
    border-color:#dcae3c;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.mini-top{
    display:flex;
    align-items:center;
    gap:12px;
}

.mini-avatar{
    width:62px;
    height:62px;
    border-radius:12px;
    object-fit:cover;
    background:#172235;
    border:1px solid #806226;
}

.mini-rating{
    font-size:27px;
    font-weight:1000;
    color:#ffe18a;
}

.mini-name{
    font-weight:900;
    margin-top:9px;
}

.mini-meta{
    display:flex;
    justify-content:space-between;
    margin-top:7px;
    color:#8e9bb0;
    font-size:12px;
}

.badge{
    display:inline-block;
    margin-top:8px;
    padding:4px 8px;
    border-radius:8px;
    font-size:10px;
    font-weight:bold;
    background:#2a3140;
    color:#ffe08a;
}

/* loading safety */
.loading{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:150px;
}

.spinner{
    width:42px;
    height:42px;
    border:4px solid rgba(255,255,255,.15);
    border-top-color:#ffd34e;
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin-bottom:12px;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.empty{
    grid-column:1/-1;
    text-align:center;
    color:#9ba8bb;
    padding:35px;
}

/* modal */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(8px);
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:#0e1522;
    border:1px solid #8e6920;
    border-radius:20px;
    width:min(900px,100%);
    max-height:90vh;
    overflow:auto;
    padding:20px;
}

.close{
    float:left;
    border:0;
    background:#2a3344;
    color:#fff;
    width:38px;
    height:38px;
    border-radius:50%;
    cursor:pointer;
    font-size:20px;
}

.modal-content{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
}

.details{
    flex:1;
    min-width:250px;
    text-align:center;
    padding:20px;
}

.details h2{
    color:#ffe18a;
    font-size:32px;
    margin-bottom:15px;
}

.details-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.detail{
    padding:14px;
    background:#151e2d;
    border-radius:10px;
}

.detail b{
    display:block;
    color:#ffe08a;
    font-size:20px;
}

/* responsive */

@media(max-width:800px){
    .auction-content.show{
        grid-template-columns:1fr;
    }

    .auction-card-wrap{
        order:1;
    }

    .auction-info{
        order:2;
    }
}

@media(max-width:500px){
    .container{
        padding:12px;
    }

    .player-card{
        width:290px;
        height:425px;
    }

    .card-photo{
        height:215px;
    }

    .player-avatar{
        width:180px;
        height:215px;
    }

    .rating-number{
        font-size:50px;
    }

    .card-name span{
        font-size:23px;
    }

    .players-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .mini-card{
        padding:9px;
    }
}
</style>
</head>

<header class="header">

        <div class="logo">L&S <span>FOOTBALL</span></div>
        <div class="coins">🪙 <span id="coins">1,000,000</span></div>
    </div>
</header>

<main class="container">

<section class="auction-box">

    <div id="auctionStatus" class="auction-status">

            <button id="nextPlayer" class="next-btn">

    </div>
</section>


<h2 class="section-title">⭐ جميع اللاعبين — 200 لاعب</h2>

<div class="filters">

</div>

<div id="playersGrid" class="players-grid">
    <div class="loading">

        <div>جاري تجهيز اللاعبين...</div>
    </div>
</div>

</main>


<div id="modal" class="modal">
    <div class="modal-box">
        <button class="close" id="closeModal">×</button>
        <div id="modalContent" class="modal-content"></div>
    </div>
</div>

const playerNames = names.slice(0,200);

const countries = [
    ["🇦🇷","الأرجنتين"],
    ["🇧🇷","البرازيل"],
    ["🇫🇷","فرنسا"],
    ["🇵🇹","البرتغال"],
    ["🇪🇸","إسبانيا"],
    ["🇮🇹","إيطاليا"],
    ["🇩🇪","ألمانيا"],
    ["🇳🇱","هولندا"],
    ["🇬🇧","إنجلترا"],
    ["🇪🇬","مصر"],
    ["🇨🇮","ساحل العاج"],
    ["🇸🇳","السنغال"],
    ["🇲🇦","المغرب"],
    ["🇩🇿","الجزائر"],
    ["🇧🇪","بلجيكا"]
];

const categories = [
    "ICON",
    "ICON",
    "TOTY",
    "TOTY",
    "TOTS",
    "HERO",
    "LEGEND",
    "RARE"
];

const positions = [
    "ST","CF","LW","RW","CAM",
    "CM","CDM","LM","RM",
    "CB","LB","RB","GK"
];


/* =========================================================
   CREATE PLAYERS
========================================================= */

const players = playerNames.map((name,index)=>{

    let category;

    if(index < 50){
        category = "ICON";
    }else if(index < 100){
        category = "TOTY";
    }else if(index < 130){
        category = "TOTS";
    }else if(index < 155){
        category = "HERO";
    }else if(index < 180){
        category = "LEGEND";
    }else{
        category = "RARE";
    }

    let rating;

    if(category==="ICON"){
        rating = 93 + (index % 5);
    }else if(category==="TOTY"){
        rating = 96 + (index % 4);
    }else if(category==="TOTS"){
        rating = 94 + (index % 5);
    }else if(category==="HERO"){
        rating = 91 + (index % 5);
    }else if(category==="LEGEND"){
        rating = 88 + (index % 6);
    }else{
        rating = 84 + (index % 7);
    }

    const country = countries[index % countries.length];

    const position = positions[index % positions.length];

    const pace = Math.min(99,rating - 2 + (index % 7));
    const shoot = Math.min(99,rating - 1 + (index % 6));
    const pass = Math.min(99,rating - 3 + (index % 8));
    const drib = Math.min(99,rating - 2 + (index % 7));
    const defend = Math.min(99,rating - 5 + (index % 10));
    const physical = Math.min(99,rating - 4 + (index % 9));

    return {
        id:index+1,
        name,
        rating,
        category,
        position,
        flag:country[0],
        country:country[1],
        pace,
        shoot,
        pass,
        drib,
        defend,
        physical
    };
});


/* =========================================================
   SAFE AVATAR
   لا يحتاج تحميل صورة من الإنترنت
========================================================= */

function avatarSVG(player){

    const initials = player.name
        .split(" ")
        .filter(Boolean)
        .slice(0,2)
        .map(x=>x[0])
        .join("")
        .toUpperCase();

    let bg="#16263b";

    if(player.category==="ICON") bg="#7b5708";
    if(player.category==="TOTY") bg="#087aa4";
    if(player.category==="TOTS") bg="#69209d";
    if(player.category==="HERO") bg="#91410e";
    if(player.category==="LEGEND") bg="#17647b";
    if(player.category==="RARE") bg="#435b82";

    const svg=`
    <svg xmlns="http://www.w3.org/2000/svg" width="500" height="600">
        <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="${bg}"/>
                <stop offset="1" stop-color="#05080d"/>
            </linearGradient>
        </defs>
        <rect width="500" height="600" fill="url(#g)"/>
        <circle cx="250" cy="190" r="105" fill="#d8a47a"/>
        <path d="M125 180 Q150 65 250 65 Q350 65 375 180 Q330 130 250 135 Q170 130 125 180" fill="#15100d"/>
        <ellipse cx="210" cy="195" rx="10" ry="8" fill="#111"/>
        <ellipse cx="290" cy="195" rx="10" ry="8" fill="#111"/>
        <path d="M215 245 Q250 260 285 245" fill="none" stroke="#542d20" stroke-width="7"/>
        <path d="M80 600 Q95 350 250 340 Q405 350 420 600" fill="${bg}"/>
        <text x="250" y="490" text-anchor="middle" font-size="75" font-family="Arial" font-weight="bold" fill="#fff">${initials}</text>
    </svg>`;

    return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}


/* =========================================================
   CARD HTML
========================================================= */

function createCard(player){

    return `
    <div class="player-card card-${player.category.toLowerCase()}">

        <div class="card-inner">

            <div class="crystal c1"></div>
            <div class="crystal c2"></div>
            <div class="crystal c3"></div>
            <div class="crystal c4"></div>

            <div class="gold-line top"></div>
            <div class="gold-line bottom"></div>

            <div class="card-top">
                <div class="ball-emblem">⚽</div>
            </div>

            <div class="rating">
                <div class="rating-number">${player.rating}</div>
                <div class="position">${player.position}</div>
            </div>

            <div class="card-photo">
                <div class="photo-glow"></div>
                <img
                    class="player-avatar"
                    src="${avatarSVG(player)}"
                    alt="${player.name}">
            </div>

            <div class="card-name">
                <span>${player.name}</span>
            </div>

            <div class="card-type">
                ${player.category}
            </div>

            <div class="flag" style="
                display:flex;
                align-items:center;
                justify-content:center;
                background:#fff;
                font-size:23px;
            ">
                ${player.flag}
            </div>

            <div class="card-footer">

                <div class="stat">
                    <b>${player.pace}</b>
                    <small>PAC</small>
                </div>

                <div class="stat">
                    <b>${player.shoot}</b>
                    <small>SHO</small>
                </div>

                <div class="stat">
                    <b>${player.pass}</b>
                    <small>PAS</small>
                </div>

                <div class="stat">
                    <b>${player.drib}</b>
                    <small>DRI</small>
                </div>

                <div class="stat">
                    <b>${player.defend}</b>
                    <small>DEF</small>
                </div>

                <div class="stat">
                    <b>${player.physical}</b>
                    <small>PHY</small>
                </div>

            </div>

        </div>
    </div>
    `;
}


/* =========================================================
   PLAYERS GRID
========================================================= */

const grid=document.getElementById("playersGrid");

function renderPlayers(filter="all"){

    const list = filter==="all"
        ? players
        : players.filter(p=>p.category===filter);

    if(!list.length){
        grid.innerHTML=`<div class="empty">لا يوجد لاعبين</div>`;
        return;
    }

    grid.innerHTML=list.map(player=>`

        <div class="mini-card" data-id="${player.id}">

            <div class="mini-top">

                <img
                    class="mini-avatar"
                    src="${avatarSVG(player)}"
                    alt="${player.name}">

                <div>
                    <div class="mini-rating">${player.rating}</div>
                    <div>${player.position}</div>
                </div>

            </div>

            <div class="mini-name">
                ${player.name}
            </div>

            <div class="mini-meta">
                <span>${player.flag} ${player.country}</span>
                <span>${player.category}</span>
            </div>

            <div class="badge">
                اضغط لعرض الكارت
            </div>

        </div>

    `).join("");
}

renderPlayers();


/* =========================================================
   FILTERS
========================================================= */

document.querySelectorAll(".filter").forEach(button=>{

    button.addEventListener("click",()=>{

        document.querySelectorAll(".filter")
            .forEach(x=>x.classList.remove("active"));

        button.classList.add("active");

        renderPlayers(button.dataset.filter);
    });

});


/* =========================================================
   PLAYER MODAL
========================================================= */

const modal=document.getElementById("modal");
const modalContent=document.getElementById("modalContent");

grid.addEventListener("click",e=>{

    const card=e.target.closest(".mini-card");

    if(!card)return;

    const id=Number(card.dataset.id);

    const player=players.find(p=>p.id===id);

    if(!player)return;

    modalContent.innerHTML=`

        ${createCard(player)}

        <div class="details">

            <h2>${player.name}</h2>

            <p style="color:#aab6c8;margin-bottom:20px">
                ${player.flag} ${player.country}
            </p>

            <div class="details-grid">

                <div class="detail">
                    <b>${player.pace}</b>
                    السرعة
                </div>

                <div class="detail">
                    <b>${player.shoot}</b>
                    التسديد
                </div>

                <div class="detail">
                    <b>${player.pass}</b>
                    التمرير
                </div>

                <div class="detail">
                    <b>${player.drib}</b>
                    المراوغة
                </div>

                <div class="detail">
                    <b>${player.defend}</b>
                    الدفاع
                </div>

                <div class="detail">
                    <b>${player.physical}</b>
                    القوة
                </div>

            </div>

        </div>
    `;

    modal.classList.add("show");
});


document.getElementById("closeModal")
.addEventListener("click",()=>{
    modal.classList.remove("show");
});


modal.addEventListener("click",e=>{
    if(e.target===modal){
        modal.classList.remove("show");
    }
});


/* =========================================================
   AUCTION
========================================================= */

let auctionPlayer=null;
let currentBid=0;

let coins=1000000;

const coinsElement=document.getElementById("coins");
const auctionStatus=document.getElementById("auctionStatus");
const auctionContent=document.getElementById("auctionContent");
const auctionCard=document.getElementById("auctionCard");
const bidValue=document.getElementById("bidValue");


function updateCoins(){

    coinsElement.textContent=
        coins.toLocaleString("en-US");

}


/*
   مهم:
   المزاد هنا لا ينتظر Firebase
   ولا ينتظر fetch
   ولا ينتظر API
   لذلك لن يعلق على "جاري تحميل المزاد".
*/

function startAuction(){

    const randomIndex=
        Math.floor(Math.random()*players.length);

    auctionPlayer=players[randomIndex];

    /*
       سعر البداية حسب قوة اللاعب
    */

    currentBid=
        Math.max(
            1000,
            (auctionPlayer.rating-75)*2500
        );

    auctionCard.innerHTML=
        createCard(auctionPlayer);

    bidValue.textContent=
        currentBid.toLocaleString("en-US");

    auctionStatus.innerHTML=
        `🔥 المزاد مفتوح الآن على <b>${auctionPlayer.name}</b>`;

    auctionContent.classList.add("show");

    document.getElementById("startAuction")
        .textContent="🔄 لاعب جديد";

}


document.getElementById("startAuction")
.addEventListener("click",startAuction);


/* =========================================================
   BIDDING
========================================================= */

document.querySelectorAll(".bid-btn")
.forEach(button=>{

    button.addEventListener("click",()=>{

        if(!auctionPlayer){
            auctionStatus.textContent=
                "ابدأ المزاد أولاً";
            return;
        }

        const add=
            Number(button.dataset.add);

        const newBid=
            currentBid+add;

        if(newBid>coins){

            auctionStatus.innerHTML=
                "❌ رصيدك لا يكفي لهذه المزايدة";

            return;
        }

        currentBid=newBid;

        bidValue.textContent=
            currentBid.toLocaleString("en-US");

        auctionStatus.innerHTML=
            `🔥 أعلى مزايدة حالية: <b>${currentBid.toLocaleString("en-US")}</b> 🪙`;

    });

});


/* =========================================================
   NEXT PLAYER
========================================================= */

document.getElementById("nextPlayer")
.addEventListener("click",()=>{

    startAuction();

});


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",e=>{

    if(e.key==="Escape"){
        modal.classList.remove("show");
    }

});


/* =========================================================
   INITIALIZATION
========================================================= */

document.addEventListener("DOMContentLoaded",()=>{

    /*
       تشغيل فوري بدون أي تحميل خارجي
    */

    renderPlayers();
    updateCoins();

    auctionStatus.innerHTML=
        "✅ المزاد جاهز — اضغط «بدء المزاد»";

});


</script>
