<style>
body{background:#0a5c36;color:#fff;font-family:'Cairo',sans-serif;text-align:center;padding:10px}
.stats{display:flex;justify-content:space-around;background:rgba(17,17,17,0.9);padding:10px;border-radius:10px;margin-bottom:10px}
.p1{color:#00aaff}.p2{color:#ff4444}
.turn{background:#ffd700;color:#000;padding:8px;border-radius:8px;font-weight:bold;margin:10px;font-weight:700}
.timer{font-size:24px;color:#0f0;font-weight:900;background:rgba(0,0,0,0.7);padding:10px;border-radius:10px;margin:10px}
.field-container{display:flex;justify-content:center;gap:25px;margin-top:40px;flex-wrap:wrap}
.pitch{width:420px;height:600px;background:#0a5c36;border:3px solid #fff;border-radius:10px;position:relative;overflow:hidden;margin-top:10px}
.pitch::before{content:'';position:absolute;top:45%;left:0;width:100%;height:2px;background:#fff}
.pitch::after{content:'';position:absolute;top:45%;left:50%;width:100px;height:100px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}
.penalty{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:260px;height:130px;border:2px solid #fff;border-bottom:none}
.goal{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:130px;height:45px;border:2px solid #fff;border-bottom:none}
.team-title{padding:8px;font-weight:900;font-size:17px;border-radius:8px 8px 0 0;margin-bottom:5px}
.team-title.blue{background:#00aaff;color:#000}
.team-title.red{background:#ff4444;color:#fff}
.player-spot{position:absolute;width:90px;text-align:center;transform:translate(-50%,-50%)}
.player-spot img{width:58px;height:58px;border-radius:50%;border:3px solid #fff;object-fit:cover;background:#222}
.player-spot.name{font-size:11px;font-weight:900;margin-top:3px;text-shadow:1px 1px 3px #000;color:#ffd700}
.player-spot.pos-label{font-size:9px;color:#fff;font-weight:700;position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);padding:1px 5px;border-radius:4px}
.player-spot.empty img{opacity:0.2;border:2px dashed #888}
.pos-GK{bottom:-0.01%;left:50%}.pos-CB1{bottom:6%;left:33%}.pos-CB2{bottom:6%;left:67%}.pos-LB{bottom:15%;left:15%}.pos-RB{bottom:15%;left:85%}
.pos-CM1{bottom:30%;left:32%}.pos-CM2{bottom:30%;left:68%}.pos-CAM{bottom:45%;left:50%}.pos-LW{bottom:63%;left:14%}.pos-ST{bottom:67%;left:50%}.pos-RW{bottom:63%;left:86%}
.card{border:3px solid #ffd700;border-radius:15px;padding:15px;width:360px;margin:15px auto;background:rgba(17,17,17,0.95)}
.card img{width:110px;height:110px;border-radius:50%;border:3px solid #ffd700;object-fit:cover;margin-bottom:10px}
.pos{color:#aaa;font-size:14px;font-weight:400}
.name{font-size:24px;color:#ffd700;margin:5px;font-weight:900}
.price{font-size:18px;color:#0f0;font-weight:700}
input{width:140px;padding:8px;border-radius:8px;border:2px solid #ffd700;background:#222;color:#fff;text-align:center;font-family:'Cairo'}
button{padding:10px 15px;margin:4px;border:none;border-radius:8px;font-weight:900;cursor:pointer;font-family:'Cairo';font-size:16px}
.bid{background:lime;color:#000}.take{background:red;color:#fff}.skip{background:#555;color:#fff}
button:disabled{opacity:0.5;cursor:not-allowed}
.result{font-size:28px;font-weight:900;color:#ffd700;background:rgba(0,0,0,0.8);padding:20px;border-radius:15px;margin:20px}
.tag{font-size:10px;padding:2px 5px;border-radius:4px;margin-left:5px}
.legend{background:gold;color:#000}.current{background:#00aaff;color:#fff}

  })
}
drawPitch();

const roomRef = db.ref('rooms/' + type + '/' + room);
roomRef.on('value', async (snapshot) => {
  let data = snapshot.val()
  if(!data) return;
  document.getElementById('name1').innerText = data.player1?.name || 'الازرق';
  document.getElementById('name2').innerText = data.player2?.name || 'الاحمر';
  document.getElementById('team1Title').innerText = data.player1?.name || 'الفريق الازرق';
  document.getElementById('team2Title').innerText = data.player2?.name || 'الفريق الاحمر';
  await loadData(data);
})

async function loadData(data){
  currentPosIndex=data.currentPos||0;currentBid=data.currentBid||0;highestBidder=data.highestBidder||0;turn=data.turn||1;starter=data.starter||1;
  m1=data.m1 || 200000000;m2=data.m2 || 200000000;
  t1=data.t1 || {};t2=data.t2 || {};currentPlayer=data.currentPlayer || null;filled1=data.filled1 || {};filled2=data.filled2 || {};
  usedPlayers = data.usedPlayers || {};
  availablePlayers = data.availablePlayers || JSON.parse(JSON.stringify(playersDB));

  let currentPos = positions[currentPosIndex];

  if(currentPosIndex >= 11 && amIHost){
    showWinner();
    return;
  }

  if(filled1[currentPos] && filled2[currentPos] &&!timerInterval && amIHost){
    startTimer();
    return;
  }

  if(!currentPlayer &&!filled1[currentPos] &&!filled2[currentPos] && amIHost) newPlayer();
  await updatePitch();show();
}

function startTimer(){
  document.getElementById('auctionCard').style.display='none';
  document.getElementById('timer').style.display='block';
  let count=3;
  timerInterval = setInterval(()=>{
    document.getElementById('timer').innerText=`المركز القادم: ${positions[currentPosIndex+1]} بعد ${count} ثواني`;
    count--;
    if(count<0){
      clearInterval(timerInterval);
      timerInterval=null;
      document.getElementById('timer').style.display='none';
      document.getElementById('auctionCard').style.display='block';
      roomRef.update({currentPos: currentPosIndex + 1})
    }
  },1000)
}

function getRandomPlayer(pos){
  if(!availablePlayers[pos] || availablePlayers[pos].length === 0) {
    availablePlayers[pos] = JSON.parse(JSON.stringify(playersDB[pos]));
  }
  let data = availablePlayers[pos];
  let player = data[Math.floor(Math.random()*data.length)];
  return player;
}

function removePlayerFromPool(pos, playerName){
  if(!availablePlayers[pos]) return;
  availablePlayers[pos] = availablePlayers[pos].filter(p => p.n!== playerName);
  usedPlayers[playerName] = true;
}

function newPlayer(){
  let posName=positions[currentPosIndex];
  let p = getRandomPlayer(posName);
  removePlayerFromPool(posName, p.n);
  roomRef.update({ currentBid: p.p, currentPlayer: p, usedPlayers, availablePlayers })
}

async function show(){
  if(!currentPlayer) return;
  let tag = currentPlayer.tag === 'legend'? '<span class="tag legend">اسطوري</span>' : '<span class="tag current">حالي</span>';
  document.getElementById('pos').innerHTML="المركز: " + positions[currentPosIndex];
  document.getElementById('name').innerHTML=currentPlayer.n + tag;
  document.getElementById('playerImg').src = getPlayerImg(currentPlayer.n);
  document.getElementById('price').innerText="السعر: "+currentBid.toLocaleString()+"$";
  document.getElementById('bidInput').value=currentBid+1000000;
  let myTurn = turn==myPlayer;
  document.getElementById('bidBtn').disabled =!myTurn;
  document.getElementById('takeBtn').disabled =!myTurn;
  document.getElementById('turn').innerText="دور المزايدة: " + (turn==1?document.getElementById('name1').innerText:document.getElementById('name2').innerText) + (myTurn?" - دورك":"");
}

function bid(){if(turn!=myPlayer) return;let val=parseInt(document.getElementById('bidInput').value);let money=myPlayer==1?m1:m2;
  if(isNaN(val)){alert("اكتب رقم");return}if(val<=currentBid){alert("لازم تعلي");return}if(val>money){alert("مفيش فلوس");return}
  roomRef.update({currentBid:val, highestBidder:myPlayer, turn:myPlayer==1?2:1});
}

function take(){
  if(turn!=myPlayer) return;
  let pos = positions[currentPosIndex];
  let taker = highestBidder || myPlayer; // المهم مين اعلى مزايدة
  let other = taker==1? 2 : 1;

  let updates={};
  // اللي دفع الفلوس ياخد اللاعب
  if(taker==1){
    updates["m1"]=m1-currentBid;
    updates["t1/"+pos]=currentPlayer;
    updates["filled1/"+pos]=true;
  } else {
    updates["m2"]=m2-currentBid;
    updates["t2/"+pos]=currentPlayer;
    updates["filled2/"+pos]=true;
  }

  // التاني ياخد لاعب عشوائي
  let randomPlayer = getRandomPlayer(pos);
  removePlayerFromPool(pos, randomPlayer.n);
  if(other==1){
    updates["t1/"+pos]=randomPlayer;
    updates["filled1/"+pos]=true;
  } else {
    updates["t2/"+pos]=randomPlayer;
    updates["filled2/"+pos]=true;
  }

  updates["currentPlayer"]=null;updates["currentBid"]=0;updates["highestBidder"]=0;
  updates["usedPlayers"]=usedPlayers; updates["availablePlayers"]=availablePlayers;
  roomRef.update(updates);
}

function skip(){
  if(turn!=myPlayer) return;
  let pos = positions[currentPosIndex];
  let p1 = getRandomPlayer(pos); removePlayerFromPool(pos, p1.n);
  let p2 = getRandomPlayer(pos); removePlayerFromPool(pos, p2.n);

  let updates={};
  updates["t1/"+pos]=p1;
  updates["t2/"+pos]=p2;
  updates["filled1/"+pos]=true;
  updates["filled2/"+pos]=true;
  updates["currentPlayer"]=null;
  updates["usedPlayers"]=usedPlayers; updates["availablePlayers"]=availablePlayers;
  roomRef.update(updates);
}

function showWinner(){
  document.getElementById('auctionCard').style.display='none';
  document.getElementById('timer').style.display='none';
  let score1=0, score2=0;
  positions.forEach(pos=>{
    if(t1[pos]) score1 += t1[pos].r || 80;
    if(t2[pos]) score2 += t2[pos].r || 80;
  })
  let result = "";
  if(score1 > score2) result = `🏆 ${document.getElementById('name1').innerText} كسب! ${score1} - ${score2}`;
  else if(score2 > score1) result = `🏆 ${document.getElementById('name2').innerText} كسب! ${score2} - ${score1}`;
  else result = `تعادل! ${score1} - ${score2}`;
  document.getElementById('result').innerHTML = `<div class="result">${result}<br><small>التقييم حسب قوة اللعيبة</small></div>`;
}

async function updatePitch(){
  document.getElementById('m1').innerText=m1.toLocaleString();document.getElementById('m2').innerText=m2.toLocaleString();
  document.getElementById('count').innerText=(currentPosIndex+1)+" / 11";
  for(let pos of positions){
    if(t1[pos]){
      document.getElementById('p1-'+pos).innerHTML=`<div class="pos-label">${pos}</div><img src="${getPlayerImg(t1[pos].n)}"><div class="name">${t1[pos].n}</div>`;
      document.getElementById('p1-'+pos).classList.remove('empty');
    }
    if(t2[pos]){
      document.getElementById('p2-'+pos).innerHTML=`<div class="pos-label">${pos}</div><img src="${getPlayerImg(t2[pos].n)}"><div class="name">${t2[pos].n}</div>`;
      document.getElementById('p2-'+pos).classList.remove('empty');
    }
  }
}
</script>
