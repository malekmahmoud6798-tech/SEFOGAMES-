<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>مزاد النجوم - Ultimate</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>

/* =====================================================
GENERAL
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:'Cairo',sans-serif;
    color:#fff;
    text-align:center;
    overflow-x:hidden;

    background:
    radial-gradient(circle at 50% 0%,#183f33 0%,#071511 35%,#020504 100%);
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.15;

    background-image:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);

    background-size:35px 35px;
}

h1{
    margin:0;
    padding:18px 10px 8px;

    font-size:clamp(22px,5vw,40px);

    font-family:'Orbitron','Cairo',sans-serif;

    background:
    linear-gradient(
        90deg,
        #fff,
        #ffd700,
        #fff,
        #ffd700
    );

    background-size:300%;

    -webkit-background-clip:text;
    color:transparent;

    animation:titleMove 5s linear infinite;
}

@keyframes titleMove{

    0%{
        background-position:0%;
    }

    100%{
        background-position:300%;
    }

}

.app{
    width:min(1450px,96%);
    margin:auto;
}

/* =====================================================
STATS
===================================================== */

.stats{

    display:grid;

    grid-template-columns:
    1fr
    auto
    1fr;

    gap:10px;

    align-items:center;

    margin:15px auto;

    padding:12px;

    border-radius:18px;

    border:1px solid rgba(255,215,0,.35);

    background:
    linear-gradient(
        135deg,
        rgba(20,25,24,.95),
        rgba(5,8,7,.95)
    );

    box-shadow:
    0 15px 50px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.08);
}

.money-box{

    padding:12px;

    border-radius:14px;

    font-size:15px;

    font-weight:900;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.08);
}

.money-box.blue{

    color:#56c7ff;

}

.money-box.red{

    color:#ff7474;

}

.money-value{

    display:block;

    margin-top:4px;

    color:#fff;

    font-family:'Orbitron';

    font-size:18px;
}

#count{

    padding:10px 15px;

    border-radius:50px;

    color:#111;

    font-family:'Orbitron';

    font-weight:900;

    background:
    linear-gradient(
        135deg,
        #fff7b0,
        #ffd700,
        #c98700
    );
}

/* =====================================================
TURN
===================================================== */

.turn{

    margin:10px auto 18px;

    width:min(600px,95%);

    padding:12px 18px;

    border-radius:14px;

    font-weight:900;

    background:
    linear-gradient(
        135deg,
        #17231f,
        #0a0f0d
    );

    border:1px solid rgba(255,215,0,.4);
}

/* =====================================================
FIELDS
===================================================== */

.field-container{

    display:grid;

    grid-template-columns:
    repeat(2,minmax(300px,1fr));

    gap:25px;

    margin:25px auto;

    align-items:start;
}

.team-wrap{

    border-radius:20px;

    overflow:hidden;

    background:#07100c;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 20px 50px rgba(0,0,0,.4);
}

.team-title{

    padding:13px;

    font-size:18px;

    font-weight:900;
}

.team-title.blue{

    background:
    linear-gradient(
        90deg,
        #0077aa,
        #00aaff,
        #006699
    );
}

.team-title.red{

    background:
    linear-gradient(
        90deg,
        #a40000,
        #ff3333,
        #990000
    );
}

.pitch{

    width:100%;

    aspect-ratio:7/9;

    position:relative;

    overflow:hidden;

    background:

    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.025) 0,
        rgba(255,255,255,.025) 10%,
        transparent 10%,
        transparent 20%
    ),

    linear-gradient(
        180deg,
        #168b49,
        #0b542d
    );
}

.pitch::before{

    content:"";

    position:absolute;

    top:45%;

    left:0;

    width:100%;

    height:2px;

    background:rgba(255,255,255,.7);
}

.pitch::after{

    content:"";

    position:absolute;

    top:45%;

    left:50%;

    width:100px;

    height:100px;

    border:2px solid rgba(255,255,255,.7);

    border-radius:50%;

    transform:translate(-50%,-50%);
}

.penalty{

    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:60%;

    height:22%;

    border:
    2px solid rgba(255,255,255,.8);

    border-bottom:none;
}

.goal{

    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:28%;

    height:7%;

    border:
    2px solid rgba(255,255,255,.9);

    border-bottom:none;
}

/* =====================================================
PLAYER ON FIELD
===================================================== */

.player-spot{

    position:absolute;

    width:82px;

    transform:translate(-50%,-50%);

    text-align:center;

    z-index:5;
}

.pos-label{

    position:absolute;

    top:-12px;

    left:50%;

    transform:translateX(-50%);

    padding:2px 6px;

    border-radius:8px;

    background:rgba(0,0,0,.7);

    font-size:9px;

    font-family:'Orbitron';

    z-index:10;
}

.mini-card{

    width:64px;

    height:76px;

    margin:auto;

    position:relative;

    overflow:hidden;

    border-radius:10px;

    display:flex;

    flex-direction:column;

    justify-content:flex-end;

    padding:5px;

    border:2px solid #777;

    box-shadow:
    0 8px 15px rgba(0,0,0,.4);

    transition:.3s;
}

.mini-card:hover{

    transform:
    translateY(-5px)
    scale(1.08);
}

.mini-card::before{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.2),
        transparent 45%
    );
}

.mini-card.empty{

    opacity:.3;

    filter:grayscale(1);

    background:#222;

    border-style:dashed;
}

.mini-rating{

    position:absolute;

    top:5px;

    right:6px;

    font-family:'Orbitron';

    font-size:12px;

    font-weight:900;
}

.mini-pos{

    position:absolute;

    top:20px;

    right:6px;

    font-size:8px;

    font-weight:900;
}

.mini-name{

    position:relative;

    z-index:2;

    font-size:8px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

/* =====================================================
CARD
===================================================== */

.card-area{

    display:flex;

    justify-content:center;

    margin:25px auto 40px;
}

.player-card{

    width:min(360px,92vw);

    min-height:530px;

    position:relative;

    overflow:hidden;

    border-radius:28px;

    padding:20px;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    animation:cardEnter .6s ease;

    box-shadow:
    0 30px 70px rgba(0,0,0,.55);
}

@keyframes cardEnter{

    0%{

        opacity:0;

        transform:
        scale(.75)
        rotateY(30deg);

    }

    100%{

        opacity:1;

        transform:
        scale(1)
        rotateY(0);

    }

}

.card-gold{

    background:
    radial-gradient(
        circle at 50% 20%,
        #fff4a3,
        #dba700 40%,
        #8d5b00 100%
    );

    border:3px solid #fff0a6;

    color:#181000;

    box-shadow:
    0 0 35px rgba(255,215,0,.4),
    0 30px 60px rgba(0,0,0,.5);
}

.card-icon{

    background:
    radial-gradient(
        circle at 50% 20%,
        #fffdf0,
        #e6c878 45%,
        #7e5a1c 100%
    );

    border:3px solid #fff4bc;

    color:#1a1300;

    box-shadow:
    0 0 50px rgba(255,215,0,.55),
    0 30px 70px rgba(0,0,0,.55);
}

.card-goat{

    background:
    radial-gradient(
        circle at 50% 10%,
        #fff,
        #ffd700 25%,
        #7a00ff 58%,
        #090014 100%
    );

    border:3px solid #fff;

    color:#fff;

    box-shadow:
    0 0 25px #fff,
    0 0 50px #ffd700,
    0 0 90px #7a00ff,
    0 30px 70px rgba(0,0,0,.6);

    animation:
    cardEnter .6s ease,
    goatGlow 2s infinite alternate;
}

@keyframes goatGlow{

    from{

        box-shadow:
        0 0 25px #fff,
        0 0 45px #ffd700,
        0 0 70px #7a00ff;

    }

    to{

        box-shadow:
        0 0 35px #fff,
        0 0 70px #ffd700,
        0 0 110px #7a00ff;

    }

}

.card-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    position:relative;

    z-index:2;
}

.rating{

    font-family:'Orbitron';

    font-size:48px;

    font-weight:900;

    line-height:1;
}

.position{

    font-family:'Orbitron';

    font-size:17px;

    font-weight:900;

    margin-top:5px;
}

.card-type{

    padding:7px 12px;

    border-radius:20px;

    font-size:11px;

    font-weight:900;

    background:rgba(0,0,0,.15);

    border:1px solid rgba(255,255,255,.35);
}

.player-photo{

    width:220px;

    height:220px;

    margin:auto;

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:center;
}

.player-photo img{

    width:100%;

    height:100%;

    object-fit:cover;

    border-radius:50%;

    border:5px solid rgba(255,255,255,.65);

    box-shadow:
    0 20px 30px rgba(0,0,0,.25);
}

.player-name{

    position:relative;

    z-index:2;

    font-family:'Orbitron','Cairo';

    font-size:28px;

    font-weight:900;

    text-align:center;

    margin-top:5px;
}

.card-price{

    position:relative;

    z-index:2;

    text-align:center;

    margin-top:8px;

    font-family:'Orbitron';

    font-size:20px;

    font-weight:900;
}

/* =====================================================
CONTROLS
===================================================== */

.controls{

    position:relative;

    z-index:5;

    width:min(450px,95%);

    margin:18px auto;

    padding:18px;

    border-radius:22px;

    background:
    linear-gradient(
        145deg,
        rgba(20,25,24,.96),
        rgba(4,6,5,.98)
    );

    border:1px solid rgba(255,215,0,.35);

    box-shadow:
    0 20px 60px rgba(0,0,0,.4);
}

#bidInput{

    width:100%;

    padding:14px;

    margin-bottom:10px;

    border-radius:12px;

    border:2px solid #d5aa19;

    outline:none;

    background:#080b0a;

    color:#fff;

    text-align:center;

    font-family:'Orbitron';

    font-size:16px;
}

.buttons{

    display:grid;

    grid-template-columns:
    1fr 1fr 1fr;

    gap:8px;
}

button{

    padding:13px 8px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-family:'Cairo';

    font-weight:900;

    font-size:14px;

    transition:.2s;
}

button:hover:not(:disabled){

    transform:translateY(-3px);

    filter:brightness(1.12);
}

button:active:not(:disabled){

    transform:scale(.96);
}

button:disabled{

    opacity:.4;

    cursor:not-allowed;
}

.bid{

    background:
    linear-gradient(
        135deg,
        #50ff85,
        #00a43a
    );

    color:#001b09;
}

.take{

    background:
    linear-gradient(
        135deg,
        #ff5252,
        #a80000
    );

    color:#fff;
}

.skip{

    background:
    linear-gradient(
        135deg,
        #555,
        #222
    );

    color:#fff;
}

/* =====================================================
TIMER
===================================================== */

.timer{

    display:none;

    width:min(500px,92%);

    margin:20px auto;

    padding:20px;

    border-radius:20px;

    font-family:'Orbitron';

    font-size:22px;

    color:#ffd700;

    background:#090b0a;

    border:1px solid #d5aa19;
}

.result{

    width:min(700px,94%);

    margin:25px auto;

    padding:25px;

    border-radius:25px;

    font-size:28px;

    font-weight:900;

    color:#ffd700;

    background:
    linear-gradient(
        145deg,
        #121513,
        #050605
    );

    border:2px solid #ffd700;

    box-shadow:
    0 0 40px rgba(255,215,0,.2);
}

/* =====================================================
POSITIONS
===================================================== */

.pos-GK{
    bottom:7%;
    left:50%;
}

.pos-CB1{
    bottom:20%;
    left:33%;
}

.pos-CB2{
    bottom:20%;
    left:67%;
}

.pos-LB{
    bottom:31%;
    left:14%;
}

.pos-RB{
    bottom:31%;
    left:86%;
}

.pos-CM1{
    bottom:45%;
    left:32%;
}

.pos-CM2{
    bottom:45%;
    left:68%;
}

.pos-CAM{
    bottom:58%;
    left:50%;
}

.pos-LW{
    bottom:76%;
    left:14%;
}

.pos-ST{
    bottom:80%;
    left:50%;
}

.pos-RW{
    bottom:76%;
    left:86%;
}

/* =====================================================
MATCH RESULT
===================================================== */

.match-result{

    width:min(1100px,96%);

    margin:35px auto 70px;

    padding:25px;

    border-radius:30px;

    background:

    radial-gradient(
        circle at 50% 0%,
        rgba(255,215,0,.14),
        transparent 40%
    ),

    linear-gradient(
        145deg,
        #101715,
        #030605
    );

    border:2px solid rgba(255,215,0,.45);

    box-shadow:
    0 30px 90px rgba(0,0,0,.65),
    0 0 50px rgba(255,215,0,.12);

    animation:matchEnter .8s ease;
}

@keyframes matchEnter{

    from{

        opacity:0;

        transform:
        scale(.88)
        translateY(30px);

    }

    to{

        opacity:1;

        transform:
        scale(1)
        translateY(0);

    }

}

.match-header{

    font-family:'Orbitron';

    font-size:14px;

    color:#ffd700;

    letter-spacing:2px;

    margin-bottom:18px;
}

.match-teams{

    display:grid;

    grid-template-columns:
    1fr
    auto
    1fr;

    gap:15px;

    align-items:center;
}

.match-team{

    padding:18px;

    border-radius:22px;

    min-height:120px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    font-weight:900;
}

.match-team.blue{

    background:
    linear-gradient(
        145deg,
        rgba(0,170,255,.22),
        rgba(0,75,120,.12)
    );

    border:1px solid rgba(0,170,255,.45);
}

.match-team.red{

    background:
    linear-gradient(
        145deg,
        rgba(255,50,50,.22),
        rgba(120,0,0,.12)
    );

    border:1px solid rgba(255,60,60,.45);
}

.team-name-result{

    font-size:20px;

    margin-bottom:8px;
}

.team-score{

    font-family:'Orbitron';

    font-size:55px;

    line-height:1;

}

.vs{

    font-family:'Orbitron';

    font-size:20px;

    color:#ffd700;

}

.winner-badge{

    display:inline-block;

    margin-top:8px;

    padding:4px 12px;

    border-radius:20px;

    background:#ffd700;

    color:#111;

    font-size:11px;

}

.match-score-title{

    margin:25px 0 15px;

    font-size:18px;

    font-weight:900;

}

.stats-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

}

.match-stat{

    padding:14px;

    border-radius:15px;

    background:rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.07);
}

.stat-label{

    display:block;

    font-size:12px;

    color:#bbb;

    margin-bottom:8px;
}

.stat-values{

    display:grid;

    grid-template-columns:
    1fr
    auto
    1fr;

    align-items:center;

    gap:8px;

    font-family:'Orbitron';

    font-size:18px;
}

.stat-values .blue-value{

    color:#56c7ff;

    text-align:right;
}

.stat-values .red-value{

    color:#ff7474;

    text-align:left;
}

.stat-values .icon{

    font-family:'Cairo';

    font-size:13px;

}

.possession{

    grid-column:1/-1;
}

.possession-bar{

    height:16px;

    width:100%;

    display:flex;

    overflow:hidden;

    border-radius:20px;

    background:#222;

    margin-top:10px;
}

.pos-blue{

    height:100%;

    background:
    linear-gradient(
        90deg,
        #0077aa,
        #00c8ff
    );
}

.pos-red{

    height:100%;

    background:
    linear-gradient(
        90deg,
        #ff3333,
        #a00000
    );
}

.possession-numbers{

    display:flex;

    justify-content:space-between;

    margin-top:7px;

    font-family:'Orbitron';

    font-size:13px;
}

.match-man{

    margin-top:20px;

    padding:18px;

    border-radius:20px;

    background:
    linear-gradient(
        135deg,
        rgba(255,215,0,.13),
        rgba(255,255,255,.03)
    );

    border:1px solid rgba(255,215,0,.3);
}

.man-title{

    color:#ffd700;

    font-size:12px;

    font-weight:900;
}

.man-name{

    font-family:'Orbitron';

    font-size:22px;

    margin-top:5px;
}

.formations{

    margin-top:25px;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:20px;
}

.formation-box{

    padding:15px;

    border-radius:20px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.07);
}

.formation-title{

    font-weight:900;

    margin-bottom:12px;
}

.formation-list{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:7px;
}

.formation-player{

    padding:7px;

    border-radius:9px;

    background:rgba(0,0,0,.25);

    font-size:10px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

/* =====================================================
MOBILE
===================================================== */

@media(max-width:900px){

    .field-container{

        grid-template-columns:1fr;

        width:min(500px,96%);

    }

    .stats{

        grid-template-columns:1fr;

    }

    #count{

        order:-1;

        justify-self:center;
    }

}

@media(max-width:600px){

    .match-result{

        padding:12px;

    }

    .match-teams{

        gap:7px;

    }

    .match-team{

        padding:12px 5px;

        min-height:100px;

    }

    .team-name-result{

        font-size:14px;

    }

    .team-score{

        font-size:42px;

    }

    .stats-grid{

        grid-template-columns:1fr;

    }

    .possession{

        grid-column:auto;

    }

    .formations{

        grid-template-columns:1fr;

    }

    .formation-list{

        grid-template-columns:1fr 1fr;
    }

}


/* =====================================================
   FIFA MOBILE / ULTIMATE TEAM CARD UPGRADE
===================================================== */
.player-card{
    isolation:isolate;
    min-height:560px;
    border-radius:34px 34px 42px 42px;
    clip-path:polygon(7% 0,93% 0,100% 7%,96% 93%,84% 100%,16% 100%,4% 93%,0 7%);
    padding:22px 28px 28px;
}
.player-card::before{
    content:"";
    position:absolute; inset:8px;
    z-index:-1;
    border:1px solid rgba(255,255,255,.55);
    clip-path:inherit;
    pointer-events:none;
}
.player-card::after{
    content:"";
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(125deg,rgba(255,255,255,.34),transparent 25%,transparent 70%,rgba(0,0,0,.25));
}
.card-top,.player-photo,.player-name,.card-price{z-index:2}
.player-photo{
    width:100%; height:315px; margin:-4px auto 0;
    align-items:flex-end;
    overflow:hidden;
    border-radius:0 0 42% 42%;
}
.player-photo::before{
    content:""; position:absolute; width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,.08) 58%,transparent 70%);
    top:5px; left:50%; transform:translateX(-50%); opacity:.75;
}
.player-photo img{
    position:relative; z-index:1;
    width:100%; height:100%; object-fit:contain; object-position:center bottom;
    border:0; border-radius:0; box-shadow:none;
    filter:drop-shadow(0 18px 18px rgba(0,0,0,.4));
}

function playMoneySound(){

try{

if(!audioContext){

audioContext=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

const now=
audioContext.currentTime;

const oscillator=
audioContext.createOscillator();

const gain=
audioContext.createGain();

oscillator.type="sine";

oscillator.frequency.setValueAtTime(
520,
now
);

oscillator.frequency.exponentialRampToValueAtTime(
180,
now+.25
);

gain.gain.setValueAtTime(
.001,
now
);

gain.gain.exponentialRampToValueAtTime(
.35,
now+.03
);

gain.gain.exponentialRampToValueAtTime(
.001,
now+.3
);

oscillator.connect(gain);

gain.connect(
audioContext.destination
);

oscillator.start(now);

oscillator.stop(
now+.32
);

}catch(e){}

}

function bid(){

const val=parseInt(document.getElementById('bidInput').value,10);
if(!Number.isFinite(val)){
 alert("اكتب رقم صحيح");
 return;
}

roomRef.transaction(data=>{
 if(!data || !data.currentPlayer) return;
 const liveTurn=data.turn||1;
 const liveBid=data.currentBid||0;
 const liveMoney=myPlayer===1 ? (data.m1??200000000) : (data.m2??200000000);
 if(liveTurn!==myPlayer){
   alert("مش دورك في المزايدة دلوقتي");
   return;
 }
 if(val<=liveBid){
   alert("لازم تزود عن السعر الحالي");
   return;
 }
 if(val>liveMoney){
   alert("مفيش فلوس كفاية");
   return;
 }
 data.currentBid=val;
 data.highestBidder=myPlayer;
 data.turn=myPlayer===1?2:1;
 return data;
},(error,committed)=>{
 if(!error && committed) playMoneySound();
});

}

/* =====================================================
MATCH RESULT GENERATOR
===================================================== */

function createMatchResult(){

/*
    بنحسب قوة كل فريق
*/

let power1=0;

let power2=0;

positions.forEach(pos=>{

power1+=
t1[pos]?.r||
80;

power2+=
t2[pos]?.r||
80;

});


/*
    فرق القوة
*/

const totalPower=
power1+power2;

let possession1=
Math.round(
50+
((power1-power2)/totalPower)*35+
(Math.random()*6-3)
);

possession1=
Math.max(
35,
Math.min(
65,
possession1
)
);

const possession2=
100-possession1;


/*
    الأهداف
*/

const strengthDifference=
power1-power2;

let goals1=
Math.round(
2+
strengthDifference/40+
(Math.random()*3-1.5)
);

let goals2=
Math.round(
2-
strengthDifference/40+
(Math.random()*3-1.5)
);

goals1=
Math.max(
0,
Math.min(7,goals1)
);

goals2=
Math.max(
0,
Math.min(7,goals2)
);


/*
    تسديدات
*/

const shots1=
Math.max(
goals1+2,
Math.round(
8+
power1/14+
Math.random()*6
)
);

const shots2=
Math.max(
goals2+2,
Math.round(
8+
power2/14+
Math.random()*6
)
);

const onTarget1=
Math.min(
shots1,
Math.max(
goals1,
Math.round(shots1*(.35+Math.random()*.25))
)
);

const onTarget2=
Math.min(
shots2,
Math.max(
goals2,
Math.round(shots2*(.35+Math.random()*.25))
)
);


/*
    ركنيات
*/

const corners1=
Math.max(
1,
Math.round(
2+
possession1/15+
Math.random()*3
)
);

const corners2=
Math.max(
1,
Math.round(
2+
possession2/15+
Math.random()*3
)
);


/*
    بطاقات
*/

const yellow1=
Math.floor(Math.random()*4);

const yellow2=
Math.floor(Math.random()*4);

const red1=
Math.random()<.12?1:0;

const red2=
Math.random()<.12?1:0;


/*
    أخطاء
*/

const fouls1=
Math.round(
7+Math.random()*9
);

const fouls2=
Math.round(
7+Math.random()*9
);


/*
    التمريرات
*/

const passes1=
Math.round(
280+
power1*1.8+
Math.random()*100
);

const passes2=
Math.round(
280+
power2*1.8+
Math.random()*100
);


/*
    رجل المباراة
*/

let manTeam;

if(goals1>goals2){

manTeam=1;

}else if(goals2>goals1){

manTeam=2;

}else{

manTeam=
power1>=power2?1:2;

}

const manPlayers=
manTeam===1?t1:t2;

let manPlayer=null;

positions.forEach(pos=>{

const p=manPlayers[pos];

if(!p)
return;

if(
!manPlayer||
(p.r||0)>(manPlayer.r||0)
){

manPlayer=p;

}

});


/*
    تحديد الفائز
*/

let winner=0;

if(goals1>goals2){

winner=1;

}else if(goals2>goals1){

winner=2;

}


/*
    البيانات كلها في Firebase
*/

const matchResult={

goals1,
goals2,

possession1,
possession2,

shots1,
shots2,

onTarget1,
onTarget2,

corners1,
corners2,

yellow1,
yellow2,

red1,
red2,

fouls1,
fouls2,

passes1,
passes2,

power1,
power2,

winner,

manPlayer:
manPlayer?
manPlayer.n:
"أفضل لاعب",

manTeam

};


roomRef.update({

matchResult:matchResult,

currentPos:positions.length

});

}

function createFormationHTML(team){

let html="";

positions.forEach(pos=>{

const p=team[pos];

if(!p)
return;

html+=`

<div class="formation-player">

<strong>
${pos}
</strong>

<br>

${p.n}

<br>

<span style="color:#ffd700">
${p.r}
</span>

</div>

`;

});

return html;

}


/* =====================================================
FINAL SOUND
===================================================== */

function playFinalSound(){

try{

if(!audioContext){

audioContext=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

const now=
audioContext.currentTime;

const notes=[
523.25,
659.25,
783.99,
1046.50
];

notes.forEach(
(freq,i)=>{

const osc=
audioContext.createOscillator();

const gain=
audioContext.createGain();

osc.type="triangle";

osc.frequency.value=freq;

gain.gain.setValueAtTime(
.001,
now+i*.13
);

gain.gain.exponentialRampToValueAtTime(
.25,
now+i*.13+.04
);

gain.gain.exponentialRampToValueAtTime(
.001,
now+i*.13+.3
);

osc.connect(gain);

gain.connect(
audioContext.destination
);

osc.start(
now+i*.13
);

osc.stop(
now+i*.13+.32
);

});

}catch(e){}

}
