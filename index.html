
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L&S GAMES | الإصدار الثالث</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    overflow:hidden;
}

body{
    font-family:'Cairo',sans-serif;
    background:#02030a;
    color:white;
}

/* ================= BACKGROUND ================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 35%, #17105b 0%, #080721 28%, #03040c 65%, #000 100%);
}

.background::before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,
        rgba(94,55,255,.35),
        rgba(0,150,255,.12) 35%,
        transparent 70%);
    filter:blur(20px);
    animation:pulse 4s infinite alternate;
}

@keyframes pulse{
    from{transform:translate(-50%,-50%) scale(.9);opacity:.65}
    to{transform:translate(-50%,-50%) scale(1.15);opacity:1}
}

/* ================= PARTICLES ================= */

.particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 10px #fff;
    animation:float linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(110vh) scale(.4);
        opacity:0;
    }
    10%{opacity:1}
    90%{opacity:1}
    100%{
        transform:translateY(-10vh) scale(1);
        opacity:0;
    }
}

/* ================= TOP BAR ================= */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:75px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid rgba(125,95,255,.25);
    background:rgba(3,3,14,.55);
    backdrop-filter:blur(15px);
    z-index:10;
}

.logo{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:25px;
    letter-spacing:2px;
    background:linear-gradient(90deg,#fff,#8e6cff,#25c8ff,#fff);
    background-size:300%;
    -webkit-background-clip:text;
    color:transparent;
    animation:logoMove 4s linear infinite;
}

@keyframes logoMove{
    0%{background-position:0%}
    100%{background-position:300%}
}

/* ================= MAIN ================= */

.main{
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:90px 20px 30px;
}

.card{
    width:min(470px,100%);
    text-align:center;
    padding:34px 25px 30px;
    border:1px solid rgba(130,100,255,.45);
    border-radius:30px;
    background:
        linear-gradient(145deg,
        rgba(26,20,75,.8),
        rgba(4,5,17,.92));
    box-shadow:
        0 0 30px rgba(79,45,255,.2),
        inset 0 0 30px rgba(100,70,255,.06);
    backdrop-filter:blur(20px);
    animation:cardIn 1.2s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn{
    0%{
        opacity:0;
        transform:translateY(60px) scale(.9);
    }
    100%{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* ================= ICON ================= */

.iconBox{
    width:115px;
    height:115px;
    margin:0 auto 22px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:35px;
    background:linear-gradient(145deg,#15104d,#070817);
    border:2px solid rgba(130,100,255,.7);
    box-shadow:
        0 0 20px rgba(110,75,255,.45),
        inset 0 0 25px rgba(91,56,255,.18);
    animation:iconFloat 3s ease-in-out infinite;
}

.iconBox::before{
    content:"";
    position:absolute;
    inset:-9px;
    border-radius:42px;
    border:1px solid rgba(86,153,255,.3);
    animation:rotate 8s linear infinite;
}

.iconBox::after{
    content:"";
    position:absolute;
    inset:-17px;
    border-radius:50%;
    border:1px dashed rgba(122,80,255,.18);
    animation:rotateReverse 12s linear infinite;
}

@keyframes iconFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

@keyframes rotate{
    to{transform:rotate(360deg)}
}

@keyframes rotateReverse{
    to{transform:rotate(-360deg)}
}

.tools{
    font-size:52px;
    filter:drop-shadow(0 0 12px #8060ff);
}

/* ================= TITLES ================= */

.smallTitle{
    font-size:13px;
    font-weight:800;
    letter-spacing:4px;
    color:#9b8cff;
    margin-bottom:7px;
    text-transform:uppercase;
}

h1{
    font-size:38px;
    line-height:1.15;
    font-weight:900;
    margin-bottom:9px;
    background:linear-gradient(90deg,#fff,#b6a8ff,#63d8ff,#fff);
    background-size:250%;
    -webkit-background-clip:text;
    color:transparent;
    animation:titleMove 5s linear infinite;
}

@keyframes titleMove{
    to{background-position:250%}
}

.version{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:6px 14px;
    border-radius:50px;
    background:rgba(104,70,255,.13);
    border:1px solid rgba(123,93,255,.4);
    color:#b9adff;
    font-family:'Orbitron',sans-serif;
    font-size:12px;
    margin-bottom:22px;
}

.versionDot{
    width:7px;
    height:7px;
    background:#55e0ff;
    border-radius:50%;
    box-shadow:0 0 10px #55e0ff;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{opacity:.2}
}

.description{
    color:#b9b8c9;
    font-size:15px;
    line-height:1.9;
    margin-bottom:25px;
}

/* ================= STATUS ================= */

.status{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:22px;
    color:#fff;
    font-weight:800;
    font-size:14px;
}

.statusLight{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ffc34d;
    box-shadow:0 0 15px #ffc34d;
    animation:statusPulse 1.4s infinite;
}

@keyframes statusPulse{
    50%{transform:scale(1.4);opacity:.45}
}

/* ================= PROGRESS ================= */

.progressArea{
    text-align:right;
    margin-bottom:25px;
}

.progressHeader{
    display:flex;
    justify-content:space-between;
    color:#a9a7b9;
    font-size:12px;
    margin-bottom:9px;
}

.progressBar{
    height:10px;
    width:100%;
    background:#0d0e1b;
    border-radius:20px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.06);
}

.progress{
    height:100%;
    width:78%;
    border-radius:20px;
    background:linear-gradient(90deg,#5734ff,#6e7aff,#39d9ff);
    box-shadow:
        0 0 12px rgba(85,100,255,.8);
    position:relative;
    animation:progressGlow 2s infinite alternate;
}

.progress::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    width:80px;
    right:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
    animation:shine 1.8s infinite;
}

@keyframes shine{
    from{transform:translateX(100px)}
    to{transform:translateX(-350px)}
}

@keyframes progressGlow{
    from{filter:brightness(.9)}
    to{filter:brightness(1.3)}
}

/* ================= FEATURES ================= */

.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-bottom:25px;
}

.feature{
    padding:12px 5px;
    border-radius:15px;
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.07);
}

.featureIcon{
    font-size:20px;
    margin-bottom:4px;
}

.featureText{
    font-size:10px;
    color:#aaa8bb;
}

/* ================= FOOTER ================= */

.footer{
    color:#656477;
    font-size:11px;
    line-height:1.8;
}

.footer strong{
    color:#8f82d7;
}

/* ================= RESPONSIVE ================= */

@media(max-height:700px){
    .card{
        padding:22px 20px;
    }

    .iconBox{
        width:85px;
        height:85px;
        margin-bottom:14px;
    }

    .tools{
        font-size:40px;
    }

    h1{
        font-size:30px;
    }

    .description{
        margin-bottom:15px;
        font-size:13px;
    }

    .features{
        margin-bottom:15px;
    }
}

@media(max-width:360px){
    h1{
        font-size:28px;
    }

    .card{
        padding:22px 16px;
    }

    .description{
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="background">

    <div class="particles" id="particles"></div>

    <header class="topbar">
        <div class="logo">L&amp;S GAMES</div>
    </header>

    <main class="main">

        <section class="card">

            <div class="iconBox">
                <div class="tools">⚙️</div>
            </div>

            <div class="smallTitle">L&amp;S GAMES</div>

            <h1>تحت الصيانة</h1>

            <div class="version">
                <span class="versionDot"></span>
                VERSION 3.0
            </div>

            <p class="description">
                بنجهّز لكم الإصدار الثالث من L&amp;S GAMES
                بتحديثات وتجهيزات جديدة تمامًا.
                <br>
                ارجع لنا قريبًا وشوف المفاجآت 🔥
            </p>

            <div class="status">
                <span class="statusLight"></span>
                جاري تطوير الإصدار الجديد...
            </div>

            <div class="progressArea">
                <div class="progressHeader">
                    <span>حالة التطوير</span>
                    <span>78%</span>
                </div>

                <div class="progressBar">
                    <div class="progress"></div>
                </div>
            </div>

            <div class="features">

                <div class="feature">
                    <div class="featureIcon">⚡</div>
                    <div class="featureText">أداء أسرع</div>
                </div>

                <div class="feature">
                    <div class="featureIcon">🎮</div>
                    <div class="featureText">تجربة جديدة</div>
                </div>

                <div class="feature">
                    <div class="featureIcon">🏆</div>
                    <div class="featureText">مفاجآت أكثر</div>
                </div>

            </div>

            <div class="footer">
                الإصدار الثالث قادم بقوة 🚀
                <br>
                <strong>L&amp;S GAMES © 2026</strong>
            </div>

        </section>

    </main>

</div>

<script>

/* إنشاء النجوم والجزيئات */
const particles = document.getElementById("particles");

for(let i = 0; i < 70; i++){

    const p = document.createElement("span");

    p.className = "particle";

    p.style.left = Math.random() * 100 + "%";

    p.style.animationDuration =
        (5 + Math.random() * 10) + "s";

    p.style.animationDelay =
        (Math.random() * 10) + "s";

    const size = 1 + Math.random() * 3;

    p.style.width = size + "px";
    p.style.height = size + "px";

    particles.appendChild(p);
}

/* تأثير بسيط عند لمس الشاشة */
document.addEventListener("touchstart", function(e){

    const x = e.touches[0].clientX;
    const y = e.touches[0].clientY;

    for(let i = 0; i < 8; i++){

        const spark = document.createElement("span");

        spark.style.position = "fixed";
        spark.style.left = x + "px";
        spark.style.top = y + "px";
        spark.style.width = "4px";
        spark.style.height = "4px";
        spark.style.borderRadius = "50%";
        spark.style.background = "white";
        spark.style.boxShadow = "0 0 12px #8060ff";
        spark.style.pointerEvents = "none";
        spark.style.zIndex = "100";

        document.body.appendChild(spark);

        const angle = Math.random() * Math.PI * 2;
        const distance = 25 + Math.random() * 60;

        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        spark.animate([
            {
                transform:"translate(0,0) scale(1)",
                opacity:1
            },
            {
                transform:`translate(${dx}px,${dy}px) scale(0)`,
                opacity:0
            }
        ],{
            duration:600 + Math.random()*300,
            easing:"cubic-bezier(.2,.8,.2,1)"
        });

        setTimeout(()=>{
            spark.remove();
        },1000);
    }

});

</script>

</body>
</html>
