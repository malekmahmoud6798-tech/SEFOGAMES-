
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>FOOTBALL ARENA - تسجيل الدخول</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:'Cairo',sans-serif;
    background:#02050a;
    color:#fff;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-10;
    background:
        radial-gradient(circle at 50% 15%,rgba(0,195,255,.18),transparent 32%),
        radial-gradient(circle at 10% 85%,rgba(0,80,255,.16),transparent 30%),
        radial-gradient(circle at 90% 75%,rgba(0,255,170,.10),transparent 25%),
        #02050a;
}

.bg::before{
    content:"";
    position:absolute;
    inset:-50%;
    background:
        linear-gradient(rgba(0,200,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,200,255,.035) 1px,transparent 1px);
    background-size:45px 45px;
    transform:perspective(600px) rotateX(62deg);
    animation:gridMove 10s linear infinite;
}

@keyframes gridMove{
    from{
        transform:perspective(600px) rotateX(62deg) translateY(0);
    }
    to{
        transform:perspective(600px) rotateX(62deg) translateY(45px);
    }
}

/* =========================
   GLOW BALL
========================= */

.glow-ball{
    position:absolute;
    width:360px;
    height:360px;
    border-radius:50%;
    left:50%;
    top:15%;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(circle,
        rgba(0,220,255,.22) 0%,
        rgba(0,150,255,.08) 35%,
        transparent 70%);
    filter:blur(10px);
    animation:ballPulse 4s ease-in-out infinite;
}

@keyframes ballPulse{
    0%,100%{
        opacity:.55;
        transform:translate(-50%,-50%) scale(.9);
    }
    50%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.15);
    }
}

/* =========================
   PARTICLES
========================= */

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-2;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#00d9ff;
    box-shadow:0 0 12px #00d9ff;
    animation:floatParticle linear infinite;
}

.particle:nth-child(1){left:8%;top:80%;animation-duration:7s}
.particle:nth-child(2){left:15%;top:45%;animation-duration:9s}
.particle:nth-child(3){left:24%;top:90%;animation-duration:8s}
.particle:nth-child(4){left:35%;top:35%;animation-duration:11s}
.particle:nth-child(5){left:47%;top:80%;animation-duration:6s}
.particle:nth-child(6){left:58%;top:30%;animation-duration:10s}
.particle:nth-child(7){left:68%;top:75%;animation-duration:8s}
.particle:nth-child(8){left:78%;top:40%;animation-duration:12s}
.particle:nth-child(9){left:88%;top:82%;animation-duration:7s}
.particle:nth-child(10){left:94%;top:20%;animation-duration:9s}

@keyframes floatParticle{
    0%{
        transform:translateY(80px) scale(.5);
        opacity:0;
    }
    15%{
        opacity:1;
    }
    85%{
        opacity:1;
    }
    100%{
        transform:translateY(-350px) scale(1.2);
        opacity:0;
    }
}

/* =========================
   MAIN
========================= */

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 16px;
}

.container{
    width:100%;
    max-width:430px;
    position:relative;
}

/* =========================
   LOGO
========================= */

.logo{
    text-align:center;
    margin-bottom:20px;
    animation:logoEnter .9s ease both;
}

.logo-icon{
    width:78px;
    height:78px;
    margin:auto;
    border-radius:50%;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(circle at 35% 30%,#ffffff 0%,#b8f7ff 7%,#006cff 45%,#001a46 100%);

    border:2px solid rgba(255,255,255,.7);

    box-shadow:
        0 0 15px rgba(0,200,255,.8),
        0 0 40px rgba(0,100,255,.5),
        inset 0 0 20px rgba(255,255,255,.3);

    animation:logoSpin 8s linear infinite;
}

.logo-icon::before{
    content:"⚽";
    font-size:43px;
    filter:drop-shadow(0 0 7px #fff);
}

.logo-ring{
    position:absolute;
    inset:-8px;
    border:1px solid rgba(0,220,255,.7);
    border-radius:50%;
    border-top-color:transparent;
    border-bottom-color:transparent;
    animation:ringSpin 3s linear infinite;
}

@keyframes logoSpin{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-5px);
    }
}

@keyframes ringSpin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes logoEnter{
    from{
        opacity:0;
        transform:translateY(-30px) scale(.8);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.brand{
    margin-top:16px;
    font-family:'Orbitron',sans-serif;
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;

    background:linear-gradient(
        90deg,
        #ffffff,
        #7eeeff,
        #00bfff,
        #ffffff
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:0 0 20px rgba(0,200,255,.4);
}

.brand-sub{
    margin-top:3px;
    color:#6f899d;
    font-size:11px;
    letter-spacing:3px;
    font-family:'Orbitron',sans-serif;
}

/* =========================
   CARD
========================= */

.card{
    position:relative;
    padding:30px 23px 24px;

    background:
        linear-gradient(
            145deg,
            rgba(13,28,43,.96),
            rgba(3,9,16,.98)
        );

    border:1px solid rgba(0,209,255,.28);

    clip-path:polygon(
        0 15px,
        15px 0,
        calc(100% - 15px) 0,
        100% 15px,
        100% calc(100% - 15px),
        calc(100% - 15px) 100%,
        15px 100%,
        0 calc(100% - 15px)
    );

    box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        0 0 45px rgba(0,145,255,.10);

    animation:cardEnter .8s .15s ease both;
}

.card::before{
    content:"";
    position:absolute;
    inset:1px;

    border:1px solid rgba(255,255,255,.05);

    clip-path:inherit;
    pointer-events:none;
}

.card::after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:70%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.06),
        transparent
    );

    transform:skewX(-20deg);
    animation:cardShine 5s ease-in-out infinite;
    pointer-events:none;
}

@keyframes cardEnter{
    from{
        opacity:0;
        transform:translateY(35px) scale(.96);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes cardShine{
    0%,65%{
        left:-100%;
    }
    85%{
        left:140%;
    }
    100%{
        left:140%;
    }
}

/* =========================
   TITLE
========================= */

.form-title{
    text-align:center;
    font-size:25px;
    font-weight:900;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#718b9d;
    font-size:12px;
    margin-bottom:23px;
}

/* =========================
   MESSAGES
========================= */

.message{
    min-height:24px;
    text-align:center;
    font-size:13px;
    font-weight:800;
    margin-bottom:5px;
}

.error{
    color:#ff5964;
    text-shadow:0 0 10px rgba(255,40,60,.25);
}

.success{
    color:#43f0a5;
    text-shadow:0 0 10px rgba(0,255,150,.25);
}

/* =========================
   INPUTS
========================= */

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    color:#a8bac7;
    font-size:12px;
    font-weight:800;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
}

.input-icon{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    font-size:16px;
    opacity:.7;
}

input{
    width:100%;
    height:52px;

    padding:0 44px 0 15px;

    color:#fff;
    background:#06101a;

    border:1px solid #183244;
    border-radius:10px;

    outline:none;

    font-family:'Cairo',sans-serif;
    font-size:14px;

    transition:.25s;
}

input::placeholder{
    color:#496171;
}

input:focus{
    border-color:#00cfff;
    background:#071520;

    box-shadow:
        0 0 0 3px rgba(0,200,255,.07),
        0 0 20px rgba(0,200,255,.08);
}

/* =========================
   FORGOT
========================= */

.forgot{
    text-align:left;
    margin-top:-4px;
    margin-bottom:16px;
}

.forgot a{
    color:#00cfff;
    font-size:11px;
    font-weight:800;
    text-decoration:none;
    cursor:pointer;
}

/* =========================
   MAIN BUTTON
========================= */

.login-btn{
    width:100%;
    height:54px;

    border:0;
    border-radius:10px;

    color:#001018;

    background:
        linear-gradient(
            90deg,
            #00d9ff,
            #00aaff,
            #00f0b0
        );

    font-family:'Cairo',sans-serif;
    font-size:17px;
    font-weight:900;

    cursor:pointer;

    position:relative;
    overflow:hidden;

    box-shadow:
        0 8px 25px rgba(0,190,255,.22);

    transition:.2s;
}

.login-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:60%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.45),
        transparent
    );

    transform:skewX(-20deg);
    transition:.5s;
}

.login-btn:hover::before{
    left:130%;
}

.login-btn:active{
    transform:scale(.98);
}

.login-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================
   BUTTON LOADER
========================= */

.btn-content{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.spinner{
    width:19px;
    height:19px;

    border:3px solid rgba(0,0,0,.15);
    border-top-color:#001018;

    border-radius:50%;

    animation:spin 1s linear infinite;
    display:none;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   DIVIDER
========================= */

.divider{
    display:flex;
    align-items:center;
    gap:10px;

    color:#506879;
    font-size:11px;
    font-weight:800;

    margin:20px 0;
}

.divider::before,
.divider::after{
    content:"";
    height:1px;
    flex:1;
    background:linear-gradient(
        90deg,
        transparent,
        #203847
    );
}

.divider::after{
    background:linear-gradient(
        90deg,
        #203847,
        transparent
    );
}

/* =========================
   GOOGLE
========================= */

.google-btn{
    width:100%;
    height:50px;

    border:1px solid #263d4d;
    border-radius:10px;

    background:#08131d;
    color:#fff;

    font-family:'Cairo',sans-serif;
    font-size:13px;
    font-weight:800;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    transition:.2s;
}

.google-btn:hover{
    border-color:#5a7383;
    background:#0b1823;
}

.google-btn:active{
    transform:scale(.98);
}

.google-btn img{
    width:20px;
    height:20px;
}

/* =========================
   SIGN UP
========================= */

.signup{
    text-align:center;
    color:#62798a;
    font-size:12px;
    margin-top:19px;
}

.signup a{
    color:#00d4ff;
    font-weight:900;
    cursor:pointer;
    text-decoration:none;
}

/* =========================
   BOTTOM
========================= */

.footer{
    text-align:center;
    margin-top:16px;
    color:#304755;
    font-size:9px;
    letter-spacing:1px;
    font-family:'Orbitron',sans-serif;
}

/* =========================
   FULL SCREEN LOADING
========================= */

.overlay{
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at center,
            rgba(0,110,180,.20),
            rgba(0,0,0,.97) 65%
        );

    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    z-index:9999;
}

.overlay-logo{
    width:80px;
    height:80px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            #fff 0%,
            #00bfff 30%,
            #003c75 100%
        );

    box-shadow:
        0 0 25px #00cfff,
        0 0 70px rgba(0,180,255,.4);

    animation:overlayPulse 1.3s infinite;
}

.overlay-logo::after{
    content:"⚽";
    font-size:42px;
}

@keyframes overlayPulse{
    0%,100%{
        transform:scale(.92);
    }
    50%{
        transform:scale(1.08);
    }
}

.overlay-text{
    margin-top:22px;
    font-size:15px;
    font-weight:900;
    color:#fff;
}

.overlay-sub{
    margin-top:5px;
    font-size:10px;
    color:#628294;
    letter-spacing:2px;
    font-family:'Orbitron',sans-serif;
}

/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .page{
        padding:18px 12px;
    }

    .logo{
        margin-bottom:15px;
    }

    .logo-icon{
        width:67px;
        height:67px;
    }

    .logo-icon::before{
        font-size:37px;
    }

    .brand{
        font-size:21px;
    }

    .card{
        padding:25px 18px 21px;
    }

    .form-title{
        font-size:22px;
    }

    input{
        height:50px;
    }

    .login-btn{
        height:52px;
    }
}

</style>
</head>

/* =====================================================
   SAVE USER
===================================================== */

function saveUserData(user){

    if(!user) return;

    localStorage.setItem(
        "isLoggedIn",
        "true"
    );

    localStorage.setItem(
        "email",
        user.email || ""
    );

    localStorage.setItem(
        "avatar",
        user.photoURL ||
        "https://i.imgur.com/8Km9tLL.png"
    );

    localStorage.setItem(
        "uid",
        user.uid
    );

    localStorage.setItem(
        "displayName",
        user.displayName ||
        (
            user.email
                ? user.email.split("@")[0]
                : "Player"
        )
    );

}


/* =====================================================
   LOAD USER DATA FROM FIREBASE
===================================================== */

async function loadUserData(uid){

    if(!uid) return;

    try{

        const userRef =
            ref(db,"users/" + uid);

        const snapshot =
            await get(userRef);


        if(snapshot.exists()){

            const data =
                snapshot.val() || {};

            localStorage.setItem(
                "xp",
                data.xp ?? 0
            );

            localStorage.setItem(
                "التذاكر",
                data.tickets ?? 5
            );

        }else{

            const currentUser =
                auth.currentUser;

            const newUserData = {

                xp:0,

                tickets:5,

                email:
                    currentUser?.email || "",

                displayName:
                    currentUser?.displayName ||
                    (
                        currentUser?.email
                        ? currentUser.email.split("@")[0]
                        : "Player"
                    ),

                avatar:
                    currentUser?.photoURL || ""

            };


            await set(
                userRef,
                newUserData
            );


            localStorage.setItem(
                "xp",
                "0"
            );

            localStorage.setItem(
                "التذاكر",
                "5"
            );

        }

    }catch(error){

        console.error(
            "Firebase user data error:",
            error
        );

        /*
           لا نوقف الدخول بسبب مشكلة مؤقتة
           في قراءة بيانات اللاعب.
        */

        if(
            localStorage.getItem("xp") === null
        ){

            localStorage.setItem(
                "xp",
                "0"
            );

        }

        if(
            localStorage.getItem("التذاكر") === null
        ){

            localStorage.setItem(
                "التذاكر",
                "5"
            );

        }

    }

}


/* =====================================================
   GO HOME
===================================================== */

async function goHome(user){

    if(!user || redirecting) return;

    redirecting = true;

    saveUserData(user);

    showOverlay(
        "تم تسجيل الدخول ✓"
    );

    await loadUserData(
        user.uid
    );

    setTimeout(() => {

        window.location.replace(
            HOME_PAGE
        );

    },350);

}

onAuthStateChanged(

/* =====================================================
   VALIDATION
===================================================== */

function validateForm(
    email,
    password
){

    clearMessages();

    const emailRegex =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if(!emailRegex.test(email)){

        showError(
            "اكتب بريد إلكتروني صحيح"
        );

        return false;

    }


    if(password.length < 6){

        showError(
            "كلمة السر لازم تكون 6 حروف على الأقل"
        );

        return false;

    }


    return true;

}


/* =====================================================
   BUTTON LOADING
===================================================== */

function setButtonLoading(
    loading,
    text
){

    submitBtn.disabled =
        loading;

    btnSpinner.style.display =
        loading
        ? "block"
        : "none";

    btnText.textContent =
        text;

}

forgotBtn.addEventListener(

            return;

        }


        const emailRegex =

            );

        clearMessages();

            );

    }
);


/* =====================================================
   LOGIN / REGISTER
===================================================== */

authForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value.trim();


        if(
            !validateForm(
                email,
                password
            )
        ){

            return;

        }


        clearMessages();


        setButtonLoading(
            true,
            isLogin
                ? "جاري الدخول..."
                : "جاري إنشاء الحساب..."
        );


        showOverlay(
            isLogin
                ? "جاري تسجيل الدخول..."
                : "جاري إنشاء حسابك..."
        );


        try{

            let userCredential;


            if(isLogin){

                userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

            }else{

                userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

            }


            const user =
                userCredential.user;


            saveUserData(user);


            await loadUserData(
                user.uid
            );


            await goHome(user);


        }catch(error){

            console.error(
                "Authentication error:",
                error
            );


            hideOverlay();


            setButtonLoading(
                false,
                isLogin
                    ? "دخول إلى اللعبة ⚽"
                    : "إنشاء الحساب 🚀"
            );


            let message =
                "حصل خطأ، حاول مرة أخرى";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                message =
                    "البريد الإلكتروني أو كلمة السر غلط";

            }else if(
                error.code ===
                "auth/user-not-found"
            ){

                message =
                    "الحساب ده مش موجود";

            }else if(
                error.code ===
                "auth/wrong-password"
            ){

                message =
                    "كلمة السر غلط";

            }else if(
                error.code ===
                "auth/email-already-in-use"
            ){

                message =
                    "الإيميل ده مستخدم بالفعل";

            }else if(
                error.code ===
                "auth/weak-password"
            ){

                message =
                    "كلمة السر ضعيفة، استخدم 6 حروف على الأقل";

            }else if(
                error.code ===
                "auth/invalid-email"
            ){

                message =
                    "البريد الإلكتروني غير صحيح";

            }else if(
                error.code ===
                "auth/too-many-requests"
            ){

                message =
                    "محاولات كثيرة، حاول بعد شوية";

            }


            showError(message);

        }

    }
);
